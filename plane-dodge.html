<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>비행기 총알 피하기 - 무료 탄막 게임</title>

    <meta
            name="description"
            content="사방에서 쏟아지는 총알을 피해 비행기를 조종하는 무료 웹 탄막 게임입니다. 마우스, 방향키, 모바일 드래그를 지원합니다."
    >
    <meta
            name="keywords"
            content="비행기 총알 피하기, 탄막 게임, 비행기 게임, 피하기 게임, 웹 게임, 무료 게임"
    >

    <meta property="og:title" content="✈️ 비행기 총알 피하기">
    <meta
            property="og:description"
            content="사방에서 쏟아지는 총알을 피해 최대한 오래 살아남으세요."
    >
    <meta property="og:type" content="website">

    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="manifest" href="/manifest.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
    >

    <style>
        :root {
            --background: #ffffff;
            --surface: #ffffff;
            --surface-soft: #f8fafc;

            --text: #111827;
            --text-soft: #6b7280;

            --border: #e5e7eb;
            --border-dark: #cbd5e1;

            --game-background: #0b1026;

            --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
            --radius: 24px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: var(--background);
            color: var(--text);

            font-family: "Noto Sans KR", sans-serif;
            letter-spacing: -0.04em;
            word-break: keep-all;
        }

        button {
            font: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: min(100% - 32px, 800px);
            margin: 0 auto;
            padding: 60px 0;
        }

        .page-header {
            margin-bottom: 28px;
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;

            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 800;
            line-height: 1.2;
        }

        .lead {
            max-width: 680px;
            margin: 0 auto;

            color: var(--text-soft);

            font-size: 1.05rem;
            line-height: 1.8;
        }

        .card {
            padding: 24px;

            background: var(--surface);

            border: 1px solid var(--border);
            border-radius: var(--radius);

            box-shadow: var(--shadow);
        }

        /* HUD */

        .type-hud {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;

            gap: 8px;

            margin-bottom: 16px;
        }

        .hud-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;

            min-height: 42px;
            padding: 8px 14px;

            background: var(--surface-soft);

            border: 1px solid var(--border);
            border-radius: 14px;

            color: var(--text-soft);

            font-size: 0.88rem;
            white-space: nowrap;
        }

        .hud-item strong {
            color: var(--text);

            font-size: 1rem;
            font-weight: 800;
        }

        .hud-item small {
            font-size: 0.78rem;
        }

        .secondary {
            min-height: 42px;
            padding: 8px 13px;

            background: #ffffff;
            color: var(--text);

            border: 1px solid var(--border-dark);
            border-radius: 14px;

            cursor: pointer;

            font-weight: 700;

            transition:
                    background 0.15s ease,
                    border-color 0.15s ease,
                    transform 0.15s ease;
        }

        .secondary:hover {
            background: var(--surface-soft);
            border-color: #94a3b8;
        }

        .secondary:active {
            transform: scale(0.97);
        }

        .secondary:focus-visible {
            outline: 3px solid rgba(15, 23, 42, 0.12);
            outline-offset: 2px;
        }

        .sfx-button {
            width: 44px;
            padding: 7px;

            font-size: 1rem;
            line-height: 1;
        }

        /* Canvas */

        .game-wrap {
            position: relative;

            width: 100%;

            overflow: hidden;

            background: var(--game-background);

            border-radius: 16px;
        }

        #game {
            display: block;

            width: 100%;

            background: var(--game-background);

            border-radius: 16px;

            cursor: crosshair;

            touch-action: none;

            user-select: none;
            -webkit-user-select: none;
        }

        .game-help {
            margin: 12px 0 0;

            color: var(--text-soft);

            font-size: 0.85rem;
            line-height: 1.7;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                width: min(100% - 20px, 800px);
                padding: 32px 0;
            }

            .card {
                padding: 14px;

                border-radius: 20px;
            }

            .type-hud {
                display: grid;
                grid-template-columns:
          repeat(3, minmax(0, 1fr))
          42px;

                gap: 6px;
            }

            .hud-item {
                flex-direction: column;
                justify-content: center;

                min-width: 0;
                min-height: 50px;

                padding: 5px 3px;

                font-size: 0.74rem;
            }

            .hud-item strong {
                font-size: 0.88rem;
            }

            .sfx-button {
                width: 42px;
                min-height: 50px;
            }

            .game-help {
                font-size: 0.78rem;
            }
        }

        @media (max-width: 400px) {
            .container {
                width: min(100% - 12px, 800px);
            }

            .card {
                padding: 10px;
            }

            .hud-item {
                font-size: 0.7rem;
            }

            .hud-item strong {
                font-size: 0.82rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

<main class="container">

    <header class="page-header">

        <h1>✈️ 비행기 총알 피하기</h1>

        <p class="lead">
            사방에서 쏟아지는 총알을 피해 비행기를 조종하세요.
            시간이 지날수록 탄막이 거세집니다.
            몇 초나 버틸 수 있을까요?
        </p>

    </header>

    <section
            class="card typing-card"
            aria-label="비행기 총알 피하기 게임"
    >

        <div class="type-hud">

        <span class="hud-item">
          생존
          <strong id="hud-time">0.0</strong>
          <small>초</small>
        </span>

            <span class="hud-item">
          탄막 레벨
          <strong id="hud-level">1</strong>
        </span>

            <span class="hud-item">
          최고 기록
          <strong id="hud-best">0.0</strong>
          <small>초</small>
        </span>

            <button
                    id="sfx-btn"
                    class="secondary sfx-button"
                    type="button"
                    title="효과음 켜기 또는 끄기"
                    aria-label="효과음 켜기 또는 끄기"
                    aria-pressed="false"
            >
                🔇
            </button>

        </div>

        <div class="game-wrap">

            <canvas
                    id="game"
                    aria-label="비행기 총알 피하기 게임 화면"
            ></canvas>

        </div>

        <p class="game-help">
            💻 PC: 마우스 이동 또는 방향키 ·
            📱 모바일: 드래그한 만큼 비행기가 움직입니다
            (손가락 아래에 있지 않아도 OK)
        </p>

    </section>

</main>

<script>
    "use strict";

    /*
     * Plane Bullet Dodge
     * Vanilla JavaScript
     */

    const $ = function (id) {
        return document.getElementById(id);
    };

    const canvas =
              $("game");

    const ctx =
              canvas.getContext("2d");

    /*
     * 최고 기록만 저장
     *
     * 랭킹 기능은 제거
     */

    const BEST_KEY =
              "plane_best_v1";

    const SFX_KEY =
              "plane_sfx_v1";

    /*
     * Canvas
     */

    let width = 0;
    let height = 0;
    let dpr = 1;

    function resizeCanvas() {

        dpr =
            Math.min(
                2,
                window.devicePixelRatio ||
                1
            );

        width =
            canvas.clientWidth;

        height =
            Math.min(
                560,
                Math.max(
                    420,
                    Math.round(
                        window.innerHeight *
                        0.6
                    )
                )
            );

        canvas.style.height =
            height + "px";

        canvas.width =
            Math.round(
                width * dpr
            );

        canvas.height =
            Math.round(
                height * dpr
            );

        ctx.setTransform(
            dpr,
            0,
            0,
            dpr,
            0,
            0
        );

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";
    }

    /*
     * 상태
     */

    let state = "idle";

    let player = null;

    let bullets = [];

    let stars = [];

    let particles = [];

    let toasts = [];

    let survivalTime = 0;

    let spawnAccumulator = 0;

    let lastTimestamp = 0;

    let lastLevel = 1;

    let lastGrazeTime = 0;

    let shake = 0;

    const keys = {};

    /*
     * 실제 피격 반경
     *
     * 그림보다 작게 설정하여
     * 탄막 게임 특유의 판정 구현
     */

    const HIT_RADIUS = 7;

    /*
     * 최고 기록
     */

    function getBestRecord() {

        const value =
                  Number(
                      localStorage.getItem(
                          BEST_KEY
                      ) || 0
                  );

        return Number.isFinite(value)
            ? value
            : 0;
    }

    function saveBestRecord(
        time
    ) {

        const oldBest =
                  getBestRecord();

        if (
            time > oldBest
        ) {

            const newBest =
                      Math.round(
                          time * 10
                      ) / 10;

            localStorage.setItem(
                BEST_KEY,
                String(newBest)
            );

            return true;
        }

        return false;
    }

    function updateBestHud() {

        $("hud-best")
            .textContent =
            getBestRecord()
            .toFixed(1);
    }

    /*
     * 효과음
     */

    let sfxEnabled =
            localStorage.getItem(
                SFX_KEY
            ) === "1";

    let audioContext = null;

    function updateSfxButton() {

        $("sfx-btn")
            .textContent =
            sfxEnabled
                ? "🔊"
                : "🔇";

        $("sfx-btn")
        .setAttribute(
            "aria-pressed",
            String(sfxEnabled)
        );

        $("sfx-btn")
        .setAttribute(
            "aria-label",
            sfxEnabled
                ? "효과음 끄기"
                : "효과음 켜기"
        );
    }

    function getAudioContext() {

        if (!audioContext) {

            const AudioContextClass =
                      window.AudioContext ||
                      window.webkitAudioContext;

            if (!AudioContextClass) {
                return null;
            }

            audioContext =
                new AudioContextClass();
        }

        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();
        }

        return audioContext;
    }

    function playTone(
        frequency,
        duration,
        volume,
        type
    ) {

        if (!sfxEnabled) {
            return;
        }

        const context =
                  getAudioContext();

        if (!context) {
            return;
        }

        const oscillator =
                  context.createOscillator();

        const gain =
                  context.createGain();

        oscillator.type =
            type || "sine";

        oscillator.frequency
        .setValueAtTime(
            frequency,
            context.currentTime
        );

        gain.gain
        .setValueAtTime(
            volume,
            context.currentTime
        );

        gain.gain
        .exponentialRampToValueAtTime(
            0.001,
            context.currentTime +
            duration
        );

        oscillator.connect(gain);

        gain.connect(
            context.destination
        );

        oscillator.start();

        oscillator.stop(
            context.currentTime +
            duration
        );
    }

    function playClickSound() {

        playTone(
            420,
            0.06,
            0.025,
            "sine"
        );
    }

    function playGrazeSound() {

        playTone(
            760,
            0.035,
            0.012,
            "sine"
        );
    }

    function playLevelSound() {

        playTone(
            550,
            0.08,
            0.025,
            "sine"
        );

        window.setTimeout(
            function () {

                playTone(
                    800,
                    0.12,
                    0.025,
                    "sine"
                );

            },
            70
        );
    }

    function playBoomSound() {

        playTone(
            100,
            0.4,
            0.055,
            "sawtooth"
        );

        window.setTimeout(
            function () {

                playTone(
                    55,
                    0.55,
                    0.04,
                    "square"
                );

            },
            80
        );
    }

    $("sfx-btn")
    .addEventListener(
        "click",
        function () {

            sfxEnabled =
                !sfxEnabled;

            localStorage.setItem(
                SFX_KEY,
                sfxEnabled
                    ? "1"
                    : "0"
            );

            updateSfxButton();

            if (sfxEnabled) {

                playTone(
                    700,
                    0.08,
                    0.03,
                    "sine"
                );
            }
        }
    );

    /*
     * 파티클
     */

    function burst(
        x,
        y,
        colors,
        count,
        speed
    ) {

        const particleCount =
                  count === undefined
                      ? 18
                      : count;

        const particleSpeed =
                  speed === undefined
                      ? 240
                      : speed;

        for (
            let i = 0;
            i < particleCount;
            i++
        ) {

            const angle =
                      Math.random() *
                      Math.PI *
                      2;

            const velocity =
                      particleSpeed *
                      (
                          0.3 +
                          Math.random()
                      );

            particles.push({
                x: x,
                y: y,

                vx:
                    Math.cos(angle) *
                    velocity,

                vy:
                    Math.sin(angle) *
                    velocity,

                life:
                    0.4 +
                    Math.random() *
                    0.5,

                size:
                    1.5 +
                    Math.random() *
                    3.5,

                color:
                    colors[
                        Math.floor(
                            Math.random() *
                            colors.length
                        )
                        ]
            });
        }
    }

    function updateEffects(
        deltaTime
    ) {

        for (
            let i =
                    particles.length - 1;

            i >= 0;

            i--
        ) {

            const particle =
                      particles[i];

            particle.life -=
                deltaTime;

            if (
                particle.life <= 0
            ) {

                particles.splice(
                    i,
                    1
                );

                continue;
            }

            particle.x +=
                particle.vx *
                deltaTime;

            particle.y +=
                particle.vy *
                deltaTime;

            particle.vx *=
                1 -
                1.5 *
                deltaTime;

            particle.vy *=
                1 -
                1.5 *
                deltaTime;
        }

        shake =
            shake > 0.4
                ? shake *
                Math.pow(
                    0.002,
                    deltaTime
                )
                : 0;
    }

    /*
     * 안내 메시지
     */

    function showToast(
        text
    ) {

        toasts.push({
            text: text,
            until:
                survivalTime +
                2.4
        });
    }

    /*
     * 별
     */

    function makeStars() {

        stars =
            Array.from(
                {
                    length: 60
                },

                function () {

                    return {
                        x:
                            Math.random() *
                            width,

                        y:
                            Math.random() *
                            height,

                        radius:
                            Math.random() *
                            1.5 +
                            0.4,

                        speed:
                            14 +
                            Math.random() *
                            40
                    };
                }
            );
    }

    /*
     * 초기화
     */

    function resetGame() {

        player = {
            x:
                width / 2,

            y:
                height * 0.7,

            targetX:
                width / 2,

            targetY:
                height * 0.7
        };

        bullets = [];

        particles = [];

        toasts = [];

        survivalTime = 0;

        spawnAccumulator = 0;

        lastTimestamp = 0;

        lastLevel = 1;

        lastGrazeTime = 0;

        shake = 0;

        $("hud-time")
            .textContent =
            "0.0";

        $("hud-level")
            .textContent =
            "1";
    }

    /*
     * 난이도
     *
     * 0~9초   Lv.1
     * 10~19초 Lv.2
     * ...
     * 최대 Lv.10
     */

    function getLevel() {

        return Math.min(
            10,
            1 +
            Math.floor(
                survivalTime /
                10
            )
        );
    }

    function getSpawnInterval() {

        return Math.max(
            0.05,
            0.34 -
            getLevel() *
            0.028
        );
    }

    function getBulletSpeed() {

        return (
            110 +
            getLevel() *
            26 +
            Math.random() *
            50
        );
    }

    /*
     * 총알 생성
     */

    function spawnBullet() {

        const side =
                  Math.floor(
                      Math.random() *
                      4
                  );

        const margin = 16;

        let x;
        let y;

        /*
         * 화면 사방에서 생성
         */

        if (
            side === 0
        ) {

            x =
                Math.random() *
                width;

            y = -margin;

        } else if (
            side === 1
        ) {

            x =
                width +
                margin;

            y =
                Math.random() *
                height;

        } else if (
            side === 2
        ) {

            x =
                Math.random() *
                width;

            y =
                height +
                margin;

        } else {

            x = -margin;

            y =
                Math.random() *
                height;
        }

        let angle;

        /*
         * Lv.3 이상:
         * 30% 확률 플레이어 조준
         */

        if (
            getLevel() >= 3 &&
            Math.random() < 0.3
        ) {

            angle =
                Math.atan2(
                    player.y - y,
                    player.x - x
                ) +
                (
                    Math.random() -
                    0.5
                ) *
                0.2;

        } else {

            /*
             * 화면 중앙 부근을
             * 느슨하게 조준
             */

            angle =
                Math.atan2(
                    height / 2 -
                    y +
                    (
                        Math.random() -
                        0.5
                    ) *
                    height,

                    width / 2 -
                    x +
                    (
                        Math.random() -
                        0.5
                    ) *
                    width
                );
        }

        const velocity =
                  getBulletSpeed();

        bullets.push({
            x: x,
            y: y,

            vx:
                Math.cos(angle) *
                velocity,

            vy:
                Math.sin(angle) *
                velocity,

            radius:
                2.6 +
                Math.random() *
                1.6,

            grazed: false
        });
    }

    /*
     * 메인 루프
     */

    function frame(
        timestamp
    ) {

        if (
            state !== "playing"
        ) {
            return;
        }

        if (
            !lastTimestamp
        ) {

            lastTimestamp =
                timestamp;
        }

        const deltaTime =
                  Math.min(
                      0.05,
                      (
                          timestamp -
                          lastTimestamp
                      ) / 1000
                  );

        lastTimestamp =
            timestamp;

        survivalTime +=
            deltaTime;

        /*
         * 방향키 이동
         */

        const keyboardSpeed =
                  300 *
                  deltaTime;

        if (
            keys.ArrowLeft
        ) {

            player.targetX -=
                keyboardSpeed *
                1.6;
        }

        if (
            keys.ArrowRight
        ) {

            player.targetX +=
                keyboardSpeed *
                1.6;
        }

        if (
            keys.ArrowUp
        ) {

            player.targetY -=
                keyboardSpeed *
                1.6;
        }

        if (
            keys.ArrowDown
        ) {

            player.targetY +=
                keyboardSpeed *
                1.6;
        }

        /*
         * 화면 밖 이동 방지
         */

        player.targetX =
            Math.max(
                14,
                Math.min(
                    width - 14,
                    player.targetX
                )
            );

        player.targetY =
            Math.max(
                14,
                Math.min(
                    height - 14,
                    player.targetY
                )
            );

        /*
         * 목표 좌표를 부드럽게 추적
         */

        player.x +=
            (
                player.targetX -
                player.x
            ) *
            Math.min(
                1,
                deltaTime *
                14
            );

        player.y +=
            (
                player.targetY -
                player.y
            ) *
            Math.min(
                1,
                deltaTime *
                14
            );

        /*
         * 총알 생성
         */

        spawnAccumulator +=
            deltaTime;

        const interval =
                  getSpawnInterval();

        while (
            spawnAccumulator >=
            interval
            ) {

            spawnAccumulator -=
                interval;

            spawnBullet();
        }

        /*
         * 총알 이동 및 충돌
         */

        const bulletMargin = 40;

        for (
            let i =
                    bullets.length - 1;

            i >= 0;

            i--
        ) {

            const bullet =
                      bullets[i];

            bullet.x +=
                bullet.vx *
                deltaTime;

            bullet.y +=
                bullet.vy *
                deltaTime;

            /*
             * 화면 밖 총알 제거
             */

            if (
                bullet.x <
                -bulletMargin ||
                bullet.x >
                width +
                bulletMargin ||
                bullet.y <
                -bulletMargin ||
                bullet.y >
                height +
                bulletMargin
            ) {

                bullets.splice(
                    i,
                    1
                );

                continue;
            }

            const dx =
                      bullet.x -
                      player.x;

            const dy =
                      bullet.y -
                      player.y;

            const distanceSquared =
                      dx * dx +
                      dy * dy;

            /*
             * 실제 충돌
             */

            const hitDistance =
                      bullet.radius +
                      HIT_RADIUS;

            if (
                distanceSquared <
                hitDistance *
                hitDistance
            ) {

                gameOver();

                return;
            }

            /*
             * 아슬아슬하게 스치기
             */

            const grazeDistance =
                      bullet.radius +
                      HIT_RADIUS +
                      12;

            if (
                !bullet.grazed &&
                distanceSquared <
                grazeDistance *
                grazeDistance
            ) {

                bullet.grazed =
                    true;

                burst(
                    (
                        bullet.x +
                        player.x
                    ) / 2,

                    (
                        bullet.y +
                        player.y
                    ) / 2,

                    [
                        "#ffffff",
                        "#9cc0ff"
                    ],

                    3,
                    120
                );

                if (
                    survivalTime -
                    lastGrazeTime >
                    0.15
                ) {

                    lastGrazeTime =
                        survivalTime;

                    playGrazeSound();
                }
            }
        }

        /*
         * 별 배경 이동
         */

        for (
            const star of stars
            ) {

            star.y +=
                star.speed *
                deltaTime;

            if (
                star.y > height
            ) {

                star.y = 0;

                star.x =
                    Math.random() *
                    width;
            }
        }

        /*
         * 엔진 불꽃
         */

        particles.push({
            x:
                player.x +
                (
                    Math.random() -
                    0.5
                ) *
                6,

            y:
                player.y +
                15,

            vx:
                (
                    Math.random() -
                    0.5
                ) *
                20,

            vy:
                90 +
                Math.random() *
                50,

            life:
                0.25 +
                Math.random() *
                0.15,

            size:
                1.5 +
                Math.random() *
                2,

            color:
                Math.random() < 0.5
                    ? "#ffd76a"
                    : "#ff8c42"
        });

        updateEffects(
            deltaTime
        );

        /*
         * 레벨 변경
         */

        const currentLevel =
                  getLevel();

        if (
            currentLevel !==
            lastLevel
        ) {

            lastLevel =
                currentLevel;

            if (
                currentLevel > 1
            ) {

                showToast(
                    "⚡ 탄막 레벨 " +
                    currentLevel
                );

                playLevelSound();
            }
        }

        /*
         * HUD
         */

        $("hud-time")
            .textContent =
            survivalTime.toFixed(1);

        $("hud-level")
            .textContent =
            String(
                currentLevel
            );

        draw();

        requestAnimationFrame(
            frame
        );
    }

    /*
     * 화면 그리기
     */

    function draw() {

        ctx.clearRect(
            0,
            0,
            width,
            height
        );

        /*
         * 배경
         */

        ctx.fillStyle =
            "#0b1026";

        ctx.fillRect(
            0,
            0,
            width,
            height
        );

        ctx.save();

        /*
         * 화면 흔들림
         */

        if (
            shake > 0
        ) {

            ctx.translate(
                (
                    Math.random() -
                    0.5
                ) *
                shake,

                (
                    Math.random() -
                    0.5
                ) *
                shake
            );
        }

        /*
         * 별
         */

        ctx.fillStyle =
            "rgba(255,255,255,0.7)";

        for (
            const star of stars
            ) {

            ctx.beginPath();

            ctx.arc(
                star.x,
                star.y,
                star.radius,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        /*
         * 비행기
         */

        if (player) {

            ctx.font =
                "30px serif";

            ctx.fillText(
                state === "over"
                    ? "💥"
                    : "🚀",

                player.x,
                player.y
            );
        }

        /*
         * 총알
         */

        for (
            const bullet of bullets
            ) {

            const gradient =
                      ctx.createRadialGradient(
                          bullet.x,
                          bullet.y,
                          0,

                          bullet.x,
                          bullet.y,
                          bullet.radius *
                          1.6
                      );

            gradient.addColorStop(
                0,
                "#ffd76a"
            );

            gradient.addColorStop(
                1,
                "rgba(255,90,60,0)"
            );

            ctx.fillStyle =
                gradient;

            ctx.beginPath();

            ctx.arc(
                bullet.x,
                bullet.y,
                bullet.radius *
                1.6,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.fillStyle =
                "#ff6b4a";

            ctx.beginPath();

            ctx.arc(
                bullet.x,
                bullet.y,
                bullet.radius,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        /*
         * 파티클
         */

        for (
            const particle of
            particles
            ) {

            ctx.globalAlpha =
                Math.min(
                    1,
                    particle.life *
                    2.5
                );

            ctx.fillStyle =
                particle.color;

            ctx.beginPath();

            ctx.arc(
                particle.x,
                particle.y,
                particle.size,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        ctx.globalAlpha = 1;

        ctx.restore();

        /*
         * 레벨 알림
         */

        toasts =
            toasts.filter(
                function (message) {

                    return (
                        message.until >
                        survivalTime
                    );
                }
            );

        let toastY = 40;

        for (
            const message of
            toasts
            ) {

            ctx.font =
                "700 17px 'Noto Sans KR', sans-serif";

            const toastWidth =
                      ctx.measureText(
                          message.text
                      ).width + 28;

            ctx.fillStyle =
                "rgba(20,26,48,0.78)";

            ctx.beginPath();

            if (
                typeof ctx.roundRect ===
                "function"
            ) {

                ctx.roundRect(
                    width / 2 -
                    toastWidth / 2,

                    toastY - 16,

                    toastWidth,
                    32,
                    16
                );

            } else {

                ctx.rect(
                    width / 2 -
                    toastWidth / 2,

                    toastY - 16,

                    toastWidth,
                    32
                );
            }

            ctx.fill();

            ctx.fillStyle =
                "#ffd76a";

            ctx.fillText(
                message.text,
                width / 2,
                toastY
            );

            toastY += 40;
        }
    }

    /*
     * 중앙 오버레이
     */

    function drawOverlay(
        lines
    ) {

        ctx.fillStyle =
            "rgba(5,8,20,0.62)";

        ctx.fillRect(
            0,
            0,
            width,
            height
        );

        ctx.fillStyle =
            "#ffffff";

        lines.forEach(
            function (line) {

                ctx.font =
                    "700 " +
                    line.size +
                    "px 'Noto Sans KR', sans-serif";

                ctx.fillText(
                    line.text,
                    width / 2,
                    height / 2 +
                    line.offset
                );
            }
        );
    }

    /*
     * 시작 화면
     */

    function drawIdle() {

        resetGame();

        draw();

        drawOverlay([
            {
                text:
                    "✈️ 총알 피하기",
                size: 28,
                offset: -30
            },
            {
                text:
                    "화면을 터치하면 이륙!",
                size: 16,
                offset: 10
            },
            {
                text:
                    "마우스·드래그·방향키로 조종",
                size: 13,
                offset: 36
            }
        ]);
    }

    /*
     * 게임 오버
     */

    function gameOver() {

        if (
            state !== "playing"
        ) {
            return;
        }

        state = "over";

        playBoomSound();

        burst(
            player.x,
            player.y,

            [
                "#ffd76a",
                "#ff8c42",
                "#ff5a3c",
                "#ffffff"
            ],

            34,
            320
        );

        shake = 16;

        const isBest =
                  saveBestRecord(
                      survivalTime
                  );

        updateBestHud();

        /*
         * 0.9초 폭발 연출
         */

        const animationStart =
                  performance.now();

        let previousTime =
                animationStart;

        function deathLoop(
            now
        ) {

            now =
                now ||
                performance.now();

            const deltaTime =
                      Math.min(
                          0.05,
                          (
                              now -
                              previousTime
                          ) / 1000
                      );

            previousTime =
                now;

            updateEffects(
                deltaTime
            );

            draw();

            if (
                now -
                animationStart <
                900 &&
                state === "over"
            ) {

                requestAnimationFrame(
                    deathLoop
                );

                return;
            }

            draw();

            drawOverlay([
                {
                    text:
                        "생존 " +
                        survivalTime.toFixed(1) +
                        "초",

                    size: 30,
                    offset: -34
                },
                {
                    text:
                        "탄막 레벨 " +
                        getLevel(),

                    size: 16,
                    offset: 2
                },
                {
                    text:
                        isBest
                            ? "🎉 최고 기록 갱신!"
                            : "터치해서 다시 이륙",

                    size: 15,
                    offset: 32
                }
            ]);
        }

        requestAnimationFrame(
            deathLoop
        );
    }

    /*
     * 게임 시작
     */

    function startGame() {

        if (
            state === "playing"
        ) {
            return;
        }

        resetGame();

        state = "playing";

        playClickSound();

        requestAnimationFrame(
            frame
        );
    }

    /*
     * 포인터
     */

    let drag = null;

    function getPointerPosition(
        event
    ) {

        const rect =
                  canvas.getBoundingClientRect();

        return {
            x:
                (
                    event.clientX -
                    rect.left
                ) *
                (
                    width /
                    rect.width
                ),

            y:
                (
                    event.clientY -
                    rect.top
                ) *
                (
                    height /
                    rect.height
                )
        };
    }

    /*
     * 포인터 누르기
     */

    canvas.addEventListener(
        "pointerdown",
        function (event) {

            event.preventDefault();

            canvas.setPointerCapture(
                event.pointerId
            );

            if (
                state !== "playing"
            ) {

                startGame();
            }

            const position =
                      getPointerPosition(
                          event
                      );

            drag = {
                pointerX:
                position.x,

                pointerY:
                position.y,

                targetX:
                player.targetX,

                targetY:
                player.targetY
            };
        }
    );

    /*
     * 포인터 이동
     */

    canvas.addEventListener(
        "pointermove",
        function (event) {

            if (
                state !== "playing"
            ) {
                return;
            }

            /*
             * PC 마우스:
             * 클릭하지 않아도
             * 마우스를 따라감
             */

            if (
                event.pointerType ===
                "mouse" &&
                !drag
            ) {

                const position =
                          getPointerPosition(
                              event
                          );

                player.targetX =
                    position.x;

                player.targetY =
                    position.y;

                return;
            }

            /*
             * 모바일:
             * 드래그 시작점 기준
             * 상대 좌표 이동
             */

            if (!drag) {
                return;
            }

            const position =
                      getPointerPosition(
                          event
                      );

            player.targetX =
                drag.targetX +
                (
                    position.x -
                    drag.pointerX
                ) *
                1.15;

            player.targetY =
                drag.targetY +
                (
                    position.y -
                    drag.pointerY
                ) *
                1.15;
        }
    );

    canvas.addEventListener(
        "pointerup",
        function () {

            drag = null;
        }
    );

    canvas.addEventListener(
        "pointercancel",
        function () {

            drag = null;
        }
    );

    /*
     * 키보드
     */

    window.addEventListener(
        "keydown",
        function (event) {

            const arrowKeys = [
                "ArrowLeft",
                "ArrowRight",
                "ArrowUp",
                "ArrowDown"
            ];

            if (
                arrowKeys.includes(
                    event.key
                )
            ) {

                keys[
                    event.key
                    ] = true;

                if (
                    state !== "playing"
                ) {

                    startGame();
                }

                event.preventDefault();
            }
        }
    );

    window.addEventListener(
        "keyup",
        function (event) {

            keys[
                event.key
                ] = false;
        }
    );

    /*
     * 창 크기 변경
     */

    window.addEventListener(
        "resize",
        function () {

            resizeCanvas();

            makeStars();

            if (
                state === "idle"
            ) {

                drawIdle();

            } else if (
                state === "over"
            ) {

                draw();

                drawOverlay([
                    {
                        text:
                            "생존 " +
                            survivalTime.toFixed(1) +
                            "초",

                        size: 30,
                        offset: -34
                    },
                    {
                        text:
                            "탄막 레벨 " +
                            getLevel(),

                        size: 16,
                        offset: 2
                    },
                    {
                        text:
                            "터치해서 다시 이륙",

                        size: 15,
                        offset: 32
                    }
                ]);

            } else {

                /*
                 * 게임 중 크기가 변경되면
                 * 플레이어를 화면 안으로 보정
                 */

                player.targetX =
                    Math.max(
                        14,
                        Math.min(
                            width - 14,
                            player.targetX
                        )
                    );

                player.targetY =
                    Math.max(
                        14,
                        Math.min(
                            height - 14,
                            player.targetY
                        )
                    );
            }
        }
    );

    /*
     * 초기화
     */

    function initializeGame() {

        resizeCanvas();

        makeStars();

        updateSfxButton();

        updateBestHud();

        drawIdle();
    }

    initializeGame();
</script>
