<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="게이지 중앙에 맞춰 수박을 격파하는 태권도 타이밍 게임입니다.">
    <meta name="keywords" content="태권수박, 태권도 게임, 타이밍 게임, 수박 격파">
    <meta property="og:title" content="태권수박">
    <meta property="og:description" content="게이지 중앙에 맞춰 수박을 격파하는 간단한 타이밍 게임">
    <meta property="og:type" content="website">
    <title>태권수박</title>

    <!-- https://taekwon-watermelon.netlify.app/ -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f7fb;
            --card: #fff;
            --text: #1d2433;
            --muted: #6b7280;
            --line: #e5e7eb;
            --primary: #111827;
            --gold: #e3a008;
            --red: #dc2626;
            --green: #169c5b;
            --blue: #2563eb;
            --danger: #9ca3af;
            --shadow: 0 12px 34px rgba(15, 23, 42, .08);
            --radius: 24px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            background: var(--bg);
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
            letter-spacing: -.04em;
            color: var(--text);
            background: var(--bg);
        }

        button {
            font: inherit;
        }

        button:focus-visible {
            outline: 3px solid rgba(37, 99, 235, .25);
            outline-offset: 3px;
        }

        .app {
            width: min(100%, 560px);
            min-height: 100dvh;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .brand {
            min-width: 0;
        }

        .brand h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 800;
        }

        .brand p {
            margin: 3px 0 0;
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 0;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 14px;
            cursor: pointer;
            font-size: 18px;
        }

        .belt-panel, .stats {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .belt-panel {
            padding: 12px;
        }

        .belt-title {
            margin: 0 0 10px;
            font-size: 12px;
            color: var(--muted);
            font-weight: 700;
        }

        .belt-list {
            display: grid;
            grid-template-columns:repeat(5, 1fr);
            gap: 7px;
        }

        .belt-btn {
            min-width: 0;
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 14px;
            padding: 9px 4px 8px;
            cursor: pointer;
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
        }

        .belt-btn[data-belt="white"] {
            --belt: #f5f5f4
        }

        .belt-btn[data-belt="yellow"] {
            --belt: #facc15
        }

        .belt-btn[data-belt="blue"] {
            --belt: #2563eb
        }

        .belt-btn[data-belt="red"] {
            --belt: #dc2626
        }

        .belt-btn[data-belt="black"] {
            --belt: #111827
        }

        .belt-btn::before {
            content: '';
            display: block;
            width: 100%;
            max-width: 50px;
            height: 8px;
            margin: 0 auto 6px;
            border-radius: 999px;
            background: var(--belt);
            border: 1px solid rgba(0, 0, 0, .08);
        }

        .belt-btn.active {
            border-color: #111827;
            color: #111827;
            background: #f9fafb;
            box-shadow: inset 0 0 0 1px #111827;
        }

        .stats {
            display: grid;
            grid-template-columns:repeat(3, 1fr);
            overflow: hidden;
        }

        .stat {
            padding: 10px 8px;
            text-align: center;
            border-right: 1px solid var(--line);
        }

        .stat:last-child {
            border-right: 0;
        }

        .stat strong {
            display: block;
            font-size: 21px;
            font-weight: 800;
        }

        .stat span {
            font-size: 11px;
            color: var(--muted);
        }

        .arena {
            position: relative;
            flex: 1;
            min-height: 520px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: linear-gradient(180deg, #fff 0%, #f8fafc 66%, #f3eadc 66%, #efe2d0 100%);
            box-shadow: var(--shadow);
            user-select: none;
            touch-action: manipulation;
            cursor: pointer;
        }

        #taegeukRing {
            position: absolute;
            width: 620px;
            height: 620px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: .045;
            pointer-events: none;
            animation: spin 28s linear infinite;
        }

        #taegeukRing.flash {
            animation: spin 5s linear infinite, flash .5s ease-out;
            opacity: .12;
        }

        .instruction {
            position: absolute;
            z-index: 4;
            top: 16px;
            left: 16px;
            right: 16px;
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            pointer-events: none;
        }

        .fist-zone {
            position: absolute;
            z-index: 3;
            top: 7%;
            left: 50%;
            width: 116px;
            height: 235px;
            transform: translateX(-50%);
            filter: drop-shadow(0 10px 13px rgba(15, 23, 42, .14));
            pointer-events: none;
        }

        #fist {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: bob 1.05s ease-in-out infinite alternate;
        }

        #fist.strike {
            animation: strike .42s cubic-bezier(.3, .46, .28, 1) 1;
        }

        .gauge {
            position: absolute;
            z-index: 7;
            top: 48%;
            left: 50%;
            width: 80%;
            transform: translateX(-50%);
        }

        .gauge-label {
            margin-bottom: 8px;
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            color: #374151;
        }

        .gauge-track {
            position: relative;
            height: 18px;
            border-radius: 999px;
            background: linear-gradient(90deg, #ef4444 0%, #3b82f6 30%, #fbbf24 46%, #fbbf24 54%, #3b82f6 70%, #ef4444 100%);
            box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .8), 0 3px 10px rgba(15, 23, 42, .12);
        }

        .center-zone {
            position: absolute;
            inset: 0 auto 0 46%;
            width: 8%;
            background: rgba(255, 255, 255, .55);
            border-left: 1px dashed rgba(0, 0, 0, .28);
            border-right: 1px dashed rgba(0, 0, 0, .28);
        }

        #gaugeMarker {
            position: absolute;
            top: -6px;
            left: 50%;
            width: 6px;
            height: 30px;
            transform: translateX(-3px);
            border-radius: 5px;
            background: #111827;
            box-shadow: 0 0 0 3px #fff, 0 2px 8px rgba(0, 0, 0, .25);
        }

        .melon-zone {
            position: absolute;
            z-index: 4;
            bottom: 4%;
            left: 50%;
            width: min(62vw, 260px);
            height: min(62vw, 260px);
            transform: translateX(-50%);
            pointer-events: none;
        }

        #melonWhole, #melonHalf, #pieceLeft, #pieceRight {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #melonHalf {
            opacity: 0;
            z-index: 4;
        }

        #pieceLeft, #pieceRight {
            display: none;
            z-index: 3;
        }

        #melonWhole.hidden {
            display: none;
        }

        #pieceLeft.show, #pieceRight.show {
            display: block;
        }

        #melonHalf.show {
            animation: halfFlash .5s ease-out forwards;
        }

        #pieceLeft.show {
            animation: pieceLeft .7s ease-out forwards;
        }

        #pieceRight.show {
            animation: pieceRight .7s ease-out forwards;
        }

        #melonWhole.wobble {
            animation: wobble .35s ease-in-out;
        }

        #melonWhole.fadein {
            animation: fadeIn .4s ease-out;
        }

        #splashLayer {
            position: absolute;
            inset: 0;
            z-index: 8;
            pointer-events: none;
        }

        .drop {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        #resultBanner {
            position: absolute;
            z-index: 12;
            top: 34%;
            left: 50%;
            transform: translate(-50%, -50%) scale(.6);
            text-align: center;
            opacity: 0;
            pointer-events: none;
        }

        #resultBanner.pop {
            animation: resultPop 1.55s cubic-bezier(.2, 1.4, .4, 1) forwards;
        }

        #resultScore {
            display: block;
            font-size: 64px;
            line-height: 1;
            font-weight: 800;
        }

        #resultTag {
            display: block;
            margin-top: 4px;
            font-size: 19px;
            font-weight: 800;
        }

        .overlay {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px;
            background: rgba(255, 255, 255, .96);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .overlay.hidden {
            display: none;
        }

        .game-icon {
            width: 76px;
            height: 76px;
            display: grid;
            place-items: center;
            margin-bottom: 12px;
            border-radius: 24px;
            background: #fef3c7;
            font-size: 40px;
        }

        .overlay h2 {
            margin: 0;
            font-size: 30px;
        }

        .overlay .en {
            margin: 4px 0 16px;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: .12em;
        }

        .overlay p {
            max-width: 340px;
            margin: 0 0 22px;
            color: #4b5563;
            font-size: 14px;
            line-height: 1.75;
        }

        .primary-btn, .secondary-btn {
            min-width: 150px;
            border-radius: 16px;
            padding: 14px 24px;
            cursor: pointer;
            font-weight: 800;
        }

        .primary-btn {
            border: 1px solid #111827;
            background: #111827;
            color: #fff;
        }

        .secondary-btn {
            border: 1px solid var(--line);
            background: #fff;
            color: #111827;
        }

        .result-grid {
            width: 100%;
            max-width: 360px;
            display: grid;
            grid-template-columns:repeat(3, 1fr);
            gap: 8px;
            margin: 4px 0 22px;
        }

        .result-card {
            padding: 14px 8px;
            background: #f9fafb;
            border: 1px solid var(--line);
            border-radius: 16px;
        }

        .result-card strong {
            display: block;
            font-size: 25px;
        }

        .result-card span {
            font-size: 11px;
            color: var(--muted);
        }

        .button-row {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .footer {
            padding: 3px 0 6px;
            text-align: center;
            color: #9ca3af;
            font-size: 11px;
            letter-spacing: 0;
        }

        .shake-s {
            animation: shakeS .3s;
        }

        .shake-m {
            animation: shakeM .35s;
        }

        .shake-l {
            animation: shakeL .4s;
        }

        @keyframes spin {
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        @keyframes flash {
            from {
                opacity: .22
            }
            to {
                opacity: .04
            }
        }

        @keyframes bob {
            from {
                transform: translateY(-8px)
            }
            to {
                transform: translateY(10px)
            }
        }

        @keyframes strike {
            0% {
                transform: translateY(0)
            }
            42% {
                transform: translateY(230px) rotate(-7deg) scale(1.06)
            }
            58% {
                transform: translateY(210px) rotate(3deg)
            }
            100% {
                transform: translateY(0)
            }
        }

        @keyframes halfFlash {
            0% {
                opacity: 0;
                transform: scale(.82)
            }
            35% {
                opacity: 1;
                transform: scale(1.08)
            }
            100% {
                opacity: 0;
                transform: scale(1.16)
            }
        }

        @keyframes pieceLeft {
            to {
                transform: translate(-70px, 60px) rotate(-50deg);
                opacity: 0
            }
        }

        @keyframes pieceRight {
            to {
                transform: translate(70px, 60px) rotate(50deg);
                opacity: 0
            }
        }

        @keyframes wobble {
            25% {
                transform: translateX(-6px) rotate(-3deg)
            }
            75% {
                transform: translateX(6px) rotate(3deg)
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(.9)
            }
            to {
                opacity: 1;
                transform: none
            }
        }

        @keyframes resultPop {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(.4)
            }
            12% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.12)
            }
            22% {
                transform: translate(-50%, -50%) scale(1)
            }
            82% {
                opacity: 1
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -58%) scale(.96)
            }
        }

        @keyframes shakeS {
            30% {
                transform: translateX(2px)
            }
            60% {
                transform: translateX(-2px)
            }
        }

        @keyframes shakeM {
            30% {
                transform: translateX(4px)
            }
            60% {
                transform: translateX(-4px)
            }
        }

        @keyframes shakeL {
            30% {
                transform: translate(6px, -1px)
            }
            60% {
                transform: translate(-6px, 1px)
            }
        }

        @media (max-height: 680px) {
            .arena {
                min-height: 430px
            }

            .fist-zone {
                width: 92px;
                height: 188px
            }

            .gauge {
                top: 46%
            }

            .melon-zone {
                width: 190px;
                height: 190px
            }
        }

        @media (max-width: 390px) {
            .app {
                padding: 10px
            }

            .topbar {
                border-radius: 20px
            }

            .belt-btn {
                font-size: 10px
            }

            .arena {
                min-height: 500px;
                border-radius: 20px
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
<main class="app">
    <header class="topbar">
        <div class="brand"><h1>🥋 태권수박</h1>
            <p>TAEKWONDO WATERMELON BREAK</p></div>
        <button type="button" class="icon-btn" id="soundBtn" aria-label="소리 켜기 또는 끄기">🔊</button>
    </header>

    <section class="belt-panel" aria-label="난이도 선택">
        <p class="belt-title">띠를 선택하세요 · Select difficulty</p>
        <div class="belt-list" id="beltList">
            <button class="belt-btn" data-belt="white">흰띠</button>
            <button class="belt-btn" data-belt="yellow">노란띠</button>
            <button class="belt-btn" data-belt="blue">파란띠</button>
            <button class="belt-btn active" data-belt="red">빨간띠</button>
            <button class="belt-btn" data-belt="black">검은띠</button>
        </div>
    </section>

    <section class="stats" aria-label="게임 현황">
        <div class="stat"><strong id="totalScoreVal">0</strong><span>총점 · SCORE</span></div>
        <div class="stat"><strong id="comboVal">0</strong><span>콤보 · COMBO</span></div>
        <div class="stat"><strong id="chanceVal">0/10</strong><span>도전 · TRY</span></div>
    </section>

    <section class="arena" id="arena" aria-label="게임 화면. 화면을 눌러 격파합니다.">

        </div>

            <div class="game-icon">🏁</div>
            <h2>도전 종료</h2>
            <div class="en">RESULT</div>
            <div class="result-grid">
                <div class="result-card"><strong id="finalTotal">0</strong><span>총점</span></div>
                <div class="result-card"><strong id="finalBest">0</strong><span>최고 점수</span></div>
                <div class="result-card"><strong id="finalCombo">0</strong><span>최고 콤보</span></div>
            </div>
            <div class="button-row">
                <button type="button" class="primary-btn" id="retryBtn">다시하기</button>
                <button type="button" class="secondary-btn" id="homeBtn">처음으로</button>
            </div>
        </div>
    </section>
</main>

<script>
    (() => {
        'use strict';
        const BELTS = {
            white: {label: '흰띠', en: 'WHITE BELT', base: .55, max: 1.50, step: .035}, yellow: {label: '노란띠', en: 'YELLOW BELT', base: .65, max: 1.77, step: .038},
            blue : {label: '파란띠', en: 'BLUE BELT', base: .75, max: 2.03, step: .042}, red: {label: '빨간띠', en: 'RED BELT', base: .85, max: 2.30, step: .045},
            black: {label: '검은띠', en: 'BLACK BELT', base: 1.05, max: 2.90, step: .055}
        };
        const TOTAL_ATTEMPTS = 10;
        const $ = id => document.getElementById(id);
        const arena = $('arena'), fist = $('fist'), gaugeTrack = $('gaugeTrack'), gaugeMarker = $('gaugeMarker'), melonWhole = $('melonWhole'), melonHalf = $('melonHalf'), pieceLeft = $('pieceLeft'), pieceRight = $('pieceRight'), taegeukRing = $('taegeukRing');
        const totalScoreVal = $('totalScoreVal'), comboVal = $('comboVal'), chanceVal = $('chanceVal'), startOverlay = $('startOverlay'), endOverlay = $('endOverlay'), resultBanner = $('resultBanner'), resultScore = $('resultScore'), resultTag = $('resultTag'), splashLayer = $('splashLayer'), gaugeLabel = $('gaugeLabel');
        let currentBelt = 'red', cfg = BELTS.red, freq = cfg.base, phase = 'idle', roundStart = 0, phaseOffset = 0, currentP = .5, totalScore = 0, bestScore = 0, combo = 0, bestCombo = 0, attemptCount = 0, soundEnabled = true, audioCtx = null;

        function tone(freqHz = 220, duration = .08, type = 'sine', volume = .045) {
            if (!soundEnabled) return;
            try {
                audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.type = type;
                o.frequency.value = freqHz;
                g.gain.setValueAtTime(volume, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + duration);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start();
                o.stop(audioCtx.currentTime + duration);
            } catch (e) {
            }
        }

        function impact(score) {
            tone(score >= 90 ? 520 : score >= 45 ? 330 : 150, .11, 'triangle', .07);
            setTimeout(() => tone(score >= 70 ? 760 : 240, .07, 'square', .025), 45);
        }

        function updateSoundButton() {
            $('soundBtn').textContent = soundEnabled ? '🔊' : '🔇';
            $('soundBtn').setAttribute('aria-pressed', String(soundEnabled));
        }

        $('soundBtn').addEventListener('click', e => {
            e.stopPropagation();
            soundEnabled = !soundEnabled;
            updateSoundButton();
            tone(440, .05);
        });

        function applyBelt(name) {
            if (!BELTS[name] || phase === 'strike' || phase === 'result') return;
            currentBelt = name;
            cfg = BELTS[name];
            freq = Math.min(cfg.max, cfg.base + Math.min(combo, 20) * cfg.step);
            document.querySelectorAll('.belt-btn').forEach(b => b.classList.toggle('active', b.dataset.belt === name));
            gaugeLabel.textContent = `${cfg.label} · ${cfg.en}`;
            tone(300, .04);
        }

        document.querySelectorAll('.belt-btn').forEach(b => b.addEventListener('click', () => applyBelt(b.dataset.belt)));

        function startRound() {
            phase = 'ready';
            roundStart = performance.now();
            phaseOffset = Math.random() * Math.PI * 2;
            $('instruction').textContent = '게이지가 중앙에 올 때 화면을 누르세요.';
        }

        function loop(now) {
            requestAnimationFrame(loop);
            if (phase !== 'ready') return;
            const t = (now - roundStart) / 1000;
            currentP = .5 + .5 * Math.sin(t * freq * Math.PI * 2 + phaseOffset);
            gaugeMarker.style.left = (currentP * gaugeTrack.clientWidth) + 'px';
        }

        requestAnimationFrame(loop);

        function spawnDrops(count, color) {
            for (let i = 0; i < count; i++) {
                const d = document.createElement('i');
                d.className = 'drop';
                const a = Math.random() * Math.PI * 2, dist = 35 + Math.random() * 70;
                d.style.left = '50%';
                d.style.top = '50%';
                d.style.background = color;
                splashLayer.appendChild(d);
                requestAnimationFrame(() => {
                    d.style.transition = 'transform .6s ease-out,opacity .6s ease-out';
                    d.style.transform = `translate(${Math.cos(a) * dist}px,${Math.sin(a) * dist + 25}px) scale(.5)`;
                    d.style.opacity = '0';
                });
                setTimeout(() => d.remove(), 700);
            }
        }

        function showResult(score, tag, color) {
            resultScore.style.color = color;
            resultTag.style.color = color;
            resultScore.textContent = score;
            resultTag.textContent = tag;
            resultBanner.classList.remove('pop');
            void resultBanner.offsetWidth;
            resultBanner.classList.add('pop');
        }

        function shake(tier) {
            arena.classList.remove('shake-s', 'shake-m', 'shake-l');
            void arena.offsetWidth;
            arena.classList.add(tier === 'perfect' ? 'shake-l' : (tier === 'great' || tier === 'good') ? 'shake-m' : 'shake-s');
        }

        function handleStrike() {
            if (phase !== 'ready') return;
            phase = 'strike';
            const dist = Math.min(1, Math.abs(currentP - .5) * 2);
            const score = Math.max(0, Math.round(100 * (1 - Math.pow(dist, 1.35))));
            fist.classList.remove('strike');
            void fist.offsetWidth;
            fist.classList.add('strike');
            tone(180, .06, 'sawtooth', .03);
            if (navigator.vibrate) try {
                navigator.vibrate(score >= 90 ? [30, 20, 60] : 30)
            } catch (e) {
            }
            setTimeout(() => {
                phase = 'result';
                totalScore += score;
                bestScore = Math.max(bestScore, score);
                attemptCount++;
                let tier, tag, color;
                if (score >= 90) {
                    tier = 'perfect';
                    tag = '완벽격파!';
                    color = 'var(--gold)'
                } else if (score >= 70) {
                    tier = 'great';
                    tag = '강력격파!';
                    color = 'var(--red)'
                } else if (score >= 45) {
                    tier = 'good';
                    tag = '격파 성공';
                    color = 'var(--green)'
                } else if (score >= 15) {
                    tier = 'soso';
                    tag = '간신히 격파';
                    color = 'var(--blue)'
                } else {
                    tier = 'miss';
                    tag = '실패..!';
                    color = 'var(--danger)'
                }
                impact(score);
                showResult(score, tag, color);
                shake(tier);
                if (tier === 'miss') {
                    combo = 0;
                    melonWhole.classList.remove('wobble');
                    void melonWhole.offsetWidth;
                    melonWhole.classList.add('wobble')
                } else {
                    combo++;
                    bestCombo = Math.max(bestCombo, combo);
                    freq = Math.min(cfg.max, cfg.base + Math.min(combo, 20) * cfg.step);
                    melonWhole.classList.add('hidden');
                    melonHalf.classList.remove('show');
                    void melonHalf.offsetWidth;
                    melonHalf.classList.add('show');
                    pieceLeft.classList.add('show');
                    pieceRight.classList.add('show');
                    spawnDrops(10, tier === 'perfect' ? '#e3a008' : '#dc2626');
                    if (tier === 'perfect') {
                        taegeukRing.classList.remove('flash');
                        void taegeukRing.offsetWidth;
                        taegeukRing.classList.add('flash')
                    }
                }
                totalScoreVal.textContent = totalScore;
                comboVal.textContent = combo;
                chanceVal.textContent = `${attemptCount}/${TOTAL_ATTEMPTS}`;
                $('instruction').textContent = `${score}점 · ${tag}`;
                setTimeout(() => {
                    pieceLeft.classList.remove('show');
                    pieceRight.classList.remove('show');
                    melonWhole.classList.remove('hidden');
                    melonWhole.classList.add('fadein');
                    setTimeout(() => melonWhole.classList.remove('fadein'), 420);
                    attemptCount >= TOTAL_ATTEMPTS ? endGame() : startRound();
                }, 1150);
            }, 160);
        }

        function resetGame() {
            totalScore = 0;
            bestScore = 0;
            combo = 0;
            bestCombo = 0;
            attemptCount = 0;
            freq = cfg.base;
            totalScoreVal.textContent = '0';
            comboVal.textContent = '0';
            chanceVal.textContent = `0/${TOTAL_ATTEMPTS}`;
            melonWhole.classList.remove('hidden');
            pieceLeft.classList.remove('show');
            pieceRight.classList.remove('show');
            endOverlay.classList.add('hidden');
            startOverlay.classList.add('hidden');
            startRound();
        }

        function endGame() {
            phase = 'over';
            $('finalTotal').textContent = totalScore;
            $('finalBest').textContent = bestScore;
            $('finalCombo').textContent = bestCombo;
            endOverlay.classList.remove('hidden');
            tone(523, .1);
            setTimeout(() => tone(659, .1), 110);
            setTimeout(() => tone(784, .15), 220);
        }

        $('startBtn').addEventListener('click', e => {
            e.stopPropagation();
            resetGame();
        });
        $('retryBtn').addEventListener('click', e => {
            e.stopPropagation();
            resetGame();
        });
        $('homeBtn').addEventListener('click', e => {
            e.stopPropagation();
            phase = 'idle';
            endOverlay.classList.add('hidden');
            startOverlay.classList.remove('hidden');
        });
        arena.addEventListener('click', handleStrike);
        window.addEventListener('keydown', e => {
            if ((e.code === 'Space' || e.code === 'Enter') && phase === 'ready') {
                e.preventDefault();
                handleStrike();
            }
        });
        updateSoundButton();
    })();
</script>
</body>
</html>
