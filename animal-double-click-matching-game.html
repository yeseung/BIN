<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="같은 동물을 연속해서 더블클릭해 짝을 맞추는 10×10 동물 짝맞추기 게임입니다.">
    <title>동물 더블클릭 짝맞추기</title>

    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-soft: #f8fafc;
            --text: #1e293b;
            --muted: #64748b;
            --muted-light: #94a3b8;
            --border: #e2e8f0;
            --border-soft: #dbeafe;
            --primary: #2563eb;
            --primary-soft: #dbeafe;
            --success: #16a34a;
            --success-soft: #dcfce7;
            --accent: #f97316;
            --shadow: 0 24px 55px rgba(15, 23, 42, 0.12);
            --radius: 24px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-width: 320px;
        }

        body {
            min-height: 100dvh;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family:
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    "Noto Sans KR",
                    sans-serif;
            letter-spacing: -0.03em;
            user-select: none;
            -webkit-user-select: none;
        }

        button {
            font: inherit;
        }

        [hidden] {
            display: none !important;
        }

        .app {
            width: min(100% - 24px, 820px);
            margin: 0 auto;
            padding: 28px 0 36px;
        }

        .hero {
            margin-bottom: 18px;
            text-align: center;
        }

        .hero-title {
            margin: 0;
            color: var(--primary);
            font-size: clamp(28px, 6vw, 42px);
            font-weight: 900;
            line-height: 1.2;
        }

        .hero-description {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: clamp(15px, 2.6vw, 18px);
            font-weight: 650;
            line-height: 1.5;
        }

        .hero-description strong {
            color: var(--text);
        }

        .status-panel {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            width: min(100%, 360px);
            margin: 0 auto 18px;
            overflow: hidden;
            border: 1px solid var(--border-soft);
            border-radius: 18px;
            background: var(--surface);
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.05);
        }

        .status-item {
            padding: 13px 18px;
            text-align: center;
        }

        .status-item + .status-item {
            border-left: 1px solid #f1f5f9;
        }

        .status-label {
            display: block;
            margin-bottom: 3px;
            color: var(--muted-light);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.04em;
        }

        .status-value {
            display: block;
            font-size: 25px;
            font-weight: 900;
            line-height: 1.1;
        }

        .score-value {
            color: #3b82f6;
        }

        .remaining-value {
            color: var(--accent);
        }

        .board-card {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(10, minmax(0, 1fr));
            gap: 6px;
            width: 100%;
            aspect-ratio: 1 / 1;
        }

        .animal-tile {
            position: relative;
            display: grid;
            min-width: 0;
            min-height: 0;
            place-items: center;
            padding: 0;
            border: 2px solid var(--border);
            border-radius: 9px;
            background: var(--surface-soft);
            cursor: pointer;
            font-size: clamp(20px, 4.3vw, 32px);
            line-height: 1;
            transition:
                    transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                    background-color 0.2s ease,
                    border-color 0.2s ease,
                    opacity 0.2s ease,
                    box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .animal-tile:hover {
            z-index: 5;
            border-color: #bae6fd;
            background: #e0f2fe;
            transform: scale(1.05);
        }

        .animal-tile:focus-visible {
            z-index: 6;
            outline: 4px solid rgba(37, 99, 235, 0.2);
            outline-offset: 2px;
        }

        .animal-tile.selected {
            z-index: 10;
            border-color: #3b82f6;
            background: var(--primary-soft);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
            transform: scale(1.09);
        }

        .animal-tile.removed {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.1) rotate(90deg);
        }

        .controls {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .button {
            min-height: 48px;
            padding: 12px 22px;
            border: 0;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 850;
            transition:
                    transform 0.15s ease,
                    background-color 0.15s ease,
                    box-shadow 0.15s ease;
        }

        .button:active {
            transform: scale(0.97);
        }

        .button:focus-visible {
            outline: 4px solid rgba(37, 99, 235, 0.2);
            outline-offset: 4px;
        }

        .button-primary {
            background: #3b82f6;
            color: #ffffff;
            box-shadow: 0 8px 18px rgba(59, 130, 246, 0.2);
        }

        .button-primary:hover {
            background: var(--primary);
        }

        .button-success {
            background: var(--success);
            color: #ffffff;
        }

        .button-success:hover {
            background: #15803d;
        }

        .score-pop {
            position: fixed;
            z-index: 100;
            color: #10b981;
            font-size: 22px;
            font-weight: 900;
            pointer-events: none;
            animation: float-up 0.8s ease-out forwards;
        }

        @keyframes float-up {
            from {
                opacity: 1;
                transform: translate(-50%, 0);
            }

            to {
                opacity: 0;
                transform: translate(-50%, -50px);
            }
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: grid;
            place-items: center;
            padding: 20px;
            background: rgba(30, 58, 138, 0.4);
            backdrop-filter: blur(5px);
        }

        .modal-card {
            width: min(100%, 430px);
            padding: 38px 28px;
            border: 4px solid #bfdbfe;
            border-radius: 26px;
            background: #ffffff;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.22);
            text-align: center;
        }

        .modal-icon {
            margin-bottom: 10px;
            font-size: 64px;
            line-height: 1;
        }

        .modal-title {
            margin: 0;
            font-size: 38px;
            font-weight: 900;
        }

        .modal-description {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 20px;
            font-weight: 650;
        }

        .modal-score {
            margin: 8px 0 0;
            color: var(--primary);
            font-size: 16px;
            font-weight: 800;
        }

        .modal-actions {
            margin-top: 24px;
        }

        @media (max-width: 600px) {
            .app {
                width: min(100% - 16px, 820px);
                padding-top: 18px;
            }

            .hero {
                margin-bottom: 14px;
            }

            .status-panel {
                margin-bottom: 14px;
            }

            .board-card {
                padding: 7px;
                border-radius: 18px;
            }

            .grid-container {
                gap: 3px;
            }

            .animal-tile {
                border-width: 1px;
                border-radius: 6px;
                font-size: clamp(18px, 5vw, 26px);
            }

            .controls {
                margin-top: 16px;
            }
        }

        @media (max-width: 400px) {
            .grid-container {
                gap: 2px;
            }

            .board-card {
                padding: 5px;
            }

            .animal-tile {
                font-size: 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>
<main class="app">
    <header class="hero">
        <h1 class="hero-title">🐾 동물 짝맞추기 더블클릭</h1>
        <p class="hero-description">
            같은 동물을 <strong>연속해서 더블클릭</strong>하여 짝을 맞추세요!
        </p>
    </header>

    <section class="status-panel" aria-label="게임 상태">
        <div class="status-item">
            <span class="status-label">점수</span>
            <span class="status-value score-value" id="score">0</span>
        </div>

        <div class="status-item">
            <span class="status-label">남은 동물</span>
            <span class="status-value remaining-value" id="remaining">100</span>
        </div>
    </section>

    <section class="board-card" aria-label="동물 짝맞추기 게임판">
        <div
                class="grid-container"
                id="grid"
                role="grid"
                aria-label="10행 10열 동물 짝맞추기 게임판"
        ></div>
    </section>

    <div class="controls">
        <button class="button button-primary" id="restart-button" type="button">
            🔄 게임 다시 시작
        </button>
    </div>
</main>

<div
        class="modal"
        id="win-message"
        role="dialog"
        aria-modal="true"
        aria-labelledby="win-title"
        hidden
>
    <div class="modal-card">
        <div class="modal-icon" aria-hidden="true">🏆</div>
        <h2 class="modal-title" id="win-title">성공!</h2>
        <p class="modal-description">모든 짝을 맞췄습니다!</p>
        <p class="modal-score" id="final-score">최종 점수 1,000점</p>

        <div class="modal-actions">
            <button class="button button-success" id="replay-button" type="button">
                다시 하기
            </button>
        </div>
    </div>
</div>

<script>
    (() => {
        "use strict";

        const CONFIG = Object.freeze({
            gridSize: 10,
            pairScore: 20,
            touchDoubleTapDelay: 300,
            scorePopDuration: 800,
            winDelay: 500
        });

        const ANIMAL_ICONS = Object.freeze([
            "🐶", "🐱", "🐭", "🐹", "🐰",
            "🦊", "🐻", "🐼", "🐨", "🐯",
            "🦁", "🐮", "🐷", "🐸", "🐵",
            "🐔", "🐧", "🐦", "🐤", "🦆",
            "🦉", "🦇", "🐺", "🐗", "🐴",
            "🦄", "🐝", "🐛", "🦋", "🐌",
            "🐞", "🐜", "🐢", "🐍", "🦎",
            "🐙", "🦑", "🦐", "🦀", "🐡",
            "🐠", "🐟", "🐬", "🐳", "🐋",
            "🦈", "🐊", "🐅", "🐆", "🦓"
        ]);

        const TOTAL_TILES = CONFIG.gridSize * CONFIG.gridSize;

        const state = {
            score: 0,
            remaining: TOTAL_TILES,
            firstSelected: null,
            winTimer: null,
            touchTimes: new WeakMap()
        };

        const elements = {
            grid: document.getElementById("grid"),
            score: document.getElementById("score"),
            remaining: document.getElementById("remaining"),
            winMessage: document.getElementById("win-message"),
            finalScore: document.getElementById("final-score"),
            restartButton: document.getElementById("restart-button"),
            replayButton: document.getElementById("replay-button")
        };

        function shuffle(items) {
            const array = [...items];

            for (let index = array.length - 1; index > 0; index -= 1) {
                const randomIndex = Math.floor(Math.random() * (index + 1));
                [array[index], array[randomIndex]] =
                    [array[randomIndex], array[index]];
            }

            return array;
        }

        function createGameSet() {
            return shuffle(
                ANIMAL_ICONS.flatMap((icon) => [icon, icon])
            );
        }

        function updateUI() {
            elements.score.textContent = state.score.toLocaleString();
            elements.remaining.textContent =
                state.remaining.toLocaleString();
        }

        function createTile(icon, index) {
            const tile = document.createElement("button");

            tile.type = "button";
            tile.className = "animal-tile";
            tile.dataset.icon = icon;
            tile.dataset.id = String(index);
            tile.textContent = icon;
            tile.setAttribute("role", "gridcell");
            tile.setAttribute(
                "aria-label",
                `${index + 1}번 칸 ${icon}`
            );

            tile.addEventListener("dblclick", (event) => {
                handleDoubleClick(tile, event);
            });

            tile.addEventListener("touchstart", (event) => {
                handleTouchStart(tile, event);
            }, { passive: false });

            tile.addEventListener("keydown", (event) => {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    handleDoubleClick(tile, event);
                }
            });

            return tile;
        }

        function createGrid() {
            clearTimeout(state.winTimer);

            state.score = 0;
            state.remaining = TOTAL_TILES;
            state.firstSelected = null;
            state.winTimer = null;
            state.touchTimes = new WeakMap();

            elements.winMessage.hidden = true;
            elements.grid.replaceChildren();

            const fragment = document.createDocumentFragment();
            const gameSet = createGameSet();

            gameSet.forEach((icon, index) => {
                fragment.appendChild(createTile(icon, index));
            });

            elements.grid.appendChild(fragment);
            updateUI();
        }

        function handleTouchStart(tile, event) {
            const currentTime = performance.now();
            const lastTap = state.touchTimes.get(tile) ?? 0;
            const elapsed = currentTime - lastTap;

            if (
                elapsed > 0 &&
                elapsed < CONFIG.touchDoubleTapDelay
            ) {
                event.preventDefault();

                const touch = event.touches[0];

                handleDoubleClick(tile, {
                    clientX: touch?.clientX ?? 0,
                    clientY: touch?.clientY ?? 0
                });

                state.touchTimes.set(tile, 0);
                return;
            }

            state.touchTimes.set(tile, currentTime);
        }

        function handleDoubleClick(tile, event) {
            if (tile.classList.contains("removed")) {
                return;
            }

            if (state.firstSelected === tile) {
                clearSelectedTile();
                return;
            }

            if (!state.firstSelected) {
                selectTile(tile);
                return;
            }

            if (
                state.firstSelected.dataset.icon ===
                tile.dataset.icon
            ) {
                const firstTile = state.firstSelected;
                state.firstSelected = null;

                removePair(
                    firstTile,
                    tile,
                    getEventPosition(event, tile)
                );
                return;
            }

            state.firstSelected.classList.remove("selected");
            selectTile(tile);
        }

        function selectTile(tile) {
            state.firstSelected = tile;
            tile.classList.add("selected");
        }

        function clearSelectedTile() {
            if (!state.firstSelected) {
                return;
            }

            state.firstSelected.classList.remove("selected");
            state.firstSelected = null;
        }

        function getEventPosition(event, fallbackElement) {
            const rect = fallbackElement.getBoundingClientRect();

            return {
                x: Number.isFinite(event.clientX) && event.clientX > 0
                    ? event.clientX
                    : rect.left + rect.width / 2,
                y: Number.isFinite(event.clientY) && event.clientY > 0
                    ? event.clientY
                    : rect.top + rect.height / 2
            };
        }

        function removePair(firstTile, secondTile, position) {
            firstTile.classList.remove("selected");
            firstTile.classList.add("removed");
            secondTile.classList.add("removed");

            firstTile.disabled = true;
            secondTile.disabled = true;

            state.score += CONFIG.pairScore;
            state.remaining -= 2;

            showScorePop(position);
            updateUI();
            checkWin();
        }

        function showScorePop({ x, y }) {
            const pop = document.createElement("div");

            pop.className = "score-pop";
            pop.textContent = `Match! +${CONFIG.pairScore}`;
            pop.style.left = `${x}px`;
            pop.style.top = `${y}px`;

            document.body.appendChild(pop);

            window.setTimeout(() => {
                pop.remove();
            }, CONFIG.scorePopDuration);
        }

        function checkWin() {
            if (state.remaining !== 0) {
                return;
            }

            clearTimeout(state.winTimer);

            state.winTimer = window.setTimeout(() => {
                elements.finalScore.textContent =
                    `최종 점수 ${state.score.toLocaleString()}점`;
                elements.winMessage.hidden = false;
                elements.replayButton.focus();
            }, CONFIG.winDelay);
        }

        function resetGame() {
            createGrid();

            const firstTile =
                      elements.grid.querySelector(".animal-tile");

            firstTile?.focus();
        }

        elements.restartButton.addEventListener("click", resetGame);
        elements.replayButton.addEventListener("click", resetGame);

        createGrid();
    })();
</script>
</body>
</html>
