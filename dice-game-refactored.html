<script>
    /*

     * 본 소스 코드 및 프로그램은 저작권법의 보호를 받습니다.
     * 저작권자의 명시적인 서면 허가 없이 무단 도용, 복제, 수정,
     * 배포, 리버스 엔지니어링 및 상업적 이용을 엄격히 금지합니다.
     * 이를 위반할 경우 민·형사상의 법적 책임을 질 수 있습니다.
     */

    const {
              useState,
              useEffect,
              useRef,
              useCallback
          } = React;

    function DiceGame() {
        const [gameState, setGameState] = useState('menu');
        const [cantStopMode, setCantStopMode] = useState(null); // null | 'roll' | 'select'
        const [diceCount, setDiceCount] = useState(4);
        const [diceMethod, setDiceMethod] = useState(null);
        const [mode, setMode] = useState(null);
        const [showResults, setShowResults] = useState(false);
        const [showCombinations, setShowCombinations] = useState(false);
        const [isRolling, setIsRolling] = useState(false);
        const [rolledDice, setRolledDice] = useState([]);
        const [diceValues, setDiceValues] = useState({});
        const [selectedDice, setSelectedDice] = useState(new Set());
        const mountRef = useRef(null);
        const sceneRef = useRef(null);
        const diceRef = useRef([]);
        const rendererRef = useRef(null);
        const cameraRef = useRef(null);
        const raycasterRef = useRef(new THREE.Raycaster());
        const mouseRef = useRef(new THREE.Vector2());
        const isRollingRef = useRef(false);
        const diceMethodRef = useRef(diceMethod);
        const rolledDiceRef = useRef(rolledDice);
        const selectedDiceRef = useRef(selectedDice);
        const diceColors = ['#FF9999', '#FFFF99', '#99FF99', '#99CCFF'];
        useEffect(() => {
            isRollingRef.current = isRolling;
        }, [isRolling]);
        useEffect(() => {
            diceMethodRef.current = diceMethod;
        }, [diceMethod]);
        useEffect(() => {
            rolledDiceRef.current = rolledDice;
        }, [rolledDice]);
        useEffect(() => {
            selectedDiceRef.current = selectedDice;
        }, [selectedDice]);

        // ② 브라우저 탭 제목
        useEffect(() => {
            document.title = '퍼즐게임 | 램프의 요정';
        }, []);
        const playSound = useCallback(() => {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            for (let i = 0; i < 8; i++) {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                const startTime = audioContext.currentTime + i * 0.15;
                const duration = 0.08;
                osc.frequency.setValueAtTime(150 - i * 10, startTime);
                osc.type = 'triangle';
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.2 - i * 0.02, startTime + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
                osc.start(startTime);
                osc.stop(startTime + duration);
            }
        }, []);
        const rollDiceAll = useCallback(() => {
            if (isRollingRef.current) return;
            playSound();
            setIsRolling(true);
            setShowResults(false);
            setShowCombinations(false);
            setDiceValues({});
            diceRef.current.forEach(dice => {
                dice.userData.settled = false;
                dice.position.y = 5 + Math.random() * 2;
                dice.position.x = (Math.random() - 0.5) * 3;
                dice.position.z = (Math.random() - 0.5) * 3;
                dice.userData.velocity = new THREE.Vector3((Math.random() - 0.5) * 0.15, -0.1, (Math.random() - 0.5) * 0.15);
                dice.userData.angularVelocity = new THREE.Vector3((Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 0.4);
            });
            // fallback: 모든 주사위 착지 감지로 먼저 해제되지만, 최대 1200ms 보장
            setTimeout(() => setIsRolling(false), 1200);
        }, [playSound]);
        const rollDiceOne = useCallback(index => {
            if (isRollingRef.current || rolledDiceRef.current.includes(index)) return;
            playSound();
            setIsRolling(true);
            setShowResults(false);
            setShowCombinations(false);
            setRolledDice(prev => [...prev, index]);
            const dice = diceRef.current[index];
            if (dice) {
                dice.userData.settled = false;
                dice.position.y = 5 + Math.random() * 2;
                dice.position.x = (Math.random() - 0.5) * 8;
                dice.position.z = 2;
                dice.userData.velocity = new THREE.Vector3((Math.random() - 0.5) * 0.15, -0.1, (Math.random() - 0.5) * 0.15);
                dice.userData.angularVelocity = new THREE.Vector3((Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 0.4);
            }
            // fallback: 최대 1200ms
            setTimeout(() => setIsRolling(false), 1200);
        }, [playSound]);
        const toggleSelectDice = useCallback(index => {
            setSelectedDice(prev => {
                const s = new Set(prev);
                if (s.has(index)) s.delete(index); else s.add(index);
                return s;
            });
        }, []);
        const rollDiceSelect = useCallback(() => {
            if (isRollingRef.current || selectedDiceRef.current.size === 0) return;
            playSound();
            setIsRolling(true);
            setShowResults(false);
            setShowCombinations(false);
            setDiceValues(prev => {
                const next = {
                    ...prev
                };
                selectedDiceRef.current.forEach(idx => delete next[idx]);
                return next;
            });
            selectedDiceRef.current.forEach(index => {
                const dice = diceRef.current[index];
                if (dice) {
                    dice.userData.settled = false;
                    dice.position.y = 5 + Math.random() * 2;
                    dice.position.x = (Math.random() - 0.5) * 3;
                    dice.position.z = (Math.random() - 0.5) * 3;
                    dice.userData.velocity = new THREE.Vector3((Math.random() - 0.5) * 0.15, -0.1, (Math.random() - 0.5) * 0.15);
                    dice.userData.angularVelocity = new THREE.Vector3((Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 0.4);
                }
            });
            // fallback: 최대 1200ms
            setTimeout(() => {
                setIsRolling(false);
                setSelectedDice(new Set());
            }, 1200);
        }, [playSound]);

        // ── 3D 씬 (gamePlay 또는 cantStop+roll 모드에서만) ──
        const needsThreeJS = gameState === 'gamePlay' || gameState === 'cantStop' && cantStopMode === 'roll';
        useEffect(() => {
            if (!needsThreeJS || !mountRef.current) return;
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0xE6F2FF);
            sceneRef.current = scene;

            // ★ 캔버스 실제 크기 기준으로 초기화 (헤더·푸터 제외)
            const containerW = mountRef.current.clientWidth;
            const containerH = mountRef.current.clientHeight;
            const camera = new THREE.PerspectiveCamera(45, containerW / containerH, 0.1, 1000);
            camera.position.set(0, 18, 0);
            camera.lookAt(0, 0, 0);
            cameraRef.current = camera;
            const renderer = new THREE.WebGLRenderer({
                antialias: true
            });
            renderer.setSize(containerW, containerH);
            renderer.shadowMap.enabled = true;
            mountRef.current.appendChild(renderer.domElement);
            rendererRef.current = renderer;
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 5);
            dirLight.castShadow = true;
            scene.add(dirLight);
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({
                color    : 0xD4F0D4,
                roughness: 0.8
            }));
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -2;
            ground.receiveShadow = true;
            scene.add(ground);
            diceRef.current = [];
            const count = gameState === 'cantStop' && cantStopMode === 'roll' ? 4 : diceCount;
            for (let i = 0; i < count; i++) {
                const materials = [createDiceFace(3, i), createDiceFace(4, i), createDiceFace(1, i), createDiceFace(6, i), createDiceFace(2, i), createDiceFace(5, i)];
                const dice = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), materials);
                if (diceMethod === 'one') {
                    dice.position.set((i - diceCount / 2 + 0.5) * 2.5, 1, -7);
                } else {
                    dice.position.set((Math.random() - 0.5) * 3, 5 + Math.random() * 2, (Math.random() - 0.5) * 3);
                }
                dice.castShadow = true;
                dice.userData = {
                    velocity       : new THREE.Vector3(),
                    angularVelocity: new THREE.Vector3(),
                    index          : i,
                    settled        : false
                };
                scene.add(dice);
                diceRef.current.push(dice);
            }
            const calcTopFace = dice => {
                const faces = [{
                    n: new THREE.Vector3(1, 0, 0),
                    v: 3
                }, {
                    n: new THREE.Vector3(-1, 0, 0),
                    v: 4
                }, {
                    n: new THREE.Vector3(0, 1, 0),
                    v: 1
                }, {
                    n: new THREE.Vector3(0, -1, 0),
                    v: 6
                }, {
                    n: new THREE.Vector3(0, 0, 1),
                    v: 2
                }, {
                    n: new THREE.Vector3(0, 0, -1),
                    v: 5
                }];
                let maxY = -Infinity,
                    top  = 1;
                faces.forEach(({
                                   n,
                                   v
                               }) => {
                    const wy = n.clone().applyQuaternion(dice.quaternion).y;
                    if (wy > maxY) {
                        maxY = wy;
                        top = v;
                    }
                });
                return top;
            };
            let animId;
            const animate = () => {
                animId = requestAnimationFrame(animate);
                diceRef.current.forEach((dice, index) => {
                    if (dice.userData.settled) return;
                    dice.position.add(dice.userData.velocity);
                    dice.rotation.x += dice.userData.angularVelocity.x;
                    dice.rotation.y += dice.userData.angularVelocity.y;
                    dice.rotation.z += dice.userData.angularVelocity.z;
                    dice.userData.velocity.y -= 0.01;
                    if (dice.position.y < -0.5) {
                        dice.position.y = -0.5;
                        dice.userData.velocity.y *= -0.5;
                        dice.userData.velocity.x *= 0.95;
                        dice.userData.velocity.z *= 0.95;
                        dice.userData.angularVelocity.multiplyScalar(0.95);
                    }
                    const mb = 5.5;
                    if (Math.abs(dice.position.x) > mb) {
                        dice.position.x = Math.sign(dice.position.x) * mb;
                        dice.userData.velocity.x *= -0.8;
                    }
                    if (Math.abs(dice.position.z) > mb) {
                        dice.position.z = Math.sign(dice.position.z) * mb;
                        dice.userData.velocity.z *= -0.8;
                    }
                    diceRef.current.forEach((other, oi) => {
                        if (index === oi) return;
                        const dist = dice.position.distanceTo(other.position);
                        if (dist < 2.5) {
                            const pd = new THREE.Vector3().subVectors(dice.position, other.position).normalize();
                            dice.position.add(pd.clone().multiplyScalar((2.5 - dist) * 0.5));
                            const rv = new THREE.Vector3().subVectors(dice.userData.velocity, other.userData.velocity);
                            if (rv.dot(pd) < 0) dice.userData.velocity.add(pd.multiplyScalar(-rv.dot(pd) * 0.8));
                        }
                    });
                    if (Math.abs(dice.userData.velocity.y) < 0.01 && dice.position.y <= -0.4) {
                        dice.userData.velocity.set(0, 0, 0);
                        dice.userData.angularVelocity.set(0, 0, 0);
                        const snap = a => Math.round(a / (Math.PI / 2)) * (Math.PI / 2);
                        dice.rotation.x = snap(dice.rotation.x);
                        dice.rotation.y = snap(dice.rotation.y);
                        dice.rotation.z = snap(dice.rotation.z);
                        dice.quaternion.setFromEuler(dice.rotation);
                        dice.userData.settled = true;
                        setDiceValues(prev => ({
                            ...prev,
                            [index]: calcTopFace(dice)
                        }));
                        const sb = 5;
