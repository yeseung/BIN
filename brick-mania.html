<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brick Mania - 벽돌깨기</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, "Noto Sans KR", sans-serif;
            background: #f5f6f8;
            color: #181818;
        }

        button {
            font: inherit;
        }

        .game-wrap {
            width: min(100%, 620px);
            margin: 0 auto;
            padding: 24px 16px 40px;
        }

        .game-header {
            text-align: center;
            margin-bottom: 18px;
        }

        .game-header h1 {
            margin: 0 0 8px;
            font-size: 30px;
            font-weight: 800;
        }

        .game-header p {
            margin: 0;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .game-card {
            background: #fff;
            border: 1px solid #e2e4e8;
            border-radius: 20px;
            padding: 14px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.06);
        }

        .hud {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .hud-item {
            min-width: 0;
            padding: 10px 5px;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            text-align: center;
            background: #fafafa;
        }

        .hud-label {
            display: block;
            margin-bottom: 4px;
            color: #777;
            font-size: 11px;
        }

        .hud-value {
            display: block;
            overflow: hidden;
            font-size: 17px;
            font-weight: 800;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .canvas-box {
            position: relative;
            width: 100%;
            overflow: hidden;
            background: #111;
            border-radius: 14px;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: #151515;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.66);
            backdrop-filter: blur(2px);
        }

        .overlay.hidden {
            display: none;
        }

        .overlay-card {
            width: min(100%, 360px);
            padding: 28px 20px;
            border: 1px solid rgba(255,255,255,.18);
            border-radius: 20px;
            text-align: center;
            background: rgba(20, 20, 20, 0.94);
            color: #fff;
        }

        .overlay-icon {
            margin-bottom: 12px;
            font-size: 44px;
        }

        .overlay-card h2 {
            margin: 0 0 10px;
            font-size: 26px;
        }

        .overlay-card p {
            margin: 0 0 20px;
            color: #ccc;
            font-size: 14px;
            line-height: 1.7;
        }

        .primary-btn,
        .secondary-btn {
            min-height: 44px;
            border-radius: 12px;
            cursor: pointer;
        }

        .primary-btn {
            width: 100%;
            border: 0;
            background: #fff;
            color: #111;
            font-weight: 800;
        }

        .primary-btn:hover {
            background: #ececec;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }

        .secondary-btn {
            border: 1px solid #ddd;
            background: #fff;
            color: #222;
            font-weight: 700;
        }

        .secondary-btn:hover {
            background: #f5f5f5;
        }

        .help {
            margin-top: 14px;
            padding: 14px;
            border-radius: 12px;
            background: #f7f7f7;
            color: #666;
            font-size: 13px;
            line-height: 1.7;
        }

        .help strong {
            color: #222;
        }

        @media (max-width: 520px) {
            .game-wrap {
                padding: 12px 10px 30px;
            }

            .game-card {
                padding: 8px;
                border-radius: 14px;
            }

            .hud {
                gap: 5px;
            }

            .hud-item {
                padding: 8px 2px;
            }

            .hud-value {
                font-size: 14px;
            }

            .game-header h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<main class="game-wrap">

    <header class="game-header">
        <h1>🧱 Brick Mania</h1>
        <p>
            공을 튕겨 모든 벽돌을 제거하세요.<br>
            스테이지가 올라갈수록 공이 빨라지고 새로운 패턴이 등장합니다.
        </p>
    </header>

    <section class="game-card">

        <div class="hud">
            <div class="hud-item">
                <span class="hud-label">SCORE</span>
                <strong class="hud-value" id="score">0</strong>
            </div>

            <div class="hud-item">
                <span class="hud-label">STAGE</span>
                <strong class="hud-value" id="stage">1</strong>
            </div>

            <div class="hud-item">
                <span class="hud-label">LIVES</span>
                <strong class="hud-value" id="lives">❤️❤️❤️</strong>
            </div>

            <div class="hud-item">
                <span class="hud-label">COMBO</span>
                <strong class="hud-value" id="combo">x1</strong>
            </div>
        </div>

        <div class="canvas-box" id="canvasBox">
            <canvas id="gameCanvas" width="560" height="720"></canvas>

            <div class="overlay" id="overlay">
                <div class="overlay-card">
                    <div class="overlay-icon" id="overlayIcon">🧱</div>

                    <h2 id="overlayTitle">Brick Mania</h2>

                    <p id="overlayText">
                        마우스 또는 방향키로 패들을 움직이세요.<br>
                        모든 벽돌을 제거하면 다음 스테이지로 이동합니다.
                    </p>

                    <button
                            type="button"
                            class="primary-btn"
                            id="startButton"
                    >
                        게임 시작
                    </button>
                </div>
            </div>
        </div>

        <div class="controls">
            <button
                    type="button"
                    class="secondary-btn"
                    id="pauseButton"
            >
                일시정지
            </button>

            <button
                    type="button"
                    class="secondary-btn"
                    id="restartButton"
            >
                다시 시작
            </button>
        </div>

        <div class="help">
            <strong>PC</strong> ← → / A D / 마우스 이동<br>
            <strong>모바일</strong> 화면을 좌우로 드래그<br>
            <strong>Space</strong> 게임 시작 · 일시정지
        </div>

    </section>
</main>

<script>
    (function () {
        "use strict";

        var canvas = document.getElementById("gameCanvas");
        var ctx = canvas.getContext("2d");

        var scoreElement = document.getElementById("score");
        var stageElement = document.getElementById("stage");
        var livesElement = document.getElementById("lives");
        var comboElement = document.getElementById("combo");

        var overlay = document.getElementById("overlay");
        var overlayIcon = document.getElementById("overlayIcon");
        var overlayTitle = document.getElementById("overlayTitle");
        var overlayText = document.getElementById("overlayText");

        var startButton = document.getElementById("startButton");
        var pauseButton = document.getElementById("pauseButton");
        var restartButton = document.getElementById("restartButton");

        var WIDTH = canvas.width;
        var HEIGHT = canvas.height;

        var score = 0;
        var stage = 1;
        var lives = 3;
        var combo = 1;

        var running = false;
        var paused = false;
        var gameOver = false;

        var leftPressed = false;
        var rightPressed = false;

        var particles = [];
        var bricks = [];

        var paddle = {
            width: 105,
            height: 12,
            x: WIDTH / 2 - 52.5,
            y: HEIGHT - 46,
            speed: 8
        };

        var ball = {
            x: WIDTH / 2,
            y: HEIGHT - 70,
            radius: 6,
            dx: 3.5,
            dy: -4.5,
            speed: 5.7
        };

        var patterns = [
            [
                "1111111111",
                "1111111111",
                "1111111111",
                "1111111111",
                "1111111111",
                "1111111111",
                "1111111111"
            ],

            [
                "1000000001",
                "1100000011",
                "1110000111",
                "1111001111",
                "1111111111",
                "0111111110",
                "0011111100",
                "0001111000"
            ],

            [
                "1111111111",
                "1000000001",
                "1011111101",
                "1010000101",
                "1010110101",
                "1010000101",
                "1011111101",
                "1000000001",
                "1111111111"
            ],

            [
                "1000000000",
                "1100000000",
                "1110000000",
                "1111000000",
                "1111100000",
                "1111110000",
                "1111111000",
                "1111111100",
                "1111111110",
                "1111111111"
            ],

            [
                "1111111111",
                "0000000001",
                "1111111101",
                "1000000101",
                "1011110101",
                "1010010101",
                "1011010101",
                "1000000101",
                "1111111101"
            ],

            [
                "1111111111",
                "1111111111",
                "1100000011",
                "1101111011",
                "1101001011",
                "1101111011",
                "1100000011",
                "1111111111"
            ]
        ];

        var brickColors = [
            "#59d65e",
            "#ff914d",
            "#5d7cff",
            "#f64f73",
            "#a95cff",
            "#e9d33c"
        ];

        function createBricks() {
            bricks = [];

            var pattern = patterns[(stage - 1) % patterns.length];

            var columns = 10;
            var gap = 2;
            var marginX = 12;
            var top = 35;

            var brickWidth =
                    (WIDTH - marginX * 2 - gap * (columns - 1)) / columns;

            var brickHeight = 16;

            for (var row = 0; row < pattern.length; row++) {
                for (var col = 0; col < columns; col++) {

                    if (pattern[row].charAt(col) !== "1") {
                        continue;
                    }

                    var hp = 1;

                    if (stage >= 4 && Math.random() < 0.12) {
                        hp = 2;
                    }

                    bricks.push({
                        x: marginX + col * (brickWidth + gap),
                        y: top + row * (brickHeight + gap),
                        width: brickWidth,
                        height: brickHeight,
                        hp: hp,
                        maxHp: hp,
                        alive: true,
                        color: brickColors[
                        (stage + row) % brickColors.length
                            ]
                    });
                }
            }
        }

        function resetBall() {
            ball.x = WIDTH / 2;
            ball.y = HEIGHT - 72;

            var speed =
                    Math.min(8.2, 5.4 + (stage - 1) * 0.25);

            ball.speed = speed;

            var direction = Math.random() > 0.5 ? 1 : -1;

            ball.dx = direction * speed * 0.62;
            ball.dy = -speed * 0.78;

            paddle.x = WIDTH / 2 - paddle.width / 2;
        }

        function updateHUD() {
            scoreElement.textContent = score.toLocaleString();
            stageElement.textContent = stage;

            var hearts = "";

            for (var i = 0; i < lives; i++) {
                hearts += "❤️";
            }

            livesElement.textContent = hearts || "0";
            comboElement.textContent = "x" + combo;
        }

        function showOverlay(icon, title, text, buttonText) {
            overlayIcon.textContent = icon;
            overlayTitle.textContent = title;
            overlayText.innerHTML = text;
            startButton.textContent = buttonText;

            overlay.classList.remove("hidden");
        }

        function hideOverlay() {
            overlay.classList.add("hidden");
        }

        function startGame() {
            if (gameOver) {
                restartGame();
                return;
            }

            running = true;
            paused = false;

            hideOverlay();

            pauseButton.textContent = "일시정지";
        }

        function pauseGame() {
            if (!running || gameOver) {
                return;
            }

            paused = !paused;

            if (paused) {
                pauseButton.textContent = "계속하기";

                showOverlay(
                    "⏸️",
                    "일시정지",
                    "게임이 잠시 멈췄습니다.",
                    "계속하기"
                );
            } else {
                pauseButton.textContent = "일시정지";
                hideOverlay();
            }
        }

        function restartGame() {
            score = 0;
            stage = 1;
            lives = 3;
            combo = 1;

            gameOver = false;
            running = true;
            paused = false;

            particles = [];

            createBricks();
            resetBall();
            updateHUD();

            pauseButton.textContent = "일시정지";

            hideOverlay();
        }

        function loseLife() {
            lives--;
            combo = 1;

            updateHUD();

            if (lives <= 0) {
                gameOver = true;
                running = false;

                showOverlay(
                    "💥",
                    "Game Over",
                    "최종 점수 <strong>" +
                    score.toLocaleString() +
                    "</strong><br>" +
                    "도달 스테이지 <strong>" +
                    stage +
                    "</strong>",
                    "다시 시작"
                );

                return;
            }

            resetBall();

            running = false;

            showOverlay(
                "❤️",
                "다시 도전!",
                "목숨이 하나 줄었습니다.<br>" +
                "남은 목숨 " + lives + "개",
                "계속하기"
            );
        }

        function nextStage() {
            stage++;
            combo = 1;

            createBricks();
            resetBall();
            updateHUD();

            running = false;

            showOverlay(
                "🎉",
                "Stage " + stage,
                "스테이지 클리어!<br>" +
                "다음 스테이지는 공이 조금 더 빨라집니다.",
                "다음 스테이지"
            );
        }

        function createParticles(x, y, color) {
            for (var i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    dx: (Math.random() - 0.5) * 5,
                    dy: (Math.random() - 0.5) * 5,
                    size: Math.random() * 3 + 1,
                    alpha: 1,
                    color: color
                });
            }
        }

        function updateParticles() {
            for (var i = particles.length - 1; i >= 0; i--) {
                var p = particles[i];

                p.x += p.dx;
                p.y += p.dy;

                p.dy += 0.06;
                p.alpha -= 0.025;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawParticles() {
            ctx.save();

            for (var i = 0; i < particles.length; i++) {
                var p = particles[i];

                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;

                ctx.fillRect(
                    p.x,
                    p.y,
                    p.size,
                    p.size
                );
            }

            ctx.restore();
        }

        function drawBackground() {
            ctx.fillStyle = "#151515";
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            ctx.strokeStyle = "rgba(255,255,255,0.035)";
            ctx.lineWidth = 1;

            var grid = 20;

            for (var x = 0; x <= WIDTH; x += grid) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, HEIGHT);
                ctx.stroke();
            }

            for (var y = 0; y <= HEIGHT; y += grid) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(WIDTH, y);
                ctx.stroke();
            }
        }

        function drawPaddle() {
            ctx.save();

            ctx.shadowColor = "rgba(255,255,255,.35)";
            ctx.shadowBlur = 8;

            ctx.fillStyle = "#ff6b76";

            roundRect(
                paddle.x,
                paddle.y,
                paddle.width,
                paddle.height,
                6
            );

            ctx.fill();

            ctx.restore();
        }

        function drawBall() {
            ctx.save();

            ctx.shadowColor = "#ffffff";
            ctx.shadowBlur = 12;

            ctx.fillStyle = "#ffffff";

            ctx.beginPath();
            ctx.arc(
                ball.x,
                ball.y,
                ball.radius,
                0,
                Math.PI * 2
            );
            ctx.fill();

            ctx.restore();
        }

        function drawBricks() {
            for (var i = 0; i < bricks.length; i++) {
                var brick = bricks[i];

                if (!brick.alive) {
                    continue;
                }

                ctx.save();

                ctx.fillStyle = brick.color;

                if (brick.hp === 2) {
                    ctx.globalAlpha = 0.72;
                }

                ctx.fillRect(
                    brick.x,
                    brick.y,
                    brick.width,
                    brick.height
                );

                ctx.strokeStyle = "rgba(0,0,0,.32)";
                ctx.lineWidth = 1;

                ctx.strokeRect(
                    brick.x + 0.5,
                    brick.y + 0.5,
                    brick.width - 1,
                    brick.height - 1
                );

                ctx.restore();
            }
        }

        function roundRect(x, y, width, height, radius) {
            ctx.beginPath();

            ctx.moveTo(x + radius, y);

            ctx.arcTo(
                x + width,
                y,
                x + width,
                y + height,
                radius
            );

            ctx.arcTo(
                x + width,
                y + height,
                x,
                y + height,
                radius
            );

            ctx.arcTo(
                x,
                y + height,
                x,
                y,
                radius
            );

            ctx.arcTo(
                x,
                y,
                x + width,
                y,
                radius
            );

            ctx.closePath();
        }

        function movePaddle() {
            if (leftPressed) {
                paddle.x -= paddle.speed;
            }

            if (rightPressed) {
                paddle.x += paddle.speed;
            }

            if (paddle.x < 0) {
                paddle.x = 0;
            }

            if (paddle.x + paddle.width > WIDTH) {
                paddle.x = WIDTH - paddle.width;
            }
        }

        function updateBall() {
            ball.x += ball.dx;
            ball.y += ball.dy;

            if (ball.x - ball.radius <= 0) {
                ball.x = ball.radius;
                ball.dx = Math.abs(ball.dx);
            }

            if (ball.x + ball.radius >= WIDTH) {
                ball.x = WIDTH - ball.radius;
                ball.dx = -Math.abs(ball.dx);
            }

            if (ball.y - ball.radius <= 0) {
                ball.y = ball.radius;
                ball.dy = Math.abs(ball.dy);
            }

            checkPaddleCollision();
            checkBrickCollision();

            if (ball.y - ball.radius > HEIGHT) {
                loseLife();
            }
        }

        function checkPaddleCollision() {
            if (
                ball.dy > 0 &&
                ball.x + ball.radius >= paddle.x &&
                ball.x - ball.radius <= paddle.x + paddle.width &&
                ball.y + ball.radius >= paddle.y &&
                ball.y - ball.radius <= paddle.y + paddle.height
            ) {
                ball.y = paddle.y - ball.radius;

                var hit =
                        (
                            ball.x -
                            (paddle.x + paddle.width / 2)
                        ) /
                        (paddle.width / 2);

                var maxAngle = Math.PI / 3;

                var angle = hit * maxAngle;

                ball.dx =
                    ball.speed *
                    Math.sin(angle);

                ball.dy =
                    -Math.abs(
                        ball.speed *
                        Math.cos(angle)
                    );

                combo = 1;
                updateHUD();
            }
        }

        function checkBrickCollision() {
            var aliveCount = 0;

            for (var i = 0; i < bricks.length; i++) {
                var brick = bricks[i];

                if (!brick.alive) {
                    continue;
                }

                aliveCount++;

                if (
                    ball.x + ball.radius > brick.x &&
                    ball.x - ball.radius < brick.x + brick.width &&
                    ball.y + ball.radius > brick.y &&
                    ball.y - ball.radius < brick.y + brick.height
                ) {
                    var previousX = ball.x - ball.dx;
                    var previousY = ball.y - ball.dy;

                    var fromLeft =
                            previousX + ball.radius <= brick.x;

                    var fromRight =
                            previousX - ball.radius >=
                            brick.x + brick.width;

                    if (fromLeft || fromRight) {
                        ball.dx *= -1;
                    } else {
                        ball.dy *= -1;
                    }

                    brick.hp--;

                    createParticles(
                        ball.x,
                        ball.y,
                        brick.color
                    );

                    if (brick.hp <= 0) {
                        brick.alive = false;

                        score += 100 * combo;

                        combo++;

                        if (combo > 9) {
                            combo = 9;
                        }

                        aliveCount--;
                    } else {
                        score += 30;
                    }

                    updateHUD();

                    break;
                }
            }

            if (aliveCount === 0) {
                nextStage();
            }
        }

        function update() {
            if (!running || paused || gameOver) {
                return;
            }

            movePaddle();
            updateBall();
            updateParticles();
        }

        function draw() {
            drawBackground();
            drawBricks();
            drawParticles();
            drawPaddle();
            drawBall();
        }

        function gameLoop() {
            update();
            draw();

            requestAnimationFrame(gameLoop);
        }

        function getPointerX(event) {
            var rect = canvas.getBoundingClientRect();

            var clientX;

            if (event.touches && event.touches.length) {
                clientX = event.touches[0].clientX;
            } else {
                clientX = event.clientX;
            }

            return (
                (clientX - rect.left) /
                rect.width *
                WIDTH
            );
        }

        function movePaddleToPointer(event) {
            var x = getPointerX(event);

            paddle.x = x - paddle.width / 2;

            if (paddle.x < 0) {
                paddle.x = 0;
            }

            if (paddle.x + paddle.width > WIDTH) {
                paddle.x = WIDTH - paddle.width;
            }
        }

        document.addEventListener(
            "keydown",
            function (event) {
                if (
                    event.key === "ArrowLeft" ||
                    event.key === "a" ||
                    event.key === "A"
                ) {
                    leftPressed = true;
                }

                if (
                    event.key === "ArrowRight" ||
                    event.key === "d" ||
                    event.key === "D"
                ) {
                    rightPressed = true;
                }

                if (event.code === "Space") {
                    event.preventDefault();

                    if (!running) {
                        startGame();
                    } else {
                        pauseGame();
                    }
                }
            }
        );

        document.addEventListener(
            "keyup",
            function (event) {
                if (
                    event.key === "ArrowLeft" ||
                    event.key === "a" ||
                    event.key === "A"
                ) {
                    leftPressed = false;
                }

                if (
                    event.key === "ArrowRight" ||
                    event.key === "d" ||
                    event.key === "D"
                ) {
                    rightPressed = false;
                }
            }
        );

        canvas.addEventListener(
            "mousemove",
            function (event) {
                movePaddleToPointer(event);
            }
        );

        canvas.addEventListener(
            "touchstart",
            function (event) {
                event.preventDefault();

                movePaddleToPointer(event);
            },
            { passive: false }
        );

        canvas.addEventListener(
            "touchmove",
            function (event) {
                event.preventDefault();

                movePaddleToPointer(event);
            },
            { passive: false }
        );

        startButton.addEventListener(
            "click",
            function () {
                startGame();
            }
        );

        pauseButton.addEventListener(
            "click",
            function () {
                if (!running) {
                    startGame();
                    return;
                }

                pauseGame();
            }
        );

        restartButton.addEventListener(
            "click",
            function () {
                restartGame();
            }
        );

        createBricks();
        resetBall();
        updateHUD();
        gameLoop();

    })();
</script>

</body>
</html>
