<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>과일 머지 - 수박 만들기 물리 퍼즐</title>

  <meta
          name="description"
          content="같은 과일을 합쳐 더 큰 과일로 진화시키는 무료 과일 머지 물리 퍼즐 게임입니다. 체리부터 수박까지 10단계에 도전해 보세요."
  >
  <meta
          name="keywords"
          content="과일 머지, 수박 게임, 과일 게임, 머지 게임, 물리 퍼즐, 무료 게임, 웹 게임"
  >

  <meta property="og:title" content="🍉 과일 머지">
  <meta
          property="og:description"
          content="같은 과일을 부딪혀 체리에서 수박까지 10단계로 키워 보세요."
  >
  <meta property="og:type" content="website">

  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="manifest" href="/manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
          href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap"
          rel="stylesheet"
  >

  <style>
    :root {
      --background: #ffffff;
      --surface: #ffffff;
      --surface-soft: #f8fafc;

      --text: #111827;
      --text-soft: #6b7280;

      --border: #e5e7eb;
      --border-dark: #d1d5db;

      --game-background: #141b30;

      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: var(--background);
      color: var(--text);

      font-family: "Noto Sans KR", sans-serif;
      letter-spacing: -0.04em;
      word-break: keep-all;
    }

    button,
    canvas {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(100% - 32px, 720px);
      margin: 0 auto;
      padding: 60px 0;
    }

    .page-header {
      margin-bottom: 28px;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;

      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 800;
      line-height: 1.2;
    }

    .lead {
      max-width: 640px;
      margin: 0 auto;

      color: var(--text-soft);

      font-size: 1.05rem;
      line-height: 1.8;
    }

    .card {
      padding: 24px;

      background: var(--surface);

      border: 1px solid var(--border);
      border-radius: var(--radius);

      box-shadow: var(--shadow);
    }

    .type-hud {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;

      margin-bottom: 18px;
    }

    .hud-item {
      display: flex;
      align-items: center;
      gap: 6px;

      min-height: 40px;
      padding: 8px 14px;

      background: var(--surface-soft);

      border: 1px solid var(--border);
      border-radius: 14px;

      color: var(--text-soft);

      font-size: 0.9rem;
      white-space: nowrap;
    }

    .hud-item strong {
      color: var(--text);

      font-size: 1rem;
      font-weight: 800;
    }

    #hud-next {
      font-size: 1.25rem;
      line-height: 1;
    }

    button {
      min-height: 40px;
      padding: 8px 14px;

      background: #ffffff;
      color: var(--text);

      border: 1px solid var(--border-dark);
      border-radius: 14px;

      cursor: pointer;

      font-weight: 700;

      transition:
              background 0.15s ease,
              border-color 0.15s ease,
              transform 0.15s ease;
    }

    button:hover {
      background: var(--surface-soft);
      border-color: #9ca3af;
    }

    button:active {
      transform: scale(0.97);
    }

    button:focus-visible {
      outline: 3px solid rgba(17, 24, 39, 0.15);
      outline-offset: 2px;
    }

    .sfx-button {
      width: 42px;
      padding: 7px;

      font-size: 1rem;
      line-height: 1;
    }

    .game-wrap {
      display: flex;
      justify-content: center;

      width: 100%;
    }

    #game {
      display: block;

      width: 100%;
      max-width: 440px;

      margin: 0 auto;

      background: var(--game-background);

      border-radius: 18px;

      touch-action: none;
      user-select: none;
    }

    .fruit-chain {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;

      gap: 3px;

      min-height: 36px;
      margin-top: 10px;

      font-size: 1.15rem;
      line-height: 1.5;

      letter-spacing: 0;
    }

    .fruit-chain span {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      transition:
              opacity 0.2s ease,
              transform 0.2s ease;
    }

    .fruit-chain .locked {
      opacity: 0.22;
      filter: grayscale(0.7);
    }

    .fruit-chain .unlocked {
      opacity: 1;
    }

    .game-help {
      max-width: 600px;
      margin: 6px auto 0;

      color: var(--text-soft);

      font-size: 0.88rem;
      line-height: 1.75;
      text-align: center;
    }

    .game-help strong {
      color: var(--text);
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .container {
        width: min(100% - 20px, 720px);
        padding: 32px 0;
      }

      .card {
        padding: 14px;
        border-radius: 20px;
      }

      .type-hud {
        display: grid;
        grid-template-columns:
          repeat(3, minmax(0, 1fr))
          42px;

        gap: 7px;

        margin-bottom: 14px;
      }

      .hud-item {
        justify-content: center;

        min-width: 0;
        padding: 7px 5px;

        font-size: 0.78rem;
      }

      .hud-item strong {
        font-size: 0.88rem;
      }

      #hud-next {
        font-size: 1.1rem;
      }

      .sfx-button {
        width: 42px;
      }

      #game {
        border-radius: 14px;
      }

      .fruit-chain {
        font-size: 1.05rem;
      }
    }

    @media (max-width: 400px) {
      .type-hud {
        grid-template-columns:
          repeat(3, minmax(0, 1fr))
          38px;
      }

      .hud-item {
        flex-direction: column;
        gap: 1px;

        min-height: 48px;
      }

      .sfx-button {
        width: 38px;
        height: 48px;
        padding: 4px;
      }

      .fruit-chain {
        font-size: 0.95rem;
      }

      .game-help {
        font-size: 0.8rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

<main class="container">

  <header class="page-header">

    <h1>🍉 과일 머지</h1>

    <p class="lead">
      같은 과일을 부딪히면 더 큰 과일로!
      체리에서 수박까지 10단계를 합쳐 올리는 물리 퍼즐.
      상자가 넘치기 전에 얼마나 크게 키울 수 있을까요?
    </p>

  </header>

  <section
          class="card typing-card"
          aria-label="과일 머지 게임"
  >

    <div class="type-hud">

        <span class="hud-item">
          점수
          <strong id="hud-score">0</strong>
        </span>

      <span class="hud-item">
          다음
          <strong id="hud-next">🍒</strong>
        </span>

      <span class="hud-item">
          최고
          <strong id="hud-best">0</strong>
        </span>

      <button
              id="sfx-btn"
              class="sfx-button"
              type="button"
              aria-label="효과음 켜기 또는 끄기"
              aria-pressed="false"
      >
        🔇
      </button>

    </div>

    <div class="game-wrap">

      <canvas
              id="game"
              aria-label="과일 머지 게임 화면"
      ></canvas>

    </div>

    <div
            id="hud-chain"
            class="fruit-chain"
            aria-label="과일 진화 단계"
    ></div>

    <p class="game-help">
      👆 손가락(마우스)을 움직여 조준, 떼면 낙하
      · 💻 PC: <strong>← →</strong> 이동,
      <strong>Space</strong> 낙하
      · 🔥 1.3초 안에 연쇄 합체하면
      <strong>콤보 배수!</strong>
    </p>

  </section>

</main>

<script>
  "use strict";

  /*
   * Fruit Merge
   * Vanilla JavaScript
   *
   * 같은 단계의 과일이 충돌하면
   * 다음 단계의 과일로 합쳐집니다.
   */

  const canvas =
                document.getElementById("game");

  const ctx =
                canvas.getContext("2d");

  const scoreElement =
                document.getElementById("hud-score");

  const nextElement =
                document.getElementById("hud-next");

  const bestElement =
                document.getElementById("hud-best");

  const chainElement =
                document.getElementById("hud-chain");

  const sfxButton =
                document.getElementById("sfx-btn");

  /*
   * 최고 점수
   */

  const BEST_KEY =
                "merge_best_v1";

  /*
   * 과일 데이터
   *
   * radius = 반지름
   * emoji  = 표시할 과일
   * score  = 합체 기본 점수
   */

  const FRUITS = [
    {
      radius: 13,
      emoji: "🍒",
      score: 10
    },
    {
      radius: 17,
      emoji: "🍓",
      score: 20
    },
    {
      radius: 22,
      emoji: "🍇",
      score: 40
    },
    {
      radius: 27,
      emoji: "🍊",
      score: 70
    },
    {
      radius: 33,
      emoji: "🍎",
      score: 110
    },
    {
      radius: 40,
      emoji: "🍐",
      score: 160
    },
    {
      radius: 48,
      emoji: "🍑",
      score: 220
    },
    {
      radius: 57,
      emoji: "🍍",
      score: 290
    },
    {
      radius: 67,
      emoji: "🍈",
      score: 370
    },
    {
      radius: 78,
      emoji: "🍉",
      score: 460
    }
  ];

  /*
   * 물리 설정
   */

  const GRAVITY = 1500;

  const RESTITUTION = 0.18;

  const DAMPING = 0.995;

  /*
   * 게임오버 기준선
   */

  const TOP_Y = 84;

  /*
   * Canvas 크기
   */

  let width = 0;
  let height = 0;
  let devicePixelRatio = 1;

  function resizeCanvas() {

    devicePixelRatio =
            Math.min(
                    2,
                    window.devicePixelRatio || 1
            );

    width =
            Math.min(
                    canvas.clientWidth,
                    440
            );

    height =
            Math.max(
                    480,
                    Math.min(
                            600,
                            Math.round(
                                    window.innerHeight * 0.62
                            )
                    )
            );

    canvas.style.height =
            height + "px";

    canvas.width =
            Math.round(
                    width * devicePixelRatio
            );

    canvas.height =
            Math.round(
                    height * devicePixelRatio
            );

    ctx.setTransform(
            devicePixelRatio,
            0,
            0,
            devicePixelRatio,
            0,
            0
    );

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
  }

  /*
   * 상태
   *
   * idle    = 시작 전
   * playing = 게임 중
   * over    = 게임 오버
   */

  let gameState = "idle";

  let fruits = [];

  let score = 0;

  let nextLevel = 0;

  let aimX = 0;

  let dropCooldown = 0;

  let gameOverTimer = 0;

  let lastTimestamp = 0;

  /*
   * 재미 요소
   */

  let combo = 0;

  let lastMergeTime = 0;

  let floatingScores = [];

  let maxFruitLevel = 0;

  let screenShake = 0;

  /*
   * 효과음
   */

  const SFX_KEY =
                "fruit_merge_sfx_v1";

  let sfxEnabled =
              localStorage.getItem(SFX_KEY) === "1";

  let audioContext = null;

  function updateSfxButton() {

    sfxButton.textContent =
            sfxEnabled ? "🔊" : "🔇";

    sfxButton.setAttribute(
            "aria-pressed",
            String(sfxEnabled)
    );

    sfxButton.setAttribute(
            "aria-label",
            sfxEnabled
                    ? "효과음 끄기"
                    : "효과음 켜기"
    );
  }

  function getAudioContext() {

    if (!audioContext) {

      const AudioContextClass =
                    window.AudioContext ||
                    window.webkitAudioContext;

      if (!AudioContextClass) {
        return null;
      }

      audioContext =
              new AudioContextClass();
    }

    if (
            audioContext.state === "suspended"
    ) {
      audioContext.resume();
    }

    return audioContext;
  }

  function playTone(
          frequency,
          duration,
          volume,
          type
  ) {

    if (!sfxEnabled) {
      return;
    }

    const context =
                  getAudioContext();

    if (!context) {
      return;
    }

    const oscillator =
                  context.createOscillator();

    const gain =
                  context.createGain();

    oscillator.type =
            type || "sine";

    oscillator.frequency.setValueAtTime(
            frequency,
            context.currentTime
    );

    gain.gain.setValueAtTime(
            volume,
            context.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
            0.001,
            context.currentTime +
            duration
    );

    oscillator.connect(gain);

    gain.connect(
            context.destination
    );

    oscillator.start();

    oscillator.stop(
            context.currentTime +
            duration
    );
  }

  function playClickSound() {

    playTone(
            280,
            0.05,
            0.025,
            "sine"
    );
  }

  function playDropSound() {

    playTone(
            340,
            0.07,
            0.025,
            "sine"
    );
  }

  function playMergeSound() {

    playTone(
            600,
            0.09,
            0.035,
            "sine"
    );
  }

  function playComboSound() {

    playTone(
            760,
            0.08,
            0.035,
            "sine"
    );

    window.setTimeout(
            function () {

              playTone(
                      980,
                      0.1,
                      0.03,
                      "sine"
              );

            },
            70
    );
  }

  function playWatermelonSound() {

    playTone(
            520,
            0.1,
            0.04,
            "sine"
    );

    window.setTimeout(
            function () {

              playTone(
                      700,
                      0.12,
                      0.04,
                      "sine"
              );

            },
            80
    );

    window.setTimeout(
            function () {

              playTone(
                      920,
                      0.18,
                      0.04,
                      "sine"
              );

            },
            160
    );
  }

  function playGameOverSound() {

    playTone(
            180,
            0.18,
            0.04,
            "sawtooth"
    );

    window.setTimeout(
            function () {

              playTone(
                      120,
                      0.35,
                      0.04,
                      "sawtooth"
              );

            },
            140
    );
  }

  sfxButton.addEventListener(
          "click",
          function () {

            sfxEnabled =
                    !sfxEnabled;

            localStorage.setItem(
                    SFX_KEY,
                    sfxEnabled ? "1" : "0"
            );

            updateSfxButton();

            if (sfxEnabled) {

              playTone(
                      660,
                      0.08,
                      0.03,
                      "sine"
              );
            }
          }
  );

  /*
   * 게임 초기화
   */

  function resetGame() {

    fruits = [];

    score = 0;

    nextLevel = 0;

    dropCooldown = 0;

    gameOverTimer = 0;

    lastTimestamp = 0;

    aimX =
            width / 2;

    combo = 0;

    lastMergeTime = 0;

    floatingScores = [];

    maxFruitLevel = 0;

    screenShake = 0;

    rollNextFruit();

    updateFruitChain();

    updateHud();
  }

  /*
   * 다음 과일
   *
   * 처음 네 단계의 과일만
   * 직접 떨어집니다.
   */

  function rollNextFruit() {

    nextLevel =
            Math.floor(
                    Math.random() * 4
            );

    nextElement.textContent =
            FRUITS[nextLevel].emoji;
  }

  /*
   * 과일 진화 단계
   */

  function updateFruitChain() {

    chainElement.innerHTML =
            FRUITS.map(
                    function (fruit, index) {

                      const className =
                                    index <= maxFruitLevel
                                            ? "unlocked"
                                            : "locked";

                      return (
                              '<span class="' +
                              className +
                              '" title="' +
                              (index + 1) +
                              '단계">' +
                              fruit.emoji +
                              "</span>"
                      );
                    }
            ).join("");
  }

  /*
   * 과일 떨어뜨리기
   */

  function dropFruit() {

    if (
            dropCooldown > 0 ||
            gameState !== "playing"
    ) {
      return;
    }

    const fruitData =
                  FRUITS[nextLevel];

    const radius =
                  fruitData.radius;

    const x =
                  Math.max(
                          radius + 2,

                          Math.min(
                                  width -
                                  radius -
                                  2,

                                  aimX
                          )
                  );

    fruits.push({
      x: x,

      y:
              TOP_Y -
              radius -
              4,

      velocityX: 0,

      velocityY: 60,

      level: nextLevel,

      radius: radius,

      born: 0
    });

    /*
     * 연속 낙하 방지
     */

    dropCooldown = 0.45;

    playDropSound();

    rollNextFruit();
  }

  /*
   * 물리 계산
   */

  function updatePhysics(
          deltaTime
  ) {

    /*
     * 중력과 이동
     */

    for (
            const fruit of fruits
            ) {

      fruit.born +=
              deltaTime;

      fruit.velocityY +=
              GRAVITY *
              deltaTime;

      fruit.velocityX *=
              DAMPING;

      fruit.velocityY *=
              DAMPING;

      fruit.x +=
              fruit.velocityX *
              deltaTime;

      fruit.y +=
              fruit.velocityY *
              deltaTime;
    }

    /*
     * 충돌을 여러 번 반복하여
     * 과일이 서로 겹치는 현상을 줄입니다.
     */

    for (
            let iteration = 0;
            iteration < 5;
            iteration++
    ) {

      /*
       * 벽 / 바닥 충돌
       */

      for (
              const fruit of fruits
              ) {

        if (
                fruit.x <
                fruit.radius
        ) {

          fruit.x =
                  fruit.radius;

          fruit.velocityX =
                  Math.abs(
                          fruit.velocityX
                  ) *
                  RESTITUTION;
        }

        if (
                fruit.x >
                width -
                fruit.radius
        ) {

          fruit.x =
                  width -
                  fruit.radius;

          fruit.velocityX =
                  -Math.abs(
                          fruit.velocityX
                  ) *
                  RESTITUTION;
        }

        if (
                fruit.y >
                height -
                fruit.radius
        ) {

          fruit.y =
                  height -
                  fruit.radius;

          if (
                  fruit.velocityY > 0
          ) {

            fruit.velocityY =
                    -fruit.velocityY *
                    RESTITUTION;
          }

          fruit.velocityX *=
                  0.96;
        }
      }

      /*
       * 과일끼리 충돌
       */

      for (
              let i = 0;
              i < fruits.length;
              i++
      ) {

        for (
                let j = i + 1;
                j < fruits.length;
                j++
        ) {

          const fruitA =
                        fruits[i];

          const fruitB =
                        fruits[j];

          const deltaX =
                        fruitB.x -
                        fruitA.x;

          const deltaY =
                        fruitB.y -
                        fruitA.y;

          const radiusSum =
                        fruitA.radius +
                        fruitB.radius;

          const distanceSquared =
                        deltaX *
                        deltaX +
                        deltaY *
                        deltaY;

          if (
                  distanceSquared >=
                  radiusSum *
                  radiusSum ||
                  distanceSquared === 0
          ) {
            continue;
          }

          const distance =
                        Math.sqrt(
                                distanceSquared
                        );

          const normalX =
                        deltaX /
                        distance;

          const normalY =
                        deltaY /
                        distance;

          /*
           * 같은 단계 과일이면 합체
           *
           * 첫 번째 충돌 반복에서만
           * 합체시켜 중복 합체를 방지합니다.
           */

          if (
                  fruitA.level ===
                  fruitB.level &&
                  iteration === 0
          ) {

            mergeFruits(
                    i,
                    j
            );

            /*
             * 배열이 변경되었으므로
             * 현재 프레임의 물리를
             * 처음부터 다시 계산합니다.
             */

            updatePhysics(0);

            return;
          }

          /*
           * 겹침 해소
           */

          const overlap =
                        radiusSum -
                        distance;

          /*
           * 질량은 원의 면적에
           * 비례한다고 가정
           */

          const massA =
                        fruitA.radius *
                        fruitA.radius;

          const massB =
                        fruitB.radius *
                        fruitB.radius;

          const totalMass =
                        massA +
                        massB;

          fruitA.x -=
                  normalX *
                  overlap *
                  (
                          massB /
                          totalMass
                  );

          fruitA.y -=
                  normalY *
                  overlap *
                  (
                          massB /
                          totalMass
                  );

          fruitB.x +=
                  normalX *
                  overlap *
                  (
                          massA /
                          totalMass
                  );

          fruitB.y +=
                  normalY *
                  overlap *
                  (
                          massA /
                          totalMass
                  );

          /*
           * 충돌 속도 계산
           */

          const relativeVelocityX =
                        fruitB.velocityX -
                        fruitA.velocityX;

          const relativeVelocityY =
                        fruitB.velocityY -
                        fruitA.velocityY;

          const velocityNormal =
                        relativeVelocityX *
                        normalX +
                        relativeVelocityY *
                        normalY;

          if (
                  velocityNormal < 0
          ) {

            const impulse =
                          -(
                                  1 +
                                  RESTITUTION
                          ) *
                          velocityNormal /
                          (
                                  1 / massA +
                                  1 / massB
                          );

            fruitA.velocityX -=
                    impulse *
                    normalX /
                    massA;

            fruitA.velocityY -=
                    impulse *
                    normalY /
                    massA;

            fruitB.velocityX +=
                    impulse *
                    normalX /
                    massB;

            fruitB.velocityY +=
                    impulse *
                    normalY /
                    massB;
          }
        }
      }
    }
  }

  /*
   * 과일 합체
   */

  function mergeFruits(
          firstIndex,
          secondIndex
  ) {

    const fruitA =
                  fruits[firstIndex];

    const fruitB =
                  fruits[secondIndex];

    const level =
                  fruitA.level;

    const newX =
                  (
                          fruitA.x +
                          fruitB.x
                  ) / 2;

    const newY =
                  (
                          fruitA.y +
                          fruitB.y
                  ) / 2;

    /*
     * 뒤쪽 인덱스를 먼저 삭제
     */

    fruits.splice(
            secondIndex,
            1
    );

    fruits.splice(
            firstIndex,
            1
    );

    /*
     * 1.3초 이내 연쇄 합체 시
     * 콤보 증가
     */

    const now =
                  performance.now();

    if (
            now -
            lastMergeTime <
            1300
    ) {

      combo++;

    } else {

      combo = 1;
    }

    lastMergeTime =
            now;

    /*
     * 합체 점수 × 콤보
     */

    const gainedScore =
                  FRUITS[level].score *
                  combo;

    score +=
            gainedScore;

    floatingScores.push({
      x: newX,
      y: newY,
      time: 0,

      text:
              "+" +
              gainedScore +
              (
                      combo > 1
                              ? " ×" +
                              combo
                              : ""
              )
    });

    /*
     * 수박 전 단계까지
     * 다음 과일 생성
     */

    if (
            level + 1 <
            FRUITS.length
    ) {

      const newLevel =
                    level + 1;

      fruits.push({
        x: newX,
        y: newY,

        velocityX: 0,
        velocityY: -90,

        level: newLevel,

        radius:
        FRUITS[
                newLevel
                ].radius,

        born: 0
      });

      /*
       * 새로운 과일 단계 해금
       */

      if (
              newLevel >
              maxFruitLevel
      ) {

        maxFruitLevel =
                newLevel;

        updateFruitChain();
      }

      /*
       * 큰 과일 합체 시
       * 화면 흔들림
       */

      if (
              level >= 5
      ) {

        screenShake =
                0.3;
      }

      playMergeSound();

      if (
              combo >= 3
      ) {

        playComboSound();
      }

    } else {

      /*
       * 수박 + 수박
       *
       * 두 수박은 사라지고
       * 1,000점 보너스
       */

      score += 1000;

      floatingScores.push({
        x: newX,
        y: newY - 30,
        time: 0,
        text: "🍉 +1,000!"
      });

      screenShake =
              0.5;

      playWatermelonSound();
    }

    updateHud();
  }

  /*
   * 게임오버 검사
   *
   * 생성 후 1.2초 이상 지난 과일이
   * 상단선을 넘은 상태에서
   * 거의 멈춰 있으면 위험 상태입니다.
   *
   * 이 상태가 1.6초 이상 유지되면
   * 게임 오버입니다.
   */

  function checkGameOver(
          deltaTime
  ) {

    const danger =
                  fruits.some(
                          function (fruit) {

                            return (
                                    fruit.born > 1.2 &&
                                    fruit.y -
                                    fruit.radius <
                                    TOP_Y &&
                                    Math.abs(
                                            fruit.velocityY
                                    ) < 40
                            );
                          }
                  );

    if (danger) {

      gameOverTimer +=
              deltaTime;

    } else {

      gameOverTimer = 0;
    }

    if (
            gameOverTimer >
            1.6
    ) {

      gameOver();
    }
  }

  /*
   * HUD
   */

  function updateHud() {

    scoreElement.textContent =
            score.toLocaleString(
                    "ko-KR"
            );

    const savedBest =
                  parseInt(
                          localStorage.getItem(
                                  BEST_KEY
                          ),
                          10
                  ) || 0;

    bestElement.textContent =
            Math.max(
                    score,
                    savedBest
            ).toLocaleString(
                    "ko-KR"
            );
  }

  /*
   * 그리기
   */

  function draw() {

    ctx.clearRect(
            0,
            0,
            width,
            height
    );

    ctx.save();

    /*
     * 화면 흔들림
     */

    if (
            screenShake > 0
    ) {

      ctx.translate(
              (
                      Math.random() -
                      0.5
              ) *
              screenShake *
              16,

              (
                      Math.random() -
                      0.5
              ) *
              screenShake *
              16
      );
    }

    /*
     * 게임오버 라인
     */

    ctx.strokeStyle =
            gameOverTimer > 0
                    ? "rgba(235,87,87,0.95)"
                    : "rgba(255,255,255,0.18)";

    ctx.lineWidth = 1;

    ctx.setLineDash([
      7,
      7
    ]);

    ctx.beginPath();

    ctx.moveTo(
            0,
            TOP_Y
    );

    ctx.lineTo(
            width,
            TOP_Y
    );

    ctx.stroke();

    ctx.setLineDash([]);

    /*
     * 조준선과 다음 과일
     */

    if (
            gameState === "playing" &&
            dropCooldown <= 0
    ) {

      ctx.strokeStyle =
              "rgba(255,255,255,0.12)";

      ctx.beginPath();

      ctx.moveTo(
              aimX,
              TOP_Y
      );

      ctx.lineTo(
              aimX,
              height
      );

      ctx.stroke();

      const nextFruit =
                    FRUITS[nextLevel];

      ctx.font =
              nextFruit.radius *
              1.9 +
              "px serif";

      ctx.globalAlpha =
              0.85;

      ctx.fillText(
              nextFruit.emoji,
              aimX,
              TOP_Y -
              nextFruit.radius -
              4
      );

      ctx.globalAlpha = 1;
    }

    /*
     * 과일
     */

    for (
            const fruit of fruits
            ) {

      /*
       * 생성 직후
       * 작게 시작하는 팝 효과
       */

      const scale =
                    Math.min(
                            1,
                            0.55 +
                            fruit.born *
                            3.2
                    );

      ctx.font =
              fruit.radius *
              1.9 *
              scale +
              "px serif";

      ctx.fillText(
              FRUITS[
                      fruit.level
                      ].emoji,

              fruit.x,

              fruit.y +
              fruit.radius *
              0.06
      );
    }

    /*
     * 점수 플로팅
     */

    for (
            const floating of
            floatingScores
            ) {

      ctx.globalAlpha =
              Math.max(
                      0,
                      1 -
                      floating.time
              );

      ctx.font =
              "800 16px 'Noto Sans KR', sans-serif";

      ctx.fillStyle =
              "#ffd76a";

      ctx.fillText(
              floating.text,

              floating.x,

              floating.y -
              floating.time *
              46
      );

      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  /*
   * 오버레이
   */

  function drawOverlay(
          lines
  ) {

    ctx.fillStyle =
            "rgba(5,8,20,0.65)";

    ctx.fillRect(
            0,
            0,
            width,
            height
    );

    ctx.fillStyle =
            "#ffffff";

    lines.forEach(
            function (line) {

              ctx.font =
                      "700 " +
                      line.size +
                      "px 'Noto Sans KR', sans-serif";

              ctx.fillText(
                      line.text,
                      width / 2,
                      height / 2 +
                      line.offsetY
              );
            }
    );
  }

  /*
   * 시작 화면
   */

  function drawIdle() {

    resetGame();

    draw();

    drawOverlay([
      {
        text: "🍉 과일 머지",
        size: 28,
        offsetY: -30
      },
      {
        text: "화면을 터치하면 시작!",
        size: 16,
        offsetY: 10
      },
      {
        text: "움직여 조준, 손을 떼면 낙하",
        size: 13,
        offsetY: 36
      }
    ]);
  }

  /*
   * 게임 시작
   */

  function startGame() {

    if (
            gameState === "playing"
    ) {
      return;
    }

    resetGame();

    gameState =
            "playing";

    playClickSound();

    requestAnimationFrame(
            gameLoop
    );
  }

  /*
   * 게임 오버
   */

  function gameOver() {

    gameState =
            "over";

    playGameOverSound();

    /*
     * 최고 점수 저장
     */

    const savedBest =
                  parseInt(
                          localStorage.getItem(
                                  BEST_KEY
                          ),
                          10
                  ) || 0;

    const best =
                  Math.max(
                          score,
                          savedBest
                  );

    localStorage.setItem(
            BEST_KEY,
            String(best)
    );

    bestElement.textContent =
            best.toLocaleString(
                    "ko-KR"
            );

    draw();

    drawOverlay([
      {
        text:
                "게임 오버 — " +
                score.toLocaleString(
                        "ko-KR"
                ) +
                "점",

        size: 24,
        offsetY: -34
      },
      {
        text:
                "선 위로 넘치면 끝!",

        size: 15,
        offsetY: 2
      },
      {
        text:
                "터치 또는 Space로 다시 도전",

        size: 15,
        offsetY: 32
      }
    ]);
  }

  /*
   * 메인 루프
   */

  function gameLoop(
          timestamp
  ) {

    if (
            gameState !== "playing"
    ) {
      return;
    }

    if (!lastTimestamp) {

      lastTimestamp =
              timestamp;
    }

    const deltaTime =
                  Math.min(
                          0.033,
                          (
                                  timestamp -
                                  lastTimestamp
                          ) /
                          1000
                  );

    lastTimestamp =
            timestamp;

    /*
     * 낙하 쿨다운
     */

    if (
            dropCooldown > 0
    ) {

      dropCooldown -=
              deltaTime;
    }

    /*
     * 화면 흔들림
     */

    if (
            screenShake > 0
    ) {

      screenShake -=
              deltaTime;

      if (
              screenShake < 0
      ) {

        screenShake = 0;
      }
    }

    /*
     * 점수 텍스트 애니메이션
     */

    floatingScores.forEach(
            function (floating) {

              floating.time +=
                      deltaTime;
            }
    );

    floatingScores =
            floatingScores.filter(
                    function (floating) {

                      return (
                              floating.time <
                              1
                      );
                    }
            );

    /*
     * 물리
     */

    updatePhysics(
            deltaTime
    );

    /*
     * 게임오버 검사
     */

    checkGameOver(
            deltaTime
    );

    if (
            gameState !== "playing"
    ) {
      return;
    }

    draw();

    requestAnimationFrame(
            gameLoop
    );
  }

  /*
   * 포인터 좌표
   *
   * CSS 크기와 실제 Canvas 논리 크기가
   * 다를 수 있으므로 비율을 적용합니다.
   */

  function getPointerX(
          event
  ) {

    const rect =
                  canvas.getBoundingClientRect();

    return (
                    event.clientX -
                    rect.left
            ) *
            (
                    width /
                    rect.width
            );
  }

  /*
   * 마우스 / 터치
   */

  canvas.addEventListener(
          "pointerdown",
          function (event) {

            event.preventDefault();

            canvas.setPointerCapture(
                    event.pointerId
            );

            if (
                    gameState !== "playing"
            ) {

              startGame();

              return;
            }

            aimX =
                    getPointerX(event);
          }
  );

  canvas.addEventListener(
          "pointermove",
          function (event) {

            if (
                    gameState !== "playing"
            ) {
              return;
            }

            aimX =
                    getPointerX(event);
          }
  );

  canvas.addEventListener(
          "pointerup",
          function (event) {

            if (
                    gameState !== "playing"
            ) {
              return;
            }

            aimX =
                    getPointerX(event);

            dropFruit();
          }
  );

  canvas.addEventListener(
          "pointercancel",
          function () {
            /* 별도 처리 없음 */
          }
  );

  /*
   * 키보드
   */

  window.addEventListener(
          "keydown",
          function (event) {

            if (
                    event.key ===
                    "ArrowLeft"
            ) {

              aimX =
                      Math.max(
                              10,
                              aimX - 22
                      );

              event.preventDefault();

              return;
            }

            if (
                    event.key ===
                    "ArrowRight"
            ) {

              aimX =
                      Math.min(
                              width - 10,
                              aimX + 22
                      );

              event.preventDefault();

              return;
            }

            if (
                    event.key === " " ||
                    event.key ===
                    "ArrowDown"
            ) {

              event.preventDefault();

              if (
                      gameState !==
                      "playing"
              ) {

                startGame();

              } else {

                dropFruit();
              }
            }
          }
  );

  /*
   * 브라우저 크기 변경
   */

  window.addEventListener(
          "resize",
          function () {

            resizeCanvas();

            aimX =
                    Math.max(
                            10,

                            Math.min(
                                    width - 10,
                                    aimX
                            )
                    );

            /*
             * 플레이 중 resize 시
             * 과일 데이터를 초기화하지 않습니다.
             */

            if (
                    gameState === "idle"
            ) {

              drawIdle();

            } else {

              draw();
            }
          }
  );

  /*
   * 초기화
   */

  function initializeGame() {

    resizeCanvas();

    const savedBest =
                  parseInt(
                          localStorage.getItem(
                                  BEST_KEY
                          ),
                          10
                  ) || 0;

    bestElement.textContent =
            savedBest.toLocaleString(
                    "ko-KR"
            );

    updateSfxButton();

    drawIdle();
  }

  initializeGame();
</script>
