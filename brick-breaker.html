<!DOCTYPE html>
<html lang="ko">
<head>

    >

            name="keywords"
            content="벽돌깨기, 벽돌깨기 게임, 브레이크아웃, Breakout, 무료 게임, 웹 게임, HTML5 게임"

            content="패들로 공을 튕겨 벽돌을 모두 부수세요. 레벨이 올라갈수록 어려워집니다."
    >

    <style>
        :root {
            --background: #ffffff;
            --surface: #ffffff;
            --surface-soft: #f8fafc;

            --text: #111827;
            --text-soft: #6b7280;

            --border: #e5e7eb;

            --game-background: #0d1124;

        }

        * {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: var(--background);
            color: var(--text);

            font-family: "Noto Sans KR", sans-serif;
            letter-spacing: -0.04em;
            word-break: keep-all;
        }

        button {
            font: inherit;
        }

        button,
        canvas {
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: min(100% - 32px, 760px);
            margin: 0 auto;
            padding: 60px 0;
        }

        .page-header {
            margin-bottom: 28px;
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;

            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 800;
            line-height: 1.2;
        }

        .lead {
            max-width: 620px;
            margin: 0 auto;

            color: var(--text-soft);

            font-size: 1.05rem;
            line-height: 1.8;
        }

        .card {
            padding: 24px;

            background: var(--surface);

            border: 1px solid var(--border);
            border-radius: var(--radius);

            box-shadow: var(--shadow);
        }

        .type-hud {
            display: flex;
            flex-wrap: wrap;
            align-items: center;

            margin-bottom: 18px;
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 6px;

            min-height: 40px;
            padding: 8px 14px;

            background: var(--surface-soft);

            border: 1px solid var(--border);
            border-radius: 14px;

            color: var(--text-soft);

            font-size: 0.9rem;
            white-space: nowrap;
        }

        .hud-item strong {
            color: var(--text);

            font-size: 1rem;
            font-weight: 800;
        }

        .lives {
            letter-spacing: 0;
        }

        button {
            min-height: 40px;
            padding: 8px 14px;

            background: #ffffff;
            color: var(--text);

            border: 1px solid var(--border-dark);
            border-radius: 14px;

            cursor: pointer;

            font-weight: 700;

            transition:
                    background 0.15s ease,
                    border-color 0.15s ease,
                    transform 0.15s ease;
        }

        button:hover {
            background: var(--surface-soft);
            border-color: #9ca3af;
        }

        button:active {
            transform: scale(0.97);

        button:focus-visible {
            outline: 3px solid rgba(17, 24, 39, 0.15);
            outline-offset: 2px;
        }

        .sfx-button {
            width: 42px;
            padding: 7px;

            font-size: 1rem;
            line-height: 1;
        }

        .game-wrap {
            position: relative;
            width: 100%;

            overflow: hidden;

            background: var(--game-background);

            border-radius: 18px;
        }

        #game {
            display: block;

            width: 100%;

            background: var(--game-background);

            border-radius: 18px;

        .game-help {
            margin: 12px 0 0;

            color: var(--text-soft);

            font-size: 0.88rem;

        .game-help strong {

            font-weight: 700;
        }

        @media (max-width: 600px) {
            .container {
                width: min(100% - 20px, 760px);
                padding: 32px 0;
            }

            .card {
                padding: 14px;
                border-radius: 20px;
            }

            .type-hud {
                display: grid;
                grid-template-columns:
          repeat(3, minmax(0, 1fr))
          42px;

                gap: 7px;
                margin-bottom: 14px;
            }

            .hud-item {
                justify-content: center;

                min-width: 0;
                padding: 7px 6px;

                font-size: 0.78rem;
            }

            .hud-item strong {
                font-size: 0.88rem;
            }

            .sfx-button {
                width: 42px;
            }

            .game-wrap,
            #game {
                border-radius: 14px;
            }
        }

        @media (max-width: 420px) {
            .type-hud {
                grid-template-columns:
          repeat(3, minmax(0, 1fr))
          38px;
            }

            .hud-item {
                flex-direction: column;
                gap: 1px;

                min-height: 48px;
            }

            .sfx-button {
                width: 38px;
                height: 48px;
                padding: 4px;
            }

            .game-help {
                font-size: 0.8rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>

<main class="container">

    <header class="page-header">
        <h1>🧱 벽돌깨기</h1>

        <p class="lead">
            패들로 공을 튕겨 벽돌을 모두 부수세요.
            레벨이 오를수록 공은 빨라지고 벽돌은 단단해집니다.
            목숨은 3개!
        </p>
    </header>

    <section
            class="card typing-card"
            aria-label="벽돌깨기 게임"
    >

        <div class="type-hud">

        <span class="hud-item">
          점수
          <strong id="hud-score">0</strong>
        </span>

            <span class="hud-item">
          레벨
          <strong id="hud-level">1</strong>
        </span>

            <span class="hud-item">
          목숨
          <strong
                  id="hud-lives"
                  class="lives"
          >❤️❤️❤️</strong>
        </span>

            <button
                    id="sfx-btn"
                    class="sfx-button"
                    type="button"
                    aria-label="효과음 켜기 또는 끄기"
                    aria-pressed="false"
            >
                🔇
            </button>

        </div>

        <div class="game-wrap">
            <canvas
                    id="game"
                    aria-label="벽돌깨기 게임 화면"
            ></canvas>
        </div>

        <p class="game-help">
            💻 PC: 마우스 이동 또는
            <strong>← →</strong>
            · 📱 모바일: 드래그한 만큼 패들 이동
            · 🚀 터치 또는
            <strong>Space</strong>로 시작
        </p>

    </section>

</main>

<script>
    "use strict";

    /*
     * Brick Breaker
     * Vanilla JavaScript
     */

    const canvas =
              document.getElementById("game");

    const ctx =
              canvas.getContext("2d");

    const scoreElement =
              document.getElementById("hud-score");

    const levelElement =
              document.getElementById("hud-level");

    const livesElement =
              document.getElementById("hud-lives");

    const sfxButton =
              document.getElementById("sfx-btn");

    /*
     * Canvas
     */

    let width = 0;
    let height = 0;
    let devicePixelRatio = 1;

    function resizeCanvas() {

        devicePixelRatio =
            Math.min(
                2,
                window.devicePixelRatio || 1
            );

        width = canvas.clientWidth;

        height = Math.min(
            540,
            Math.max(
                400,
                Math.round(
                    window.innerHeight * 0.58
                )
            )
        );

        canvas.style.height =
            height + "px";

        canvas.width =
            Math.round(
                width * devicePixelRatio
            );

        canvas.height =
            Math.round(
                height * devicePixelRatio
            );

        ctx.setTransform(
            devicePixelRatio,
            0,
            0,
            devicePixelRatio,
            0,
            0
        );

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
    }

    /*
     * 게임 상태
     *
     * idle    = 시작 전
     * ready   = 공이 패들 위에서 대기
     * playing = 게임 중
     * over    = 게임 오버
     */

    let gameState = "idle";

    let paddle;
    let ball;
    let bricks;

    let score = 0;
    let level = 1;
    let lives = 3;
    let combo = 0;

    let lastTimestamp = 0;

    const keys = {};

    let particles = [];
    let screenShake = 0;
    let toastMessages = [];

    /*
     * 벽돌 색상
     */

    const BRICK_COLORS = [
        "#ff5a5f",
        "#ff9f43",
        "#feca57",
        "#1dd1a1",
        "#54a0ff",
        "#a29bfe"
    ];

    /*
     * 효과음
     * 외부 음원 없이 Web Audio API 사용
     */

    const SFX_KEY =
              "brick_breaker_sfx_v1";

    let sfxEnabled =
            localStorage.getItem(SFX_KEY) === "1";

    let audioContext = null;

    function updateSfxButton() {

        sfxButton.textContent =
            sfxEnabled ? "🔊" : "🔇";

        sfxButton.setAttribute(
            "aria-pressed",
            String(sfxEnabled)
        );

        sfxButton.setAttribute(
            "aria-label",
            sfxEnabled
                ? "효과음 끄기"
                : "효과음 켜기"
        );
    }

    function getAudioContext() {

        if (!audioContext) {

            const AudioContextClass =
                      window.AudioContext ||
                      window.webkitAudioContext;

            if (!AudioContextClass) {
                return null;
            }

            audioContext =
                new AudioContextClass();
        }

        if (
            audioContext.state ===
            "suspended"
        ) {
            audioContext.resume();
        }

        return audioContext;
    }

    function playTone(
        frequency,
        duration,
        volume,
        type
    ) {

        if (!sfxEnabled) {
            return;
        }

        const context =
                  getAudioContext();

        if (!context) {
            return;
        }

        const oscillator =
                  context.createOscillator();

        const gain =
                  context.createGain();

        oscillator.type =
            type || "sine";

        oscillator.frequency.setValueAtTime(
            frequency,
            context.currentTime
        );

        gain.gain.setValueAtTime(
            volume,
            context.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            context.currentTime + duration
        );

        oscillator.connect(gain);
        gain.connect(context.destination);

        oscillator.start();

        oscillator.stop(
            context.currentTime + duration
        );
    }

    function playClickSound() {
        playTone(
            250,
            0.04,
            0.025,
            "sine"
        );
    }

    function playBrickSound() {
        playTone(
            520,
            0.06,
            0.035,
            "square"
        );
    }

    function playBadSound() {
        playTone(
            130,
            0.25,
            0.04,
            "sawtooth"
        );
    }

    function playLevelSound() {

        playTone(
            520,
            0.1,
            0.035,
            "sine"
        );

        window.setTimeout(
            function () {
                playTone(
                    660,
                    0.1,
                    0.035,
                    "sine"
                );
            },
            80
        );

        window.setTimeout(
            function () {
                playTone(
                    880,
                    0.15,
                    0.035,
                    "sine"
                );
            },
            160
        );
    }

    function playGameOverSound() {

        playTone(
            180,
            0.18,
            0.04,
            "sawtooth"
        );

        window.setTimeout(
            function () {
                playTone(
                    120,
                    0.35,
                    0.04,
                    "sawtooth"
                );
            },
            130
        );
    }

    sfxButton.addEventListener(
        "click",
        function () {

            sfxEnabled = !sfxEnabled;

            localStorage.setItem(
                SFX_KEY,
                sfxEnabled ? "1" : "0"
            );

            updateSfxButton();

            if (sfxEnabled) {
                playTone(
                    660,
                    0.08,
                    0.03,
                    "sine"
                );
            }
        }
    );

    /*
     * 벽돌 생성
     */

    function buildBricks() {

        bricks = [];

        const columns = 8;

        const rows =
                  5 + Math.min(2, level - 1);

        const gap = 6;
        const top = 44;

        const brickWidth =
                  (
                      width -
                      gap * (columns + 1)
                  ) / columns;

        const brickHeight = 18;

        for (
            let row = 0;
            row < rows;
            row++
        ) {

            for (
                let column = 0;
                column < columns;
                column++
            ) {

                /*
                 * 레벨 2 이상에서는
                 * 위쪽 두 줄 일부가
                 * 두 번 맞아야 깨집니다.
                 */

                const hp =
                          level >= 2 &&
                          row < 2 &&
                          Math.random() < 0.35
                              ? 2
                              : 1;

                bricks.push({
                    x:
                        gap +
                        column *
                        (brickWidth + gap),

                    y:
                        top +
                        row *
                        (brickHeight + gap),

                    width: brickWidth,
                    height: brickHeight,

                    hp: hp,

                    color:
                        BRICK_COLORS[
                        row %
                        BRICK_COLORS.length
                            ]
                });
            }
        }
    }

    /*
     * 공 초기화
     */

    function resetBall() {

        ball = {
            x: paddle.x,
            y: paddle.y - 14,

            radius: 7,

            speed:
                250 +
                (level - 1) * 40,

            velocityX: 0,
            velocityY: 0
        };

        gameState = "ready";

        combo = 0;
    }

    /*
     * 새 게임
     */

    function newGame() {

        score = 0;
        level = 1;
        lives = 3;

        paddle = {
            x: width / 2,
            y: height - 26,

            width:
                Math.max(
                    70,
                    width * 0.2
                ),

            height: 12
        };

        particles = [];
        screenShake = 0;
        toastMessages = [];

        buildBricks();
        resetBall();
        updateHud();
    }

    /*
     * 공 발사
     */

    function launchBall() {

        if (gameState !== "ready") {
            return;
        }

        const angle =
                  -Math.PI / 2 +
                  (Math.random() - 0.5) *
                  0.7;

        ball.velocityX =
            Math.cos(angle) *
            ball.speed;

        ball.velocityY =
            Math.sin(angle) *
            ball.speed;

        gameState = "playing";

        playClickSound();

        lastTimestamp = 0;

        requestAnimationFrame(
            gameLoop
        );
    }

    /*
     * 파티클
     */

    function createBurst(
        x,
        y,
        color,
        amount,
        speed
    ) {

        amount = amount || 10;
        speed = speed || 180;

        for (
            let i = 0;
            i < amount;
            i++
        ) {

            const angle =
                      Math.random() *
                      Math.PI *
                      2;

            const velocity =
                      speed *
                      (
                          0.3 +
                          Math.random()
                      );

            particles.push({
                x: x,
                y: y,

                velocityX:
                    Math.cos(angle) *
                    velocity,

                velocityY:
                    Math.sin(angle) *
                    velocity,

                life:
                    0.35 +
                    Math.random() *
                    0.4,

                size:
                    1.5 +
                    Math.random() *
                    3,

                color: color
            });
        }
    }

    function updateEffects(
        deltaTime
    ) {

        for (
            let i =
                    particles.length - 1;
            i >= 0;
            i--
        ) {

            const particle =
                      particles[i];

            particle.life -=
                deltaTime;

            if (
                particle.life <= 0
            ) {

                particles.splice(
                    i,
                    1
                );

                continue;
            }

            particle.velocityY +=
                300 * deltaTime;

            particle.x +=
                particle.velocityX *
                deltaTime;

            particle.y +=
                particle.velocityY *
                deltaTime;
        }

        if (
            screenShake > 0.4
        ) {

            screenShake *=
                Math.pow(
                    0.002,
                    deltaTime
                );

        } else {

            screenShake = 0;
        }
    }

    /*
     * 화면 알림
     */

    function showToast(text) {

        toastMessages.push({
            text: text,

            until:
                performance.now() +
                1800
        });
    }

    /*
     * 게임 루프
     */

    function gameLoop(timestamp) {

        if (
            gameState !== "playing"
        ) {
            return;
        }

        if (!lastTimestamp) {
            lastTimestamp =
                timestamp;
        }

        const deltaTime =
                  Math.min(
                      0.03,
                      (
                          timestamp -
                          lastTimestamp
                      ) / 1000
                  );

        lastTimestamp =
            timestamp;

        /*
         * 키보드 패들 이동
         */

        const keyboardSpeed =
                  420 * deltaTime;

        if (keys.ArrowLeft) {

            paddle.x -=
                keyboardSpeed;
        }

        if (keys.ArrowRight) {

            paddle.x +=
                keyboardSpeed;
        }

        clampPaddle();

        /*
         * 공 이동
         */

        ball.x +=
            ball.velocityX *
            deltaTime;

        ball.y +=
            ball.velocityY *
            deltaTime;

        /*
         * 왼쪽 벽
         */

        if (
            ball.x <
            ball.radius
        ) {

            ball.x =
                ball.radius;

            ball.velocityX =
                Math.abs(
                    ball.velocityX
                );

            playClickSound();
        }

        /*
         * 오른쪽 벽
         */

        if (
            ball.x >
            width -
            ball.radius
        ) {

            ball.x =
                width -
                ball.radius;

            ball.velocityX =
                -Math.abs(
                    ball.velocityX
                );

            playClickSound();
        }

        /*
         * 위쪽 벽
         */

        if (
            ball.y <
            ball.radius
        ) {

            ball.y =
                ball.radius;

            ball.velocityY =
                Math.abs(
                    ball.velocityY
                );

            playClickSound();
        }

        /*
         * 패들 충돌
         */

        if (
            ball.velocityY > 0 &&
            ball.y +
            ball.radius >=
            paddle.y -
            paddle.height / 2 &&
            ball.y <
            paddle.y &&
            Math.abs(
                ball.x -
                paddle.x
            ) <
            paddle.width / 2 +
            ball.radius
        ) {

            /*
             * 패들 중심에서 멀리 맞을수록
             * 공의 각도가 크게 꺾입니다.
             */

            const relative =
                      (
                          ball.x -
                          paddle.x
                      ) /
                      (
                          paddle.width /
                          2
                      );

            const angle =
                      -Math.PI / 2 +
                      relative *
                      1.05;

            ball.velocityX =
                Math.cos(angle) *
                ball.speed;

            ball.velocityY =
                Math.sin(angle) *
                ball.speed;

            ball.y =
                paddle.y -
                paddle.height / 2 -
                ball.radius;

            combo = 0;

            playClickSound();
        }

        /*
         * 벽돌 충돌
         */

        for (
            let i =
                    bricks.length - 1;
            i >= 0;
            i--
        ) {

            const brick =
                      bricks[i];

            if (
                ball.x +
                ball.radius <
                brick.x ||

                ball.x -
                ball.radius >
                brick.x +
                brick.width ||

                ball.y +
                ball.radius <
                brick.y ||

                ball.y -
                ball.radius >
                brick.y +
                brick.height
            ) {
                continue;
            }

            /*
             * 어느 방향으로 더 깊게
             * 충돌했는지 계산
             */

            const overlapX =
                      Math.min(
                          ball.x +
                          ball.radius -
                          brick.x,

                          brick.x +
                          brick.width -
                          (
                              ball.x -
                              ball.radius
                          )
                      );

            const overlapY =
                      Math.min(
                          ball.y +
                          ball.radius -
                          brick.y,

                          brick.y +
                          brick.height -
                          (
                              ball.y -
                              ball.radius
                          )
                      );

            if (
                overlapX <
                overlapY
            ) {

                ball.velocityX =
                    -ball.velocityX;

            } else {

                ball.velocityY =
                    -ball.velocityY;
            }

            brick.hp--;

            /*
             * 벽돌 파괴
             */

            if (
                brick.hp <= 0
            ) {

                bricks.splice(
                    i,
                    1
                );

                combo++;

                const gainedScore =
                          10 *
                          level *
                          combo;

                score +=
                    gainedScore;

                createBurst(
                    ball.x,
                    ball.y,
                    brick.color,
                    12,
                    200
                );

                if (
                    combo >= 2
                ) {

                    showToast(
                        "🔥 콤보 x" +
                        combo +
                        " +" +
                        gainedScore
                    );
                }

                playBrickSound();

            } else {

                /*
                 * 내구도 벽돌
                 */

                createBurst(
                    ball.x,
                    ball.y,
                    "#cccccc",
                    5,
                    120
                );

                playClickSound();
            }

            updateHud();

            break;
        }

        /*
         * 레벨 클리어
         */

        if (
            bricks.length === 0
        ) {

            level++;

            score +=
                100 * level;

            showToast(
                "🎉 레벨 " +
                level +
                " 시작!"
            );

            playLevelSound();

            buildBricks();
            resetBall();

            updateHud();
            draw();

            return;
        }

        /*
         * 공 놓침
         */

        if (
            ball.y >
            height +
            ball.radius
        ) {

            lives--;

            updateHud();

            screenShake = 10;

            playBadSound();

            if (
                lives <= 0
            ) {

                gameOver();

                return;
            }

            resetBall();
            draw();

            return;
        }

        updateEffects(
            deltaTime
        );

        draw();

        requestAnimationFrame(
            gameLoop
        );
    }

    /*
     * HUD
     */

    function updateHud() {

        scoreElement.textContent =
            score.toLocaleString(
                "ko-KR"
            );

        levelElement.textContent =
            level;

        livesElement.textContent =
            lives > 0
                ? "❤️".repeat(lives)
                : "💔";
    }

    /*
     * 게임 화면 그리기
     */

    function draw() {

        ctx.clearRect(
            0,
            0,
            width,
            height
        );

        ctx.save();

        /*
         * 화면 흔들림
         */

        if (
            screenShake > 0
        ) {

            ctx.translate(
                (
                    Math.random() -
                    0.5
                ) *
                screenShake,

                (
                    Math.random() -
                    0.5
                ) *
                screenShake
            );
        }

        /*
         * 벽돌
         */

        for (
            const brick of bricks
            ) {

            ctx.fillStyle =
                brick.hp >= 2
                    ? "#b8c0cc"
                    : brick.color;

            drawRoundedRect(
                brick.x,
                brick.y,
                brick.width,
                brick.height,
                4
            );

            ctx.fill();

            /*
             * 내구도 2 벽돌 표시
             */

            if (
                brick.hp >= 2
            ) {

                ctx.fillStyle =
                    "rgba(255,255,255,0.38)";

                drawRoundedRect(
                    brick.x + 2,
                    brick.y + 2,
                    brick.width - 4,
                    4,
                    2
                );

                ctx.fill();
            }
        }

        /*
         * 패들
         */

        ctx.fillStyle =
            "#54a0ff";

        drawRoundedRect(
            paddle.x -
            paddle.width / 2,

            paddle.y -
            paddle.height / 2,

            paddle.width,
            paddle.height,
            6
        );

        ctx.fill();

        /*
         * 공
         */

        ctx.fillStyle = "#ffffff";

        ctx.beginPath();

        ctx.arc(
            ball.x,
            ball.y,
            ball.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

        /*
         * 파티클
         */

        for (
            const particle of particles
            ) {

            ctx.globalAlpha =
                Math.min(
                    1,
                    particle.life *
                    2.5
                );

            ctx.fillStyle =
                particle.color;

            ctx.beginPath();

            ctx.arc(
                particle.x,
                particle.y,
                particle.size,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        ctx.globalAlpha = 1;

        ctx.restore();

        /*
         * 토스트 메시지
         */

        drawToasts();
    }

    function drawRoundedRect(
        x,
        y,
        rectWidth,
        rectHeight,
        radius
    ) {

        ctx.beginPath();

        if (ctx.roundRect) {

            ctx.roundRect(
                x,
                y,
                rectWidth,
                rectHeight,
                radius
            );

        } else {

            ctx.rect(
                x,
                y,
                rectWidth,
                rectHeight
            );
        }
    }

    /*
     * 토스트 메시지
     */

    function drawToasts() {

        const now =
                  performance.now();

        toastMessages =
            toastMessages.filter(
                function (message) {
                    return (
                        message.until >
                        now
                    );
                }
            );

        let toastY = 26;

        for (
            const message of
            toastMessages
            ) {

            ctx.font =
                "700 15px 'Noto Sans KR', sans-serif";

            const toastWidth =
                      ctx.measureText(
                          message.text
                      ).width + 24;

            ctx.fillStyle =
                "rgba(20,26,48,0.82)";

            drawRoundedRect(
                width / 2 -
                toastWidth / 2,

                toastY - 14,

                toastWidth,
                28,
                14
            );

            ctx.fill();

            ctx.fillStyle =
                "#ffd76a";

            ctx.fillText(
                message.text,
                width / 2,
                toastY
            );

            toastY += 34;
        }
    }

    /*
     * 오버레이
     */

    function drawOverlay(
        lines
    ) {

        ctx.fillStyle =
            "rgba(5,8,20,0.65)";

        ctx.fillRect(
            0,
            0,
            width,
            height
        );

        ctx.fillStyle =
            "#ffffff";

        lines.forEach(
            function (line) {

                const text =
                          line[0];

                const size =
                          line[1];

                const offsetY =
                          line[2];

                ctx.font =
                    "700 " +
                    size +
                    "px 'Noto Sans KR', sans-serif";

                ctx.fillText(
                    text,
                    width / 2,
                    height / 2 +
                    offsetY
                );
            }
        );
    }

    /*
     * 시작 화면
     */

    function drawIdle() {

        draw();

        drawOverlay([
            [
                "🧱 벽돌깨기",
                28,
                -34
            ],
            [
                "화면을 터치하면 시작!",
                16,
                8
            ],
            [
                "패들 가장자리로 받으면 공이 크게 꺾입니다",
                13,
                36
            ]
        ]);
    }

    /*
     * 게임 오버
     */

    function gameOver() {

        gameState = "over";

        playGameOverSound();

        createBurst(
            ball.x,
            Math.min(
                ball.y,
                height - 10
            ),
            "#ff5a5f",
            26,
            280
        );

        screenShake = 14;

        const started =
                  performance.now();

        let previousTime =
                started;

        function deathAnimation(
            now
        ) {

            now =
                now ||
                performance.now();

            const deltaTime =
                      Math.min(
                          0.05,
                          (
                              now -
                              previousTime
                          ) / 1000
                      );

            previousTime = now;

            updateEffects(
                deltaTime
            );

            draw();

            if (
                now -
                started <
                900 &&
                gameState === "over"
            ) {

                requestAnimationFrame(
                    deathAnimation
                );

                return;
            }

            draw();

            drawOverlay([
                [
                    "게임 오버 — " +
                    score.toLocaleString(
                        "ko-KR"
                    ) +
                    "점",
                    26,
                    -34
                ],
                [
                    "레벨 " +
                    level +
                    " 도달",
                    16,
                    2
                ],
                [
                    "터치 또는 Space로 다시 도전",
                    15,
                    32
                ]
            ]);
        }

        requestAnimationFrame(
            deathAnimation
        );
    }

    /*
     * 패들 위치 제한
     */

    function clampPaddle() {

        paddle.x =
            Math.max(
                paddle.width / 2,

                Math.min(
                    width -
                    paddle.width / 2,

                    paddle.x
                )
            );
    }

    /*
     * 포인터 좌표
     */

    function getPointerX(
        event
    ) {

        return (
            event.clientX -
            canvas
            .getBoundingClientRect()
                .left
        );
    }

    /*
     * 마우스 / 터치 입력
     */

    let dragState = null;

    canvas.addEventListener(
        "pointerdown",
        function (event) {

            event.preventDefault();

            canvas.setPointerCapture(
                event.pointerId
            );

            /*
             * 처음 시작 또는
             * 게임 오버 후 다시 시작
             */

            if (
                gameState === "over" ||
                gameState === "idle"
            ) {

                newGame();
                launchBall();

                return;
            }

            /*
             * 목숨을 잃은 뒤
             * 다음 공 발사
             */

            if (
                gameState === "ready"
            ) {

                launchBall();

                return;
            }

            dragState = {
                pointerX:
                    getPointerX(event),

                paddleX:
                paddle.x
            };
        }
    );

    canvas.addEventListener(
        "pointermove",
        function (event) {

            /*
             * 발사 전에는 공과 패들이
             * 같이 움직입니다.
             */

            if (
                gameState === "ready"
            ) {

                paddle.x =
                    getPointerX(event);

                clampPaddle();

                ball.x =
                    paddle.x;

                draw();

                return;
            }

            if (
                gameState !== "playing"
            ) {
                return;
            }

            /*
             * PC 마우스는
             * 클릭하지 않아도 패들 추적
             */

            if (
                event.pointerType ===
                "mouse" &&
                !dragState
            ) {

                paddle.x =
                    getPointerX(event);

                clampPaddle();

                return;
            }

            /*
             * 모바일은 드래그한 거리만큼 이동
             */

            if (!dragState) {
                return;
            }

            paddle.x =
                dragState.paddleX +
                (
                    getPointerX(event) -
                    dragState.pointerX
                ) *
                1.2;

            clampPaddle();
        }
    );

    canvas.addEventListener(
        "pointerup",
        function () {

            dragState = null;
        }
    );

    canvas.addEventListener(
        "pointercancel",
        function () {

            dragState = null;
        }
    );

    /*
     * 키보드
     */

    window.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key ===
                "ArrowLeft" ||
                event.key ===
                "ArrowRight"
            ) {

                keys[event.key] =
                    true;

                event.preventDefault();
            }

            if (
                event.key === " "
            ) {

                event.preventDefault();

                if (
                    gameState === "over" ||
                    gameState === "idle"
                ) {

                    newGame();
                    launchBall();

                } else if (
                    gameState === "ready"
                ) {

                    launchBall();
                }
            }
        }
    );

    window.addEventListener(
        "keyup",
        function (event) {

            keys[event.key] =
                false;
        }
    );

    /*
     * 브라우저 크기 변경
     */

    window.addEventListener(
        "resize",
        function () {

            resizeCanvas();

            paddle.y =
                height - 26;

            paddle.width =
                Math.max(
                    70,
                    width * 0.2
                );

            clampPaddle();

            if (
                gameState === "ready"
            ) {

                ball.x =
                    paddle.x;

                ball.y =
                    paddle.y - 14;
            }

            /*
             * 게임 중 resize 시
             * 기존 벽돌을 재생성하지 않습니다.
             */

            if (
                gameState === "idle"
            ) {

                buildBricks();
                drawIdle();

            } else {

                draw();
            }
        }
    );

    /*
     * 초기화
     */

    function initializeGame() {

        resizeCanvas();

        score = 0;
        level = 1;
        lives = 3;

        paddle = {
            x: width / 2,
            y: height - 26,

            width:
                Math.max(
                    70,
                    width * 0.2
                ),

            height: 12
        };

        buildBricks();
        resetBall();

        gameState = "idle";

        updateHud();
        updateSfxButton();

        drawIdle();
    }

    initializeGame();
</script>
