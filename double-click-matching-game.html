<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>더블클릭 짝맞추기 게임</title>
    <style>
        :root {
            --bg1: #eef7f4;
            --bg2: #f8f4ee;
            --panel: #ffffffdd;
            --text: #263238;
            --muted: #718096;
            --accent: #5b8def;
            --accent2: #88c9b9;
            --success: #31b46d;
            --danger: #e76b6b;
            --card: #ffffff;
            --shadow: 0 14px 34px rgba(44, 62, 80, .10);
        }

        * {
            box-sizing: border-box
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
            "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
            color: var(--text);
            background: radial-gradient(circle at 15% 15%, #dff3ec 0, transparent 30%),
            radial-gradient(circle at 85% 20%, #f8e9db 0, transparent 28%),
            linear-gradient(135deg, var(--bg1), var(--bg2));
            overflow-x: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        button {
            font: inherit;
        }

        .app {
            width: min(96vw, 1500px);
        }

        .screen {
            width: 100%;
            aspect-ratio: 16/9;
            min-height: 560px;
            background: rgba(255, 255, 255, .58);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, .75);
            border-radius: 28px;
            box-shadow: var(--shadow);
            overflow: hidden;
            position: relative;
        }

        .hidden {
            display: none !important
        }

        /* MENU */
        .menu-screen {
            display: grid;
            place-items: center;
            padding: clamp(24px, 4vw, 64px);
        }

        .menu-card {
            width: min(900px, 92%);
            text-align: center;
            background: var(--panel);
            border-radius: 28px;
            padding: clamp(30px, 4vw, 58px);
            box-shadow: 0 12px 32px rgba(42, 58, 72, .08);
        }

        .title {
            font-size: clamp(30px, 4vw, 58px);
            margin: 0 0 12px;
            letter-spacing: -.04em;
        }

        .subtitle {
            font-size: clamp(15px, 1.5vw, 20px);
            color: var(--muted);
            margin: 0 auto 32px;
            line-height: 1.65;
        }

        .category-label {
            font-weight: 800;
            font-size: clamp(18px, 1.8vw, 24px);
            margin-bottom: 18px;
        }

        .category-grid {
            display: grid;
            grid-template-columns:repeat(3, 1fr);
            gap: 16px;
            margin: 0 auto 28px;
        }

        .category-btn {
            border: none;
            border-radius: 22px;
            padding: 24px 14px;
            background: #fff;
            box-shadow: 0 8px 18px rgba(68, 83, 98, .08);
            cursor: pointer;
            transition: .18s ease;
            border: 3px solid transparent;
        }

        .category-btn:hover {
            transform: translateY(-3px);
        }

        .category-btn.selected {
            border-color: var(--accent);
            background: #f5f8ff;
            box-shadow: 0 10px 24px rgba(91, 141, 239, .18);
        }

        .category-emoji {
            display: block;
            font-size: clamp(38px, 5vw, 66px);
            margin-bottom: 10px;
        }

        .category-name {
            font-weight: 900;
            font-size: clamp(16px, 1.6vw, 22px);
        }

        .start-btn {
            border: 0;
            border-radius: 999px;
            padding: 16px 42px;
            background: linear-gradient(135deg, #5b8def, #7ea8f6);
            color: white;
            font-weight: 900;
            font-size: clamp(17px, 1.5vw, 22px);
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(91, 141, 239, .28);
            transition: .18s ease;
        }

        .start-btn:hover {
            transform: translateY(-2px) scale(1.01)
        }

        /* GAME */
        .game-screen {
            display: grid;
            grid-template-rows:auto 1fr auto;
            height: 100%;
            padding: clamp(14px, 1.8vw, 26px);
            gap: clamp(12px, 1.5vw, 20px);
        }

        .topbar {
            background: rgba(255, 255, 255, .78);
            border-radius: 20px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: 0 8px 20px rgba(65, 80, 95, .07);
        }

        .status-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .badge {
            background: #fff;
            border-radius: 999px;
            padding: 9px 14px;
            font-weight: 800;
            font-size: clamp(13px, 1.2vw, 17px);
            white-space: nowrap;
        }

        .badge strong {
            color: var(--accent);
            font-size: 1.1em;
        }

        .top-actions {
            display: flex;
            gap: 8px;
        }

        .small-btn {
            border: 0;
            border-radius: 12px;
            padding: 9px 13px;
            background: #fff;
            color: #44515e;
            font-weight: 800;
            cursor: pointer;
        }

        .board-wrap {
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .board {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns:repeat(10, 1fr);
            grid-template-rows:repeat(10, 1fr);
            gap: clamp(4px, .5vw, 8px);
        }

        .card {
            position: relative;
            border: none;
            background: var(--card);
            border-radius: clamp(7px, .7vw, 13px);
            box-shadow: 0 7px 17px rgba(45, 62, 78, .08);
            cursor: pointer;
            user-select: none;
            overflow: hidden;
            transition: transform .12s ease, box-shadow .15s ease, border-color .2s ease;
            border: 2px solid transparent;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(45, 62, 78, .12);
        }

        .card .emoji {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: clamp(18px, 2.35vw, 40px);
            line-height: 1;
            white-space: nowrap;
            overflow: hidden;
            text-align: center;
            filter: drop-shadow(0 4px 4px rgba(0, 0, 0, .08));
        }

        .card .hint {
            position: absolute;
            right: 10px;
            bottom: 8px;
            font-size: clamp(5px, .38vw, 7px);
            color: #a2aab3;
            font-weight: 700;
            opacity: .8;
        }

        .card.marked {
            border-color: #f2b552;
            box-shadow: 0 0 0 4px rgba(242, 181, 82, .14), 0 8px 20px rgba(60, 70, 80, .10);
        }

        .card.matched {
            border-color: var(--success);
            background: #f2fff7;
            box-shadow: 0 0 0 2px rgba(49, 180, 109, .22),
            0 8px 20px rgba(49, 180, 109, .14);
        }

        .card.cleared {
            visibility: hidden;
            pointer-events: none;
        }


        .card.wrong {
            border-color: var(--danger);
            animation: shake .28s ease;
        }

        @keyframes shake {
            25% {
                transform: translateX(-5px)
            }
            50% {
                transform: translateX(5px)
            }
            75% {
                transform: translateX(-3px)
            }
        }

        .instruction {
            text-align: center;
            color: #687582;
            font-size: clamp(12px, 1.1vw, 16px);
            font-weight: 700;
            padding-bottom: 2px;
        }

        .toast {
            position: absolute;
            left: 50%;
            top: 18%;
            transform: translate(-50%, -50%) scale(.92);
            background: rgba(38, 50, 56, .90);
            color: #fff;
            padding: 11px 18px;
            border-radius: 999px;
            font-weight: 900;
            font-size: clamp(13px, 1.2vw, 17px);
            opacity: 0;
            pointer-events: none;
            transition: .2s ease;
            z-index: 20;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .finish-overlay {
            position: absolute;
            inset: 0;
            background: rgba(245, 250, 248, .82);
            backdrop-filter: blur(8px);
            display: grid;
            place-items: center;
            z-index: 30;
        }

        .finish-card {
            text-align: center;
            width: min(520px, 84%);
            background: #fff;
            border-radius: 26px;
            padding: 40px 28px;
            box-shadow: 0 18px 42px rgba(50, 70, 80, .15);
        }

        .finish-emoji {
            font-size: 70px
        }

        .finish-card h2 {
            font-size: clamp(28px, 3vw, 42px);
            margin: 10px 0 8px;
        }

        .finish-card p {
            color: var(--muted);
            font-size: clamp(15px, 1.4vw, 19px);
            margin: 0 0 24px;
        }

        .finish-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .finish-actions button {
            border: 0;
            border-radius: 999px;
            padding: 12px 22px;
            font-weight: 900;
            cursor: pointer;
        }

        .again {
            background: var(--accent);
            color: #fff
        }

        .menu-back {
            background: #eef1f4;
            color: #42505c
        }

        @media (max-width: 850px) {
            body {
                padding: 8px
            }

            .screen {
                min-height: auto;
                aspect-ratio: 16/9;
                border-radius: 18px;
            }

            .game-screen {
                padding: 10px;
                gap: 8px
            }

            .topbar {
                padding: 8px 10px;
                border-radius: 14px
            }

            .badge {
                padding: 6px 9px
            }

            .small-btn {
                padding: 7px 9px
            }

            .board {
                gap: 2px
            }

            .card {
                border-width: 3px;
                border-radius: 12px
            }

            .card .hint {
                display: none
            }

            .instruction {
                font-size: 10px
            }
        }

        @media (max-width: 620px) {
            .category-grid {
                gap: 9px
            }

            .category-btn {
                padding: 15px 8px;
                border-radius: 15px
            }

            .menu-card {
                padding: 22px 16px
            }

            .subtitle {
                margin-bottom: 18px
            }

            .category-label {
                margin-bottom: 10px
            }

            .topbar {
                align-items: flex-start
            }

            .status-group {
                gap: 5px
            }
        }
    </style>
</head>
<body>
<div class="app">
    <main class="screen">
        <section id="menuScreen" class="menu-screen">
            <div class="menu-card">
                <h1 class="title">🖱️ 더블클릭 짝맞추기</h1>
                <p class="subtitle">
                    같은 그림 2개를 찾아 <b>각각 더블클릭</b>하세요.<br>
                    짝이 맞으면 초록색 테두리가 생기고 점수가 올라갑니다.<br>총 100칸, 50쌍으로 연습합니다.
                </p>

                <div class="category-label">연습할 주제를 선택하세요</div>

                <div class="category-grid">
                    <button class="category-btn selected" data-category="fruit">
                        <span class="category-emoji">🍎</span>
                        <span class="category-name">과일</span>
                    </button>
                    <button class="category-btn" data-category="animal">
                        <span class="category-emoji">🐶</span>
                        <span class="category-name">동물</span>
                    </button>
                    <button class="category-btn" data-category="object">
                        <span class="category-emoji">🧸</span>
                        <span class="category-name">사물</span>
                    </button>
                </div>

                <button id="startBtn" class="start-btn">게임 시작</button>
            </div>
        </section>

        <section id="gameScreen" class="game-screen hidden">
            <div class="topbar">
                <div class="status-group">
                    <div class="badge">주제 <strong id="categoryText">과일</strong></div>
                    <div class="badge">점수 <strong id="scoreText">0</strong></div>
                    <div class="badge">성공 <strong id="matchText">0 / 50</strong></div>
                    <div class="badge">더블클릭 <strong id="doubleText">0</strong></div>
                </div>
                <div class="top-actions">
                    <button id="restartBtn" class="small-btn">다시하기</button>
                    <button id="menuBtn" class="small-btn">메뉴</button>
                </div>
            </div>

            <div class="board-wrap">
                <div id="board" class="board"></div>
            </div>

            <div class="instruction">
                같은 그림을 하나씩 더블클릭해서 2개를 선택하세요.
            </div>

            <div id="toast" class="toast"></div>

            <div id="finishOverlay" class="finish-overlay hidden">
                <div class="finish-card">
                    <div class="finish-emoji">🎉</div>
                    <h2>연습 완료!</h2>
                    <p id="finishText">모든 짝을 찾았습니다.</p>
                    <div class="finish-actions">
                        <button id="againBtn" class="again">한 번 더</button>
                        <button id="finishMenuBtn" class="menu-back">주제 선택</button>
                    </div>
                </div>
            </div>
        </section>
    </main>
</div>

<script>
    const ITEMS = {
        fruit : {
            name : "과일",
            bases: [
                "🍎", "🍏", "🍐", "🍊", "🍋", "🍌", "🍉", "🍇", "🍓", "🍈",
                "🍒", "🍑", "🍍", "🥝", "🍅", "🥑", "🥕", "🌽", "🥔", "🍠",
                "🥒", "🥬", "🥦", "🧄", "🧅", "🍄", "🥜", "🌰", "🍞", "🥐",
                "🥖", "🥨", "🧀", "🥚", "🍳", "🧇", "🥞", "🍕", "🍔", "🌭",
                "🥪", "🌮", "🌯", "🥗", "🍿", "🍙", "🍚", "🍜", "🍣", "🍤"
            ]
        },
        animal: {
            name : "동물",
            bases: [
                "🐶", "🐱", "🐭", "🐹", "🐰", "🦊", "🐻", "🐼", "🐨", "🐯",
                "🦁", "🐮", "🐷", "🐸", "🐵", "🐒", "🐔", "🐧", "🐦", "🐤",
                "🦆", "🦅", "🦉", "🦇", "🐺", "🐗", "🐴", "🐝", "🐞", "🦋",
                "🐌", "🐢", "🐍", "🦎", "🦂", "🦀", "🐙", "🦑", "🐠", "🐟",
                "🐡", "🦈", "🐬", "🐳", "🐊", "🐘", "🦛", "🦏", "🦒", "🦘"
            ]
        },
        object: {
            name : "사물",
            bases: [
                "🧸", "⌚", "📷", "💡", "🎈", "🎁", "✏️", "🔑", "☎️", "🧢",
                "🎧", "📱", "💻", "🖥️", "⌨️", "🖱️", "🔔", "📚", "⚽", "🚗",
                "🚲", "🛴", "🚌", "🚕", "🚜", "✈️", "🚀", "⛵", "🛶", "🏠",
                "🏫", "🏥", "⏰", "⌛", "🔋", "🔌", "🧯", "🪑", "🛏️", "🚪",
                "🪞", "🧹", "🧺", "🧻", "🧼", "🪥", "🧴", "🍽️", "🥄", "📌"
            ]
        }
    };

    const menuScreen = document.getElementById("menuScreen");
    const gameScreen = document.getElementById("gameScreen");
    const board = document.getElementById("board");
    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");
    const menuBtn = document.getElementById("menuBtn");
    const categoryText = document.getElementById("categoryText");
    const scoreText = document.getElementById("scoreText");
    const matchText = document.getElementById("matchText");
    const doubleText = document.getElementById("doubleText");
    const toast = document.getElementById("toast");
    const finishOverlay = document.getElementById("finishOverlay");
    const finishText = document.getElementById("finishText");
    const againBtn = document.getElementById("againBtn");
    const finishMenuBtn = document.getElementById("finishMenuBtn");

    let selectedCategory = "fruit";
    let score = 0;
    let matchedPairs = 0;
    let doubleClicks = 0;
    let selectedCards = [];
    let locked = false;
    const PAIRS_PER_GAME = 50;

    document.querySelectorAll(".category-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".category-btn").forEach(b => b.classList.remove("selected"));
            btn.classList.add("selected");
            selectedCategory = btn.dataset.category;
        });
    });

    function shuffle(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => toast.classList.remove("show"), 900);
    }

    function updateStatus() {
        scoreText.textContent = score;
        matchText.textContent = `${matchedPairs} / ${PAIRS_PER_GAME}`;
        doubleText.textContent = doubleClicks;
    }

    function startGame() {
        score = 0;
        matchedPairs = 0;
        doubleClicks = 0;
        selectedCards = [];
        locked = false;
        finishOverlay.classList.add("hidden");

        const data = ITEMS[selectedCategory];
        categoryText.textContent = data.name;

        // 각 그림은 한 쌍씩만 등장합니다.
        const chosen = shuffle(data.bases).slice(0, PAIRS_PER_GAME);
        const deck = shuffle([...chosen, ...chosen]);

        board.innerHTML = "";

        deck.forEach((emoji, index) => {
            const card = document.createElement("button");
            card.className = "card";
            card.dataset.value = emoji;
            card.dataset.id = index;
            card.innerHTML = `
      <span class="emoji" aria-hidden="true">${emoji}</span>
    `;

            // 일반 클릭은 선택 처리하지 않고, 더블클릭만 인정
            card.addEventListener("click", (e) => {
                e.preventDefault();
            });

            card.addEventListener("dblclick", () => handleDoubleClick(card));
            board.appendChild(card);
        });

        updateStatus();
        menuScreen.classList.add("hidden");
        gameScreen.classList.remove("hidden");
    }

    function handleDoubleClick(card) {
        if (locked || card.classList.contains("cleared")) return;

        doubleClicks++;
        doubleText.textContent = doubleClicks;

        // 첫 선택이 없는 경우: 선택 테두리를 계속 유지
        if (selectedCards.length === 0) {
            card.classList.add("marked");
            selectedCards = [card];
            showToast("같은 그림을 찾아 더블클릭하세요!");
            return;
        }

        const first = selectedCards[0];

        // 같은 카드를 다시 더블클릭하면 선택 취소
        if (card === first) {
            first.classList.remove("marked");
            selectedCards = [];
            showToast("선택을 취소했어요");
            return;
        }

        // 같은 그림이면 성공: 두 칸을 빈자리로 유지
        if (first.dataset.value === card.dataset.value) {
            locked = true;
            card.classList.add("matched");
            first.classList.remove("marked");
            first.classList.add("matched");

            score += 100;
            matchedPairs++;
            updateStatus();
            showToast("성공! +100점");

            setTimeout(() => {
                first.classList.remove("matched");
                card.classList.remove("matched");
                first.classList.add("cleared");
                card.classList.add("cleared");
                selectedCards = [];
                locked = false;

                if (matchedPairs === PAIRS_PER_GAME) {
                    setTimeout(() => {
                        finishText.textContent = `점수 ${score}점 · 더블클릭 ${doubleClicks}회`;
                        finishOverlay.classList.remove("hidden");
                    }, 250);
                }
            }, 450);

            return;
        }

        // 다른 그림이면 첫 번째 선택은 그대로 유지하고,
        // 잘못 고른 카드만 잠깐 빨간 테두리 표시
        card.classList.add("wrong");
        showToast("다른 그림이에요. 첫 선택은 유지됩니다.");

        setTimeout(() => {
            card.classList.remove("wrong");
        }, 450);
    }

    startBtn.addEventListener("click", startGame);
    restartBtn.addEventListener("click", startGame);
    againBtn.addEventListener("click", startGame);

    function goMenu() {
        gameScreen.classList.add("hidden");
        finishOverlay.classList.add("hidden");
        menuScreen.classList.remove("hidden");
    }

    menuBtn.addEventListener("click", goMenu);
    finishMenuBtn.addEventListener("click", goMenu);

    // 브라우저 기본 더블클릭 텍스트 선택 방지
    document.addEventListener("selectstart", e => {
        if (e.target.closest(".card")) e.preventDefault();
    });
</script>
</body>
</html>
