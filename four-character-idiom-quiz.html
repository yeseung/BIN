<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="뜻풀이를 보고 알맞은 사자성어를 고르는 10문제 사자성어 퀴즈입니다.">
    <title>사자성어 퀴즈 챌린지</title>

    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-soft: #f8fafc;
            --text: #1f2937;
            --muted: #6b7280;
            --muted-light: #9ca3af;
            --border: #e5e7eb;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-soft: #eef2ff;
            --primary-border: #c7d2fe;
            --success: #10b981;
            --danger: #ef4444;
            --shadow: 0 22px 50px rgba(15, 23, 42, 0.12);
            --radius: 24px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-width: 320px;
        }

        body {
            min-height: 100dvh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 20px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            "Noto Sans KR",
            sans-serif;
            letter-spacing: -0.03em;
            touch-action: manipulation;
        }

        button {
            font: inherit;
        }

        [hidden] {
            display: none !important;
        }

        .app {
            width: min(100%, 500px);
        }

        .screen {
            animation: fade-in 0.35s ease-out;
        }

        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .start-card,
        .result-card {
            padding: 34px 28px;
            text-align: center;
        }

        .title {
            margin: 0;
            color: var(--primary);
            font-size: clamp(30px, 7vw, 42px);
            font-weight: 900;
            line-height: 1.2;
        }

        .subtitle {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.6;
        }

        .intro-box {
            margin: 26px 0;
            padding: 18px;
            border: 1px solid #e0e7ff;
            border-radius: 16px;
            background: var(--primary-soft);
        }

        .intro-box strong {
            display: block;
            color: #374151;
            font-size: 18px;
        }

        .intro-box span {
            display: block;
            margin-top: 5px;
            color: var(--muted);
            font-size: 14px;
        }

        .button {
            width: 100%;
            min-height: 52px;
            padding: 13px 18px;
            border: 0;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 850;
            transition: transform 0.15s ease,
            background-color 0.15s ease,
            box-shadow 0.15s ease;
        }

        .button:hover {
            background: var(--primary-hover);
        }

        .button:active {
            transform: scale(0.98);
        }

        .button:focus-visible,
        .choice-button:focus-visible {
            outline: 4px solid rgba(79, 70, 229, 0.2);
            outline-offset: 3px;
        }

        .button-primary {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 10px 22px rgba(79, 70, 229, 0.2);
        }

        .game-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .progress-text,
        .score-text {
            font-size: 15px;
            font-weight: 850;
        }

        .score-text {
            color: var(--primary);
        }

        .timer-wrap {
            width: 100%;
            height: 10px;
            margin-bottom: 18px;
            overflow: hidden;
            border-radius: 999px;
            background: #e5e7eb;
        }

        .timer-bar {
            width: 100%;
            height: 100%;
            border-radius: inherit;
            background: var(--primary);
            transform-origin: left center;
            transition: width 0.1s linear;
        }

        .timer-bar.warning {
            background: #f59e0b;
        }

        .timer-bar.danger {
            background: var(--danger);
        }

        .question-card {
            min-height: 190px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 16px;
        }

        .question-label {
            margin: 0 0 8px;
            color: var(--muted-light);
            font-size: 13px;
            font-weight: 750;
        }

        .question-desc {
            margin: 0;
            color: var(--text);
            font-size: clamp(18px, 4.2vw, 22px);
            font-weight: 850;
            line-height: 1.65;
            word-break: keep-all;
        }

        .choices-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .choice-button {
            min-height: 92px;
            padding: 12px 9px;
            border: 2px solid #f1f5f9;
            border-radius: 14px;
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            font-size: 14px;
            font-weight: 850;
            line-height: 1.45;
            word-break: keep-all;
            transition: transform 0.15s ease,
            border-color 0.15s ease,
            background-color 0.15s ease,
            color 0.15s ease,
            opacity 0.15s ease;
        }

        .choice-button:hover:not(:disabled) {
            border-color: var(--primary-border);
            background: var(--primary-soft);
            transform: translateY(-1px);
        }

        .choice-button:disabled {
            cursor: default;
        }

        .choice-button.correct {
            border-color: var(--success);
            background: var(--success);
            color: #ffffff;
        }

        .choice-button.wrong {
            border-color: var(--danger);
            background: var(--danger);
            color: #ffffff;
        }

        .choice-button.dimmed {
            opacity: 0.45;
        }

        .feedback {
            min-height: 24px;
            margin: 12px 0 0;
            text-align: center;
            font-size: 14px;
            font-weight: 800;
        }

        .feedback.correct-text {
            color: #059669;
        }

        .feedback.wrong-text {
            color: #dc2626;
        }

        .feedback.timeout-text {
            color: #d97706;
        }

        .result-title {
            margin: 0;
            font-size: 30px;
            font-weight: 900;
        }

        .final-score {
            margin: 28px 0 16px;
            color: var(--primary);
            font-size: clamp(52px, 13vw, 72px);
            font-weight: 950;
            line-height: 1;
        }

        .result-comment {
            min-height: 54px;
            margin: 0 0 26px;
            color: var(--muted);
            font-size: 16px;
            font-weight: 650;
            line-height: 1.65;
            word-break: keep-all;
        }

        @media (max-width: 460px) {
            body {
                padding: 14px;
            }

            .start-card,
            .result-card {
                padding: 28px 20px;
            }

            .question-card {
                min-height: 170px;
                padding: 21px 19px;
            }

            .choice-button {
                min-height: 84px;
                font-size: 13px;
            }
        }

        @media (max-width: 360px) {
            .choices-grid {
                grid-template-columns: 1fr;
            }

            .choice-button {
                min-height: 64px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
<main class="app">
    <section class="screen card start-card" id="start-screen">
        <h1 class="title">📚 사자성어 퀴즈 1000</h1>
        <p class="subtitle">뜻풀이를 읽고 알맞은 사자성어를 골라보세요.</p>

        <div class="intro-box">
            <strong>총 10문제 도전!</strong>
            <span>한 문제당 제한시간은 20초입니다.</span>
        </div>

        <button class="button button-primary" id="start-button" type="button">
            게임 시작하기
        </button>
    </section>

    <section class="screen" id="game-screen" hidden>
        <div class="game-header">
            <span class="progress-text" id="progress-text">문제 1/10</span>
            <span class="score-text" id="score-text">점수: 0</span>
        </div>

        <div
                class="timer-wrap"
                role="progressbar"
                aria-label="남은 시간"
                aria-valuemin="0"
                aria-valuemax="20"
                aria-valuenow="20"
                id="timer-progress"
        >
            <div class="timer-bar" id="timer-bar"></div>
        </div>

        <article class="card question-card">
            <p class="question-label">Q. 뜻풀이에 맞는 사자성어는?</p>
            <h2 class="question-desc" id="question-desc">설명 로딩 중...</h2>
        </article>

        <div class="choices-grid" id="choices-grid" aria-label="보기"></div>

        <p class="feedback" id="feedback" aria-live="polite"></p>
    </section>

    <section class="screen card result-card" id="result-screen" hidden>
        <h2 class="result-title">결과 리포트</h2>
        <div class="final-score" id="final-score">0점</div>
        <p class="result-comment" id="result-comment">평가 중...</p>

        <button class="button button-primary" id="restart-button" type="button">
            다시 도전하기
        </button>
    </section>
</main>

<script>
    (() => {
        "use strict";

        const CONFIG = Object.freeze({
            totalQuestions  : 10,
            timeLimit       : 20,
            scorePerQuestion: 10,
            choiceCount     : 4,
            feedbackDelay   : 1500,
            timerTick       : 100
        });

        const IDIOM_DATABASE = Object.freeze([
            {word: "고진감래(苦盡甘來)", desc: "쓴 것이 다하면 단 것이 온다는 뜻으로, 고생 끝에 즐거움이 옴을 이르는 말."},
            {word: "결초보은(結草報恩)", desc: "죽은 뒤에라도 은혜를 잊지 않고 갚음을 이르는 말."},
            {word: "각골난망(刻骨難忘)", desc: "입은 은혜가 뼈에 사무쳐 잊혀지지 아니함."},
            {word: "구사일생(九死一生)", desc: "여러 차례 죽을 고비를 넘기고 겨우 살아남."},
            {word: "금상첨화(錦上添花)", desc: "비단 위에 꽃을 더한다는 뜻으로, 좋은 일에 또 좋은 일이 더해짐."},
            {word: "다다익선(多多益善)", desc: "많으면 많을수록 더욱 좋음."},
            {word: "동문서답(東問西答)", desc: "묻는 말에 대하여 전혀 딴판인 말로 대답함."},
            {word: "마이동풍(馬耳東風)", desc: "남의 비평이나 의견을 조금도 귀담아듣지 아니하고 흘려버림."},
            {word: "막상막하(莫上莫下)", desc: "실력이 비슷비슷하여 어느 쪽이 낫고 못함을 가르기 어려움."},
            {word: "사면초가(四面楚歌)", desc: "아무에게도 도움을 받지 못하는 외롭고 곤란한 처지."},
            {word: "설상가상(雪上加霜)", desc: "눈 위에 서리가 내린다는 뜻으로, 불행한 일이 겹침."},
            {word: "오매불망(寤寐不忘)", desc: "자나 깨나 잊지 못함."},
            {word: "유구무언(有口無言)", desc: "입은 있으나 할 말이 없다는 뜻으로, 변명할 여지가 없음."},
            {word: "이심전심(以心傳心)", desc: "마음과 마음으로 서로 뜻이 통함."},
            {word: "일석이조(一石二鳥)", desc: "한 가지 일을 하여 두 가지 이익을 얻음."},
            {word: "자가당착(自家撞着)", desc: "자신의 말이나 행동이 앞뒤가 서로 맞지 아니함."},
            {word: "전화위복(轉禍爲福)", desc: "화가 바뀌어 오히려 복이 됨."},
            {word: "천고마비(天高馬肥)", desc: "하늘은 높고 말은 살찐다는 뜻으로, 가을을 이르는 말."},
            {word: "함흥차사(咸興差使)", desc: "심부름을 간 사람이 소식이 없거나 늦게 돌아옴."},
            {word: "호가호위(狐假虎威)", desc: "남의 권세를 빌려 허세를 부림."},
            {word: "어부지리(漁夫之利)", desc: "둘이 싸우는 사이에 제삼자가 이득을 봄."},
            {word: "온고지신(溫故知新)", desc: "옛것을 익히고 그것을 미루어 새것을 앎."},
            {word: "과유불급(過猶不及)", desc: "정도가 지나침은 미치지 못한 것과 같음."},
            {word: "권선징악(勸善懲惡)", desc: "착한 일을 권장하고 악한 일을 징벌함."},
            {word: "개과천선(改過遷善)", desc: "지난날의 잘못을 고치고 착한 사람이 됨."}
        ]);

        const state = {
            quizSet            : [],
            currentIndex       : 0,
            score              : 0,
            timeLeft           : CONFIG.timeLimit,
            canAnswer          : false,
            timerId            : null,
            nextQuestionTimerId: null
        };

        const elements = {
            startScreen  : document.getElementById("start-screen"),
            gameScreen   : document.getElementById("game-screen"),
            resultScreen : document.getElementById("result-screen"),
            startButton  : document.getElementById("start-button"),
            restartButton: document.getElementById("restart-button"),
            progressText : document.getElementById("progress-text"),
            scoreText    : document.getElementById("score-text"),
            timerProgress: document.getElementById("timer-progress"),
            timerBar     : document.getElementById("timer-bar"),
            questionDesc : document.getElementById("question-desc"),
            choicesGrid  : document.getElementById("choices-grid"),
            feedback     : document.getElementById("feedback"),
            finalScore   : document.getElementById("final-score"),
            resultComment: document.getElementById("result-comment")
        };

        function shuffle(items) {
            const array = [...items];

            for (let index = array.length - 1; index > 0; index -= 1) {
                const randomIndex = Math.floor(Math.random() * (index + 1));
                [array[index], array[randomIndex]] =
                    [array[randomIndex], array[index]];
            }

            return array;
        }

        function showScreen(screenName) {
            elements.startScreen.hidden = screenName !== "start";
            elements.gameScreen.hidden = screenName !== "game";
            elements.resultScreen.hidden = screenName !== "result";
        }

        function clearTimers() {
            window.clearInterval(state.timerId);
            window.clearTimeout(state.nextQuestionTimerId);

            state.timerId = null;
            state.nextQuestionTimerId = null;
        }

        function startGame() {
            clearTimers();

            state.quizSet = shuffle(IDIOM_DATABASE)
            .slice(0, CONFIG.totalQuestions);
            state.currentIndex = 0;
            state.score = 0;
            state.canAnswer = false;

            showScreen("game");
            showQuestion();
        }

        function showQuestion() {
            clearTimers();

            const currentItem = state.quizSet[state.currentIndex];

            state.canAnswer = true;

            elements.progressText.textContent =
                `문제 ${state.currentIndex + 1}/${CONFIG.totalQuestions}`;
            elements.scoreText.textContent = `점수: ${state.score}`;
            elements.questionDesc.textContent = currentItem.desc;
            elements.feedback.textContent = "";
            elements.feedback.className = "feedback";

            renderChoices(currentItem);
            startTimer();
        }

        function renderChoices(currentItem) {
            const wrongChoices = shuffle(
                IDIOM_DATABASE.filter(
                    (item) => item.word !== currentItem.word
                )
            )
            .slice(0, CONFIG.choiceCount - 1)
            .map((item) => item.word);

            const choices = shuffle([
                currentItem.word,
                ...wrongChoices
            ]);

            const fragment = document.createDocumentFragment();

            choices.forEach((choice) => {
                const button = document.createElement("button");

                button.type = "button";
                button.className = "choice-button";
                button.textContent = choice;
                button.dataset.word = choice;

                button.addEventListener("click", () => {
                    checkAnswer(choice, button);
                });

                fragment.appendChild(button);
            });

            elements.choicesGrid.replaceChildren(fragment);

            elements.choicesGrid
            .querySelector(".choice-button")
            ?.focus({preventScroll: true});
        }

        function startTimer() {
            state.timeLeft = CONFIG.timeLimit;

            updateTimerUI();

            state.timerId = window.setInterval(() => {
                state.timeLeft = Math.max(
                    0,
                    state.timeLeft - CONFIG.timerTick / 1000
                );

                updateTimerUI();

                if (state.timeLeft <= 0) {
                    window.clearInterval(state.timerId);
                    state.timerId = null;
                    handleTimeOut();
                }
            }, CONFIG.timerTick);
        }

        function updateTimerUI() {
            const percentage =
                      (state.timeLeft / CONFIG.timeLimit) * 100;

            elements.timerBar.style.width = `${percentage}%`;
            elements.timerProgress.setAttribute(
                "aria-valuenow",
                state.timeLeft.toFixed(1)
            );

            elements.timerBar.classList.toggle(
                "warning",
                state.timeLeft <= 10 && state.timeLeft > 5
            );

            elements.timerBar.classList.toggle(
                "danger",
                state.timeLeft <= 5
            );
        }

        function checkAnswer(selectedWord, selectedButton) {
            if (!state.canAnswer) {
                return;
            }

            state.canAnswer = false;

            window.clearInterval(state.timerId);
            state.timerId = null;

            const correctWord =
                      state.quizSet[state.currentIndex].word;

            disableChoiceButtons();

            if (selectedWord === correctWord) {
                selectedButton.classList.add("correct");

                state.score += CONFIG.scorePerQuestion;
                elements.scoreText.textContent =
                    `점수: ${state.score}`;

                showFeedback("정답입니다!", "correct-text");
            } else {
                selectedButton.classList.add("wrong");
                highlightCorrectAnswer(correctWord);
                showFeedback("아쉽습니다. 정답을 확인해 보세요.", "wrong-text");
            }

            scheduleNextQuestion();
        }

        function handleTimeOut() {
            if (!state.canAnswer) {
                return;
            }

            state.canAnswer = false;

            const correctWord =
                      state.quizSet[state.currentIndex].word;

            disableChoiceButtons();

            Array.from(elements.choicesGrid.children).forEach(
                (button) => {
                    if (button.dataset.word === correctWord) {
                        button.classList.add("correct");
                    } else {
                        button.classList.add("dimmed");
                    }
                }
            );

            showFeedback("시간이 초과되었습니다.", "timeout-text");
            scheduleNextQuestion();
        }

        function disableChoiceButtons() {
            Array.from(elements.choicesGrid.children).forEach(
                (button) => {
                    button.disabled = true;
                }
            );
        }

        function highlightCorrectAnswer(correctWord) {
            Array.from(elements.choicesGrid.children).forEach(
                (button) => {
                    if (button.dataset.word === correctWord) {
                        button.classList.add("correct");
                    }
                }
            );
        }

        function showFeedback(message, className) {
            elements.feedback.textContent = message;
            elements.feedback.className = `feedback ${className}`;
        }

        function scheduleNextQuestion() {
            state.nextQuestionTimerId = window.setTimeout(
                nextQuestion,
                CONFIG.feedbackDelay
            );
        }

        function nextQuestion() {
            state.currentIndex += 1;

            if (state.currentIndex < CONFIG.totalQuestions) {
                showQuestion();
                return;
            }

            showResult();
        }

        function showResult() {
            clearTimers();
            state.canAnswer = false;

            elements.finalScore.textContent = `${state.score}점`;
            elements.resultComment.textContent =
                getResultComment(state.score);

            showScreen("result");
            elements.restartButton.focus();
        }

        function getResultComment(score) {
            if (score === 100) {
                return "완벽합니다! 사자성어 마스터의 경지에 오르셨네요!";
            }

            if (score >= 80) {
                return "훌륭합니다! 대부분의 사자성어를 정확히 알고 계시군요.";
            }

            if (score >= 60) {
                return "준수한 성적입니다. 조금만 더 연습해 볼까요?";
            }

            if (score >= 40) {
                return "나쁘지 않습니다. 고전 공부를 조금 더 해보세요!";
            }

            return "사자성어 학습이 더 필요해 보입니다. 다시 도전해보세요!";
        }

        elements.startButton.addEventListener("click", startGame);
        elements.restartButton.addEventListener("click", startGame);

        window.addEventListener("beforeunload", clearTimers);
    })();
</script>
</body>
</html>
