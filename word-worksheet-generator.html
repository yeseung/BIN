<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>낱말 학습지 생성기</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* 학교안심받아쓰기체 */
        @font-face {
            font-family: 'HakgyoansimBareunbatangR';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimBadasseugiTTF-L.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        @media (max-width: 768px) {
            body {
                padding: 8px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 5px;
            }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 420px 600px;
            gap: 20px;
            height: calc(100vh - 20px);
        }

        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 360px 500px;
                gap: 15px;
            }
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 320px 450px;
                gap: 12px;
            }
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
                gap: 20px;
            }
        }

        .input-panel {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 768px) {
            .input-panel {
                padding: 15px;
                border-radius: 8px;
            }
        }

        @media (max-width: 480px) {
            .input-panel {
                padding: 12px;
                margin: 0 5px;
            }
        }

        .preview-panel {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 768px) {
            .preview-panel {
                padding: 12px;
                border-radius: 8px;
            }
        }

        @media (max-width: 480px) {
            .preview-panel {
                padding: 10px;
                margin: 0 5px;
            }
        }

        h1 {
            color: #4a5568;
            margin-bottom: 20px;
            font-size: 24px;
            text-align: center;
        }

        .input-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        textarea {
            height: 480px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            font-size: 20px;
            line-height: 1.8;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }

        @media (max-width: 768px) {
            textarea {
                height: 300px;
                font-size: 18px;
                padding: 12px;
            }
        }

        @media (max-width: 480px) {
            textarea {
                height: 250px;
                font-size: 16px;
                padding: 10px;
            }
        }

        textarea:focus {
            border-color: #667eea;
        }

        .title-input-section {
            margin-bottom: 20px;
        }

        .title-input-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }

        .title-input-section input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 20px;
            outline: none;
            transition: border-color 0.3s;
        }

        .title-input-section input:focus {
            border-color: #667eea;
        }

        .school-info-section {
            margin-bottom: 20px;
        }

        .school-info-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }

        .school-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 480px) {
            .school-info-grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-item label {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .info-item input {
            padding: 8px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .info-item input:focus {
            border-color: #667eea;
        }

        .color-selection {
            margin-bottom: 20px;
        }

        .color-selection label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }

        .color-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        @media (max-width: 480px) {
            .color-options {
                gap: 8px;
            }
        }

        .color-option {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 8px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .color-option:hover {
            background: #f7fafc;
        }

        .color-option.active {
            border-color: #667eea;
            background: #edf2f7;
        }

        .color-option input[type="radio"] {
            margin: 0;
        }

        .color-option span {
            font-size: 14px;
            font-weight: 500;
        }

        .follow-mode-section {
            margin-bottom: 20px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: 500;
            color: #4a5568;
        }

        .checkbox-container input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .instructions {
            background: #f7fafc;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #4a5568;
        }

        .preview-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .preview-content {
            flex: 1;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 210mm;
            margin: 0 auto;
        }

        .worksheet {
            width: 210mm;
            height: 297mm;
            max-width: 100%;
            margin: 0 auto;
            background: white;
            padding: 15px 5px;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1), 0 6px 20px rgba(0,0,0,0.1);
            border-radius: 2px;
            transform: scale(0.95);
            transform-origin: top center;
        }

        @media (max-width: 1024px) {
            .worksheet {
                transform: scale(0.85);
            }
        }

        @media (max-width: 768px) {
            .worksheet {
                transform: scale(0.75);
                width: 100%;
                max-width: 210mm;
            }
        }

        @media (max-width: 480px) {
            .worksheet {
                transform: scale(0.55);
                margin: -40px auto;
            }
        }

        @media (max-width: 360px) {
            .worksheet {
                transform: scale(0.5);
                margin: -50px auto;
            }
        }



        .worksheet-header {
            margin-bottom: 30px;
            margin-top: 21px;
            padding: 0 25px;
        }

        .title-row {
            width: 100%;
            padding: 15px 0;
            border-top: 3px solid #2d3748;
            border-bottom: 4px double #2d3748;
            text-align: center;
            margin-bottom: 15px;
        }

        .info-row {
            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
            padding: 0 10px;
        }

        .info-section {
            text-align: right;
        }

        .worksheet-title {
            font-size: 36px;
            font-weight: bold;
            color: #2d3748;
            text-align: center;
            margin: 0;
            line-height: 1.2;
        }

        .worksheet-title.long {
            font-size: 32px;
        }

        .worksheet-title.very-long {
            font-size: 28px;
        }

        .school-info {
            font-size: 16px;
            color: #4a5568;
            line-height: 1.4;
            text-align: right;
            margin-bottom: 8px;
        }

        .name-line {
            font-size: 16px;
            color: #4a5568;
            text-align: right;
        }

        .name-underline {
            display: inline-block;
            border-bottom: 2px solid #2d3748;
            width: 120px;
            height: 20px;
            margin-left: 10px;
        }

        .words-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
            padding: 0 20px;
        }

        @media (max-width: 768px) {
            .words-container {
                padding: 0 15px;
                gap: 8px;
            }
        }

        @media (max-width: 480px) {
            .words-container {
                grid-template-columns: repeat(2, 1fr);
                padding: 0 10px;
                gap: 6px;
            }
        }

        .word-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: #f9f9f9;
            text-align: center;
        }

        .word-image {
            width: 120px;
            height: 120px;
            margin-bottom: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            font-size: 60px;
        }

        .word-text {
            width: 100%;
        }



        .word-grid {
            display: flex;
            justify-content: center;
            gap: 0;
            width: 100%;
            margin: 0 auto;
        }

        .letter-box {
            width: 28px;
            height: 32px;
            border: 2px solid #2d3748;
            border-right: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            background: white;
            color: #2d3748;
            font-family: 'HakgyoansimBareunbatangR', 'Nanum Pen Script', cursive;
            text-align: center;
            position: relative;
        }

        .letter-box:last-child {
            border-right: 2px solid #2d3748;
        }

        .letter-box.blue-line::before,
        .letter-box.blue-line::after {
            content: '';
            position: absolute;
            border: 1px dotted #3182ce;
        }

        .letter-box.blue-line::before {
            top: 2px;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 1px dotted #3182ce;
            border-right: none;
            border-top: none;
            border-bottom: none;
        }

        .letter-box.blue-line::after {
            left: 2px;
            right: 2px;
            top: 50%;
            transform: translateY(-50%);
            border-top: 1px dotted #3182ce;
            border-bottom: none;
            border-left: none;
            border-right: none;
        }

        .letter-box.red-line::before,
        .letter-box.red-line::after {
            content: '';
            position: absolute;
            border: 1px dotted #e53e3e;
        }

        .letter-box.red-line::before {
            top: 2px;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 1px dotted #e53e3e;
            border-right: none;
            border-top: none;
            border-bottom: none;
        }

        .letter-box.red-line::after {
            left: 2px;
            right: 2px;
            top: 50%;
            transform: translateY(-50%);
            border-top: 1px dotted #e53e3e;
            border-bottom: none;
            border-left: none;
            border-right: none;
        }

        .letter-box.gray-line::before,
        .letter-box.gray-line::after {
            content: '';
            position: absolute;
            border: 1px dotted #718096;
        }

        .letter-box.gray-line::before {
            top: 2px;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 1px dotted #718096;
            border-right: none;
            border-top: none;
            border-bottom: none;
        }

        .letter-box.gray-line::after {
            left: 2px;
            right: 2px;
            top: 50%;
            transform: translateY(-50%);
            border-top: 1px dotted #718096;
            border-bottom: none;
            border-left: none;
            border-right: none;
        }

        .practice-box {
            width: 50px;
            height: 55px;
            border: 2px solid #2d3748;
            border-right: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            background: white;
            color: #a0aec0;
            font-family: 'HakgyoansimBareunbatangR', 'Nanum Pen Script', cursive;
            text-align: center;
            position: relative;
        }

        .practice-box:last-child {
            border-right: 2px solid #2d3748;
        }

        .practice-box.blue-line::before,
        .practice-box.blue-line::after {
            content: '';
            position: absolute;
            border: 1px dotted #3182ce;
        }

        .practice-box.blue-line::before {
            top: 2px;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 1px dotted #3182ce;
            border-right: none;
            border-top: none;
            border-bottom: none;
        }

        .practice-box.blue-line::after {
            left: 2px;
            right: 2px;
            top: 50%;
            transform: translateY(-50%);
            border-top: 1px dotted #3182ce;
            border-bottom: none;
            border-left: none;
            border-right: none;
        }

        .practice-box.red-line::before,
        .practice-box.red-line::after {
            content: '';
            position: absolute;
            border: 1px dotted #e53e3e;
        }

        .practice-box.red-line::before {
            top: 2px;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 1px dotted #e53e3e;
            border-right: none;
            border-top: none;
            border-bottom: none;
        }

        .practice-box.red-line::after {
            left: 2px;
            right: 2px;
            top: 50%;
            transform: translateY(-50%);
            border-top: 1px dotted #e53e3e;
            border-bottom: none;
            border-left: none;
            border-right: none;
        }

        .practice-box.gray-line::before,
        .practice-box.gray-line::after {
            content: '';
            position: absolute;
            border: 1px dotted #718096;
        }

        .practice-box.gray-line::before {
            top: 2px;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 1px dotted #718096;
            border-right: none;
            border-top: none;
            border-bottom: none;
        }

        .practice-box.gray-line::after {
            left: 2px;
            right: 2px;
            top: 50%;
            transform: translateY(-50%);
            border-top: 1px dotted #718096;
            border-bottom: none;
            border-left: none;
            border-right: none;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            flex: 1;
            min-width: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .controls {
                gap: 8px;
                margin-top: 15px;
            }

            .btn {
                padding: 10px 20px;
                font-size: 18px;
                min-width: 100px;
            }
        }

        @media (max-width: 480px) {
            .controls {
                flex-direction: column;
                gap: 10px;
            }

            .btn {
                padding: 12px 16px;
                font-size: 16px;
                min-width: auto;
                width: 100%;
            }
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #48bb78;
            color: white;
        }

        .btn-secondary:hover {
            background: #38a169;
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            color: #a0aec0;
            font-style: italic;
            padding: 40px;
        }


    </style>

</head>
<body>
<div class="container">
    <div class="input-panel">
        <h1>📝 낱말 글씨 쓰기 학습지</h1>
        <p style="text-align: center; font-size: 12px; color: #718096; margin-top: -10px; margin-bottom: 20px;">- Made by SmartRee with Canva -</p>
        <div class="title-input-section">
            <label for="worksheetTitle">학습지 제목:</label>
            <input
                    type="text"
                    id="worksheetTitle"
                    placeholder="학습지 이름을 입력하세요 (비워두면 '낱말 글씨 쓰기 학습지'로 표시)"
                    maxlength="50"
            />
        </div>
        <div class="school-info-section">
            <label>학교 정보:</label>
            <div class="school-info-grid">
                <div class="info-item">
                    <label for="schoolName">학교: (예) 한국초</label>
                    <input type="text" id="schoolName" placeholder="○○초" maxlength="20">
                </div>
                <div class="info-item">
                    <label for="grade">학년:</label>
                    <input type="number" id="grade" placeholder="1" min="1" max="6">
                </div>
                <div class="info-item">
                    <label for="classNum">반:</label>
                    <input type="number" id="classNum" placeholder="1" min="1" max="20">
                </div>
            </div>
        </div>
        <div class="color-selection">
            <label>점선 색상:</label>
            <div class="color-options">
                <label class="color-option active">
                    <input type="radio" name="lineColor" value="blue" checked>
                    <span style="color: #3182ce;">● 파란색</span>

        '칫솔': '🪥',
        '비누': '🧼',
        '휴지': '🧻',
        '쓰레기통': '🗑️',

        // 20. 의복 (Clothing)
        '옷': '👕',
        '바지': '👖',
        '치마': '👗',
        '신발': '👟',
        '양말': '🧦',
        '모자': '👒',
        '장갑': '🧤',
        '목도리': '🧣',
        '코트': '🧥',
        '잠옷': '👘',
        '속옷': '👙',
        '안경': '👓',

        // 기본값
        'default': '📝'
    };

    function getClipart(word) {
        // 정확한 매칭 먼저 시도
        if (clipartMap[word]) {
            return clipartMap[word];
        }

        // 부분 매칭 시도
        for (let key in clipartMap) {
            if (word.includes(key) || key.includes(word)) {
                return clipartMap[key];
            }
        }

        return clipartMap['default'];
    }

    function createLetterBoxes(word, lineColor = 'blue') {
        return word.split('').map(letter =>
            `<div class="letter-box ${lineColor}-line">${letter}</div>`
        ).join('');
    }

    function createPracticeBoxes(word, lineColor = 'blue', showLetters = false) {
        return word.split('').map(letter =>
            `<div class="practice-box ${lineColor}-line">${showLetters ? letter : ''}</div>`
        ).join('');
    }

    function generatePreview() {
        const input = document.getElementById('wordInput').value.trim();
        const words = input.split('\n')
        .map(word => word.trim())
        .filter(word => word.length > 0)
        .slice(0, 12); // 최대 12개로 제한

        const previewContent = document.getElementById('previewContent');

        if (words.length === 0) {
            previewContent.innerHTML = `
                    <div class="worksheet">
                        <div class="worksheet-header">
                            <div class="title-row">
                                <div class="worksheet-title">낱말 글씨 쓰기 학습지</div>
                            </div>
                            <div class="info-row">
                                <div class="info-section">
                                    <div class="school-info">00초 0학년 0반 (　　)번</div>
                                    <div class="name-line">이름: <span class="name-underline"></span></div>
                                </div>
                            </div>
                        </div>
                        <div class="empty-state">
                            왼쪽에 낱말을 입력하고 '미리보기 생성' 버튼을 클릭하세요
                        </div>
                    </div>
                `;
            return;
        }

        const selectedColor = document.querySelector('input[name="lineColor"]:checked').value;
        const followMode = document.getElementById('followMode').checked;
        const drawingMode = document.getElementById('drawingMode').checked;

        const wordItems = words.map(word => `
                <div class="word-item">
                    <div class="word-image">${drawingMode ? '' : getClipart(word)}</div>
                    <div class="word-text">
                        <div class="word-grid">
                            ${createPracticeBoxes(word, selectedColor, followMode || drawingMode)}
                        </div>
                    </div>
                </div>
            `).join('');

        const worksheetTitle = document.getElementById('worksheetTitle').value.trim() || '낱말 글씨 쓰기 학습지';

        const schoolName = document.getElementById('schoolName').value.trim();
        const grade = document.getElementById('grade').value.trim();
        const classNum = document.getElementById('classNum').value.trim();

        let schoolInfoText = '';
        const displaySchool = schoolName || '00초';
        const displayGrade = grade || '0';
        const displayClass = classNum || '0';
        schoolInfoText = `${displaySchool} ${displayGrade}학년 ${displayClass}반 (　　)번`;

        // 제목 길이에 따른 클래스 결정
        let titleClass = 'worksheet-title';
        if (worksheetTitle.length > 15) {
            titleClass += ' very-long';
        } else if (worksheetTitle.length > 10) {
            titleClass += ' long';
        }

        previewContent.innerHTML = `
                <div class="worksheet" id="worksheet">
                    <div class="worksheet-header">
                        <div class="title-row">
                            <div class="${titleClass}">${worksheetTitle}</div>
                        </div>
                        <div class="info-row">
                            <div class="info-section">
                                <div class="school-info">${schoolInfoText}</div>
                                <div class="name-line">이름: <span class="name-underline"></span></div>
                            </div>
                        </div>
                    </div>
                    <div class="words-container">
                        ${wordItems}
                    </div>
                </div>
            `;
    }

    function clearInput() {
        document.getElementById('wordInput').value = '';
        generatePreview();
    }

    function downloadPDF() {
        const worksheet = document.getElementById('worksheet');
        if (!worksheet) {
            alert('먼저 미리보기를 생성해주세요!');
            return;
        }

        // PDF 생성을 위해 임시로 스케일 제거
        worksheet.style.transform = 'scale(1)';
        worksheet.style.transformOrigin = 'top left';

        const opt = {
            margin: [10, 10, 10, 10],
            filename: '낱말학습지.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: {
                scale: 1.5,
                useCORS: true,
                letterRendering: true,
                width: 794,
                height: 1123,
                scrollX: 0,
                scrollY: 0
            },
            jsPDF: {
                unit: 'pt',
                format: 'a4',
                orientation: 'portrait'
            },
            pagebreak: { mode: 'avoid-all' }
        };

        html2pdf().set(opt).from(worksheet).save().then(() => {
            // PDF 생성 후 원래 스케일로 복원
            worksheet.style.transform = 'scale(0.95)';
            worksheet.style.transformOrigin = 'top center';
        });


    }

    // 입력창에서 엔터키 처리
    document.getElementById('wordInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const lines = this.value.split('\n');
            if (lines.length >= 12) {
                e.preventDefault();
                alert('최대 12개의 낱말까지 입력할 수 있습니다.');
            }
        }
    });

    // 실시간 미리보기 업데이트
    document.getElementById('wordInput').addEventListener('input', function() {
        generatePreview();
    });

    // 제목 입력 실시간 업데이트
    document.getElementById('worksheetTitle').addEventListener('input', function() {
        generatePreview();
    });

    // 학교 정보 실시간 업데이트
    ['schoolName', 'grade', 'classNum'].forEach(id => {
        document.getElementById(id).addEventListener('input', function() {
            generatePreview();
        });
    });

    // 색상 선택 이벤트 리스너
    document.querySelectorAll('input[name="lineColor"]').forEach(radio => {
        radio.addEventListener('change', function() {
            // 활성 상태 업데이트
            document.querySelectorAll('.color-option').forEach(option => {
                option.classList.remove('active');
            });
            this.closest('.color-option').classList.add('active');

            // 미리보기 업데이트
            generatePreview();
        });
    });

    // 따라쓰기 모드 이벤트 리스너
    document.getElementById('followMode').addEventListener('change', function() {
        generatePreview();
    });

    // 그리기 모드 이벤트 리스너
    document.getElementById('drawingMode').addEventListener('change', function() {
        generatePreview();
    });

    // 초기 미리보기 생성
    generatePreview();
</script>


</body>
</html>
