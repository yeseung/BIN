<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>발표 시간 계산기 & MP3 변환기</title>
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #f7f8fa;
            --card: #fff;
            --text: #172033;
            --muted: #667085;
            --line: #e5e7eb;
            --accent: #2563eb;
            --accent-dark: #1d4ed8;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        button, input, textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .container {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
            padding: 40px 0 64px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 24px;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .title-logo {
            width: 42px;
            height: 42px;
            border: 0;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 1px 3px rgba(16, 24, 40, .08);
            font-size: 22px;
        }

        h1 {
            margin: 0;
            font-size: clamp(24px, 4vw, 34px);
            letter-spacing: -.04em;
        }

        h2 {
            margin: 0 0 16px;
            font-size: 18px;
            letter-spacing: -.02em;
        }

        .layout {
            display: grid;
            grid-template-columns:340px minmax(0, 1fr);
            gap: 20px;
            align-items: start;
        }

        .settings-card, .script-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: 0 4px 18px rgba(16, 24, 40, .05);
        }

        .settings-card {
            padding: 24px;
        }

        .script-card {
            padding: 24px;
        }

        .speed-range {
            width: 100%;
            accent-color: var(--accent);
        }

        .speed-text {
            margin: 10px 0 0;
            color: var(--muted);
        }

        .speed-value {
            color: var(--accent);
        }

        .divider {
            border: 0;
            border-top: 1px solid var(--line);
            margin: 22px 0;
        }

        .guide {
            padding: 13px 14px;
            border-radius: 12px;
            background: #f8fafc;
            color: var(--muted);
            font-size: 14px;
        }

        .converter-title {
            margin-bottom: 14px;
        }

        .log-window {
            min-height: 126px;
            max-height: 190px;
            overflow: auto;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #111827;
            color: #e5e7eb;
            font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            white-space: pre-wrap;
        }

        .drop-zone {
            margin-top: 14px;
            padding: 26px 16px;
            border: 2px dashed #cbd5e1;
            border-radius: 14px;
            text-align: center;
            background: #fff;
            transition: .2s ease;
            outline: none;
        }

        .drop-zone:hover, .drop-zone:focus, .drop-zone.drag-over {
            border-color: var(--accent);
            background: #f8fbff;
        }

        .drop-zone-icon {
            display: block;
            font-size: 34px;
            margin-bottom: 8px;
        }

        .drop-zone-text {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
            word-break: break-all;
        }

        .hidden-input {
            display: none;
        }

        .button {
            border: 0;
            border-radius: 12px;
            background: var(--accent);
            color: #fff;
            padding: 12px 16px;
            font-weight: 700;
        }

        .button:hover {
            background: var(--accent-dark);
        }

        .button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .button-full {
            width: 100%;
            margin-top: 14px;
        }

        .script-input {
            display: block;
            width: 100%;
            min-height: 520px;
            resize: vertical;
            border: 1px solid #d0d5dd;
            border-radius: 14px;
            padding: 18px;
            color: var(--text);
            background: #fff;
            outline: none;
            line-height: 1.8;
        }

        .script-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .1);
        }

        .result-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-top: 18px;
        }

        .count-info {
            color: var(--muted);
            font-size: 14px;
        }

        .count-info strong {
            color: var(--text);
        }

        .result-box {
            min-width: 190px;
            padding: 14px 18px;
            border: 1px solid #dbeafe;
            border-radius: 14px;
            background: #f8fbff;
            text-align: right;
        }

        .result-label {
            color: var(--muted);
            font-size: 13px;
        }

        .result-value {
            margin-top: 2px;
            color: var(--accent);
            font-size: 24px;
            font-weight: 800;
        }

        @media (max-width: 860px) {
            .layout {
                grid-template-columns:1fr;
            }

            .script-card {
                order: -1;
            }

            .script-input {
                min-height: 380px;
            }
        }

        @media (max-width: 600px) {
            .container {
                width: min(100% - 20px, 1180px);
                padding-top: 24px;
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
            }

            .header-actions {
                width: 100%;
            }

            .sub-button {
                flex: 1;
            }

            .settings-card, .script-card {
                padding: 18px;
                border-radius: 14px;
            }

            .result-row {
                align-items: stretch;
                flex-direction: column;
            }

            .result-box {
                text-align: left;
                min-width: 0;
            }
        }
    </style>
</head>
<body>
<main class="container">
    <header class="header">
        <div class="title-group">
            <button id="titleLogo" class="title-logo" type="button" aria-label="새로고침">⏱</button>
            <h1>발표 시간 계산기 & MP3 변환기</h1>
        </div>
    </header>
    <div class="layout">
        <aside class="settings-card">
            <section>
                <h2>🎙 말하기 속도 설정</h2>
                <input id="speedRange" class="speed-range" type="range" min="50" max="200" value="100" step="10" aria-label="말하기 속도">
                <p class="speed-text">현재 속도: <strong id="speedValue" class="speed-value">100%</strong></p>
                <hr class="divider">
                <div class="guide"><strong>안내:</strong><br>설정된 속도와 글자 수를 기반으로 실시간 계산됩니다.</div>
            </section>
            <section>
                <hr class="divider">
                <h2 class="converter-title">📦 WAV to MP3 변환</h2>
                <div id="logWindow" class="log-window" aria-live="polite">시스템 준비 중...</div>
                <div id="dropZone" class="drop-zone" role="button" tabindex="0" aria-label="WAV 파일 선택">
                    <span class="drop-zone-icon" aria-hidden="true">📂</span>
                    <p id="dropZoneText" class="drop-zone-text">WAV 파일을 드래그하거나 클릭하여 선택하세요</p>
                    <input id="fileInput" class="hidden-input" type="file" multiple accept=".wav,audio/wav,audio/x-wav">
                </div>
                <button id="convertButton" class="button button-full" type="button">변환 시작 & ZIP 다운로드</button>
            </section>
        </aside>
        <section class="script-card">
            <textarea id="scriptInput" class="script-input" placeholder="스크립트를 입력하거나 붙여넣어 주세요..." aria-label="발표 스크립트"></textarea>
            <div class="result-row">
                <div class="count-info">
                    <span>공백 포함: <strong id="charsWithSpaces">0자 / 0byte</strong></span> |
                    <span>공백 미포함: <strong id="charsWithoutSpaces">0자 / 0byte</strong></span><br>
                    <span>단어수: <strong id="wordCount">0개</strong></span> |
                    <span>문장수: <strong id="sentenceCount">0개</strong></span>
                </div>
                <div class="result-box" aria-live="polite">
                    <div class="result-label">⏱ 예상 발표 시간</div>
                    <div id="timeResult" class="result-value">0초</div>
                </div>
            </div>
        </section>
    </div>
</main>

<script>
    "use strict";

    const BASE_CHARACTER_RATE = 200 / 37;
    const MP3_BITRATE = 128;
    const MP3_SAMPLE_BLOCK_SIZE = 1152;

    const elements = {
        titleLogo: document.getElementById("titleLogo"),

        speedRange        : document.getElementById("speedRange"),
        speedValue        : document.getElementById("speedValue"),
        scriptInput       : document.getElementById("scriptInput"),
        charsWithSpaces   : document.getElementById("charsWithSpaces"),
        charsWithoutSpaces: document.getElementById("charsWithoutSpaces"),
        wordCount         : document.getElementById("wordCount"),
        sentenceCount     : document.getElementById("sentenceCount"),
        timeResult        : document.getElementById("timeResult"),

        logWindow    : document.getElementById("logWindow"),
        dropZone     : document.getElementById("dropZone"),
        dropZoneText : document.getElementById("dropZoneText"),
        fileInput    : document.getElementById("fileInput"),
        convertButton: document.getElementById("convertButton")
    };

    function getByteLength(text) {
        return new TextEncoder().encode(text).length;
    }

    function updateTextStatistics() {
        const text = elements.scriptInput.value;
        const textWithoutSpaces = text.replace(/\s+/g, "");
        const trimmedText = text.trim();

        const words = trimmedText ? trimmedText.split(/\s+/).length : 0;
        const sentences = text
        .split(/[.!?]+/)
        .filter((sentence) => sentence.trim().length > 0)
            .length;

        elements.charsWithSpaces.textContent =
            `${text.length}자 / ${getByteLength(text)}byte`;

        elements.charsWithoutSpaces.textContent =
            `${textWithoutSpaces.length}자 / ${getByteLength(textWithoutSpaces)}byte`;

        elements.wordCount.textContent = `${words}개`;
        elements.sentenceCount.textContent = `${sentences}개`;
    }

    function formatDuration(totalSeconds) {
        if (totalSeconds < 60) {
            return `${totalSeconds}초`;
        }

        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;

        return `${minutes}분 ${seconds}초`;
    }

    function updatePresentationTime() {
        const characterCount =
                  elements.scriptInput.value.replace(/\s+/g, "").length;

        const speedPercent = Number(elements.speedRange.value);

        if (characterCount === 0) {
            elements.timeResult.textContent = "0초";
            return;
        }

        const adjustedRate =
                  BASE_CHARACTER_RATE * (speedPercent / 100);

        const totalSeconds =
                  Math.round(characterCount / adjustedRate);

        elements.timeResult.textContent =
            formatDuration(totalSeconds);
    }

    function updateScriptAnalysis() {
        updateTextStatistics();
        updatePresentationTime();
    }

    function updateSpeed() {
        elements.speedValue.textContent =
            `${elements.speedRange.value}%`;

        updatePresentationTime();
    }

    function writeLog(message) {
        const line = document.createElement("div");
        line.textContent = message;

        elements.logWindow.appendChild(line);
        elements.logWindow.scrollTop =
            elements.logWindow.scrollHeight;
    }

    function initializeConverter() {
        elements.logWindow.textContent = "";
        writeLog("=== 시스템 점검 ===");

        const hasLameJs = typeof window.lamejs !== "undefined";
        const hasJsZip = typeof window.JSZip !== "undefined";

        writeLog(
            hasLameJs
                ? "✅ MP3 인코더 로드됨"
                : "❌ 오류: MP3 인코더를 불러오지 못했습니다."
        );

        writeLog(
            hasJsZip
                ? "✅ 압축 라이브러리 로드됨"
                : "❌ 오류: 압축 라이브러리를 불러오지 못했습니다."
        );

        if (hasLameJs && hasJsZip) {
            writeLog("=== 준비 완료: 파일을 업로드하세요 ===");
            elements.convertButton.disabled = false;
        } else {
            elements.convertButton.disabled = true;
            writeLog("⚠️ 라이브러리 로드 오류로 사용 불가");
        }
    }

    function isWavFile(file) {
        const fileName = file.name.toLowerCase();
        const mimeType = file.type.toLowerCase();

        return (
            fileName.endsWith(".wav") ||
            mimeType === "audio/wav" ||
            mimeType === "audio/x-wav"
        );
    }

    function updateSelectedFileText(files) {
        if (!files || files.length === 0) {
            elements.dropZoneText.textContent =
                "WAV 파일을 드래그하거나 클릭하여 선택하세요";
            return;
        }

        elements.dropZoneText.textContent =
            files.length === 1
                ? files[0].name
                : `${files.length}개의 파일 선택됨`;
    }

    function openFilePicker() {
        elements.fileInput.click();
    }

    function handleDropZoneKeydown(event) {
        if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openFilePicker();
        }
    }

    function handleDragOver(event) {
        event.preventDefault();
        elements.dropZone.classList.add("drag-over");
    }

    function handleDragLeave() {
        elements.dropZone.classList.remove("drag-over");
    }

    function handleDroppedFiles(event) {
        event.preventDefault();
        handleDragLeave();

        const droppedFiles = Array.from(event.dataTransfer.files);

        if (droppedFiles.length === 0) {
            return;
        }

        const dataTransfer = new DataTransfer();

        droppedFiles.forEach((file) => {
            dataTransfer.items.add(file);
        });

        elements.fileInput.files = dataTransfer.files;

        writeLog(`\n📥 ${droppedFiles.length}개의 파일 선택됨`);
        updateSelectedFileText(elements.fileInput.files);
    }

    function handleFileSelection() {
        const files = elements.fileInput.files;

        if (files.length === 0) {
            updateSelectedFileText(files);
            return;
        }

        writeLog(`\n📥 ${files.length}개의 파일 선택됨`);
        updateSelectedFileText(files);
    }

    function floatSamplesToInt16(samples) {
        const output = new Int16Array(samples.length);

        for (let index = 0; index < samples.length; index += 1) {
            const sample = Math.max(-1, Math.min(1, samples[index]));

            output[index] =
                sample < 0
                    ? sample * 0x8000
                    : sample * 0x7fff;
        }

        return output;
    }

    function encodeAudioBufferToMp3(audioBuffer) {
        const channelCount = Math.min(audioBuffer.numberOfChannels, 2);
        const sampleRate = audioBuffer.sampleRate;

        const encoder =
                  new lamejs.Mp3Encoder(
                      channelCount,
                      sampleRate,
                      MP3_BITRATE
                  );

        const leftSamples =
                  audioBuffer.getChannelData(0);

        const rightSamples =
                  channelCount > 1
                      ? audioBuffer.getChannelData(1)
                      : leftSamples;

        const leftData =
                  floatSamplesToInt16(leftSamples);

        const rightData =
                  floatSamplesToInt16(rightSamples);

        const mp3Chunks = [];

        for (
            let offset = 0;
            offset < leftData.length;
            offset += MP3_SAMPLE_BLOCK_SIZE
        ) {
            const leftChunk =
                      leftData.subarray(
                          offset,
                          offset + MP3_SAMPLE_BLOCK_SIZE
                      );

            const rightChunk =
                      rightData.subarray(
                          offset,
                          offset + MP3_SAMPLE_BLOCK_SIZE
                      );

            const encodedChunk =
                      channelCount === 1
                          ? encoder.encodeBuffer(leftChunk)
                          : encoder.encodeBuffer(leftChunk, rightChunk);

            if (encodedChunk.length > 0) {
                mp3Chunks.push(encodedChunk);
            }
        }

        const finalChunk = encoder.flush();

        if (finalChunk.length > 0) {
            mp3Chunks.push(finalChunk);
        }

        return mp3Chunks;
    }

    async function decodeWavFile(file) {
        const AudioContextClass =
                  window.AudioContext ||
                  window.webkitAudioContext;

        if (!AudioContextClass) {
            throw new Error("이 브라우저는 Web Audio API를 지원하지 않습니다.");
        }

        const audioContext =
                  new AudioContextClass();

        try {
            const arrayBuffer =
                      await file.arrayBuffer();

            return await audioContext.decodeAudioData(arrayBuffer);
        } finally {
            if (audioContext.state !== "closed") {
                await audioContext.close();
            }
        }
    }

    function createMp3FileName(fileName) {
        return fileName.replace(/\.wav$/i, ".mp3");
    }

    function downloadBlob(blob, fileName) {
        const objectUrl =
                  URL.createObjectURL(blob);

        const link =
                  document.createElement("a");

        link.href = objectUrl;
        link.download = fileName;

        document.body.appendChild(link);
        link.click();
        link.remove();

        window.setTimeout(() => {
            URL.revokeObjectURL(objectUrl);
        }, 1000);
    }

    async function convertWavFiles() {
        const files =
                  Array.from(elements.fileInput.files);

        if (files.length === 0) {
            alert("파일을 선택해주세요.");
            return;
        }

        elements.convertButton.disabled = true;
        writeLog("\n🚀 작업 시작...");

        const zip = new JSZip();
        const convertedFiles = [];

        try {
            for (let index = 0; index < files.length; index += 1) {
                const file = files[index];

                writeLog(
                    `[${index + 1}/${files.length}] 변환 중: ${file.name}`
                );

                try {
                    if (!isWavFile(file)) {
                        throw new Error("WAV 파일이 아닙니다.");
                    }

                    const audioBuffer =
                              await decodeWavFile(file);

                    const mp3Data =
                              encodeAudioBufferToMp3(audioBuffer);

                    const mp3FileName =
                              createMp3FileName(file.name);

                    const mp3Blob =
                              new Blob(mp3Data, {
                                  type: "audio/mpeg"
                              });

                    convertedFiles.push({
                        name: mp3FileName,
                        blob: mp3Blob
                    });

                    writeLog(`✅ 성공: ${mp3FileName}`);
                } catch (error) {
                    writeLog(
                        `❌ 실패: ${file.name} / ${error.message}`
                    );
                }

                await new Promise((resolve) => {
                    window.setTimeout(resolve, 50);
                });
            }

            if (convertedFiles.length === 0) {
                writeLog("⚠️ 변환된 파일이 없습니다.");
                return;
            }

            if (files.length === 1 && convertedFiles.length === 1) {
                const convertedFile = convertedFiles[0];

                downloadBlob(
                    convertedFile.blob,
                    convertedFile.name
                );
            } else {
                writeLog("\n📦 ZIP 생성 중...");

                convertedFiles.forEach((file) => {
                    zip.file(file.name, file.blob);
                });

                const zipBlob =
                          await zip.generateAsync({
                              type: "blob"
                          });

                downloadBlob(
                    zipBlob,
                    "converted-mp3-files.zip"
                );
            }

            writeLog("=== 작업 완료 ===");
        } finally {
            elements.convertButton.disabled = false;
        }
    }

    function bindEvents() {
        elements.titleLogo.addEventListener("click", () => {
            window.location.reload();
        });

        elements.scriptInput.addEventListener(
            "input",
            updateScriptAnalysis
        );

        elements.speedRange.addEventListener(
            "input",
            updateSpeed
        );

        elements.dropZone.addEventListener(
            "click",
            openFilePicker
        );

        elements.dropZone.addEventListener(
            "keydown",
            handleDropZoneKeydown
        );

        elements.dropZone.addEventListener(
            "dragover",
            handleDragOver
        );

        elements.dropZone.addEventListener(
            "dragleave",
            handleDragLeave
        );

        elements.dropZone.addEventListener(
            "dragend",
            handleDragLeave
        );

        elements.dropZone.addEventListener(
            "drop",
            handleDroppedFiles
        );

        elements.fileInput.addEventListener(
            "change",
            handleFileSelection
        );

        elements.convertButton.addEventListener(
            "click",
            convertWavFiles
        );
    }

    function initializeApp() {
        bindEvents();
        updateScriptAnalysis();
        updateSpeed();
        initializeConverter();
    }

    window.addEventListener(
        "DOMContentLoaded",
        initializeApp
    );
</script>
</body>
</html>
