<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>우주 슈팅 - 갤러그 스타일 무료 웹게임</title>

  <meta
          name="description"
          content="편대를 이루고 급강하하는 외계 함대를 격추하는 갤러그 스타일 무료 우주 슈팅 게임입니다. 발사는 자동이며 방향키와 모바일 드래그로 조종할 수 있습니다."
  >
  <meta
          name="keywords"
          content="우주 슈팅, 갤러그, 슈팅게임, 우주게임, 웹게임, 무료게임, 오락실게임"
  >

  <meta property="og:title" content="🚀 우주 슈팅">
  <meta
          property="og:description"
          content="오락실 갤러그의 그 손맛. 외계 함대를 격추하고 더 높은 웨이브에 도전하세요."
  >
  <meta property="og:type" content="website">

  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="manifest" href="/manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
          href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap"
          rel="stylesheet"
  >

  <style>
    :root {
      --background: #ffffff;
      --surface: #ffffff;
      --surface-soft: #f8fafc;

      --text: #111827;
      --text-soft: #6b7280;

      --border: #e5e7eb;
      --border-dark: #cbd5e1;

      --game-background: #0a0e1e;

      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: var(--background);
      color: var(--text);

      font-family: "Noto Sans KR", sans-serif;
      letter-spacing: -0.04em;
      word-break: keep-all;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: min(100% - 32px, 800px);
      margin: 0 auto;
      padding: 60px 0;
    }

    .page-header {
      margin-bottom: 28px;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;

      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 800;
      line-height: 1.2;
    }

    .lead {
      max-width: 700px;
      margin: 0 auto;

      color: var(--text-soft);

      font-size: 1.05rem;
      line-height: 1.8;
    }

    .card {
      padding: 24px;

      background: var(--surface);

      border: 1px solid var(--border);
      border-radius: var(--radius);

      box-shadow: var(--shadow);
    }

    /* HUD */

    .type-hud {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;

      gap: 8px;

      margin-bottom: 16px;
    }

    .hud-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;

      min-height: 42px;
      padding: 8px 14px;

      background: var(--surface-soft);

      border: 1px solid var(--border);
      border-radius: 14px;

      color: var(--text-soft);

      font-size: 0.88rem;
      white-space: nowrap;
    }

    .hud-item strong {
      color: var(--text);

      font-size: 1rem;
      font-weight: 800;
    }

    .lives {
      letter-spacing: 0;
    }

    .secondary {
      min-height: 42px;
      padding: 8px 13px;

      background: #ffffff;
      color: var(--text);

      border: 1px solid var(--border-dark);
      border-radius: 14px;

      cursor: pointer;

      font-weight: 700;

      transition:
              background 0.15s ease,
              border-color 0.15s ease,
              transform 0.15s ease;
    }

    .secondary:hover {
      background: var(--surface-soft);
      border-color: #94a3b8;
    }

    .secondary:active {
      transform: scale(0.97);
    }

    .secondary:focus-visible {
      outline: 3px solid rgba(15, 23, 42, 0.12);
      outline-offset: 2px;
    }

    .sfx-button {
      width: 44px;
      padding: 7px;

      font-size: 1rem;
      line-height: 1;
    }

    /* GAME */

    .game-wrap {
      width: 100%;

      overflow: hidden;

      background: var(--game-background);

      border-radius: 16px;
    }

    #game {
      display: block;

      width: 100%;

      background: var(--game-background);

      border-radius: 16px;

      cursor: ew-resize;

      touch-action: none;

      user-select: none;
      -webkit-user-select: none;
    }

    .game-help {
      margin: 12px 0 0;

      color: var(--text-soft);

      font-size: 0.85rem;
      line-height: 1.7;
      text-align: center;
    }

    @media (max-width: 650px) {
      .container {
        width: min(100% - 20px, 800px);
        padding: 32px 0;
      }

      .card {
        padding: 14px;
        border-radius: 20px;
      }

      .type-hud {
        display: grid;
        grid-template-columns:
          repeat(4, minmax(0, 1fr))
          42px;

        gap: 5px;
      }

      .hud-item {
        flex-direction: column;
        justify-content: center;

        min-width: 0;
        min-height: 50px;

        padding: 5px 2px;

        font-size: 0.7rem;
      }

      .hud-item strong {
        font-size: 0.84rem;
      }

      .lives {
        font-size: 0.75rem !important;
      }

      .sfx-button {
        width: 42px;
        min-height: 50px;
      }

      .game-help {
        font-size: 0.78rem;
      }
    }

    @media (max-width: 430px) {
      .container {
        width: min(100% - 12px, 800px);
      }

      .card {
        padding: 10px;
      }

      .type-hud {
        grid-template-columns:
          repeat(2, minmax(0, 1fr))
          42px;
      }

      .hud-item {
        flex-direction: row;
      }

      .sfx-button {
        grid-column: 3;
        grid-row: 1 / span 2;

        height: 100%;
      }
    }
  </style>
</head>

<body>

<main class="container">

  <header class="page-header">

    <h1>🚀 우주 슈팅</h1>

    <p class="lead">
      오락실 갤러그의 그 손맛.
      편대를 이루고 흔들리다 급강하하는 외계 함대를 격추하세요.
      발사는 자동 — 당신은 조종에만 집중하면 됩니다.
    </p>

  </header>

  <section
          class="card typing-card"
          aria-label="우주 슈팅 게임"
  >

    <div class="type-hud">

        <span class="hud-item">
          점수
          <strong id="hud-score">0</strong>
        </span>

      <span class="hud-item">
          웨이브
          <strong id="hud-wave">1</strong>
        </span>

      <span class="hud-item">
          목숨
          <strong
                  id="hud-lives"
                  class="lives"
          >
            ❤️❤️❤️
          </strong>
        </span>

      <span class="hud-item">
          최고
          <strong id="hud-best">0</strong>
        </span>

      <button
              id="sfx-btn"
              class="secondary sfx-button"
              type="button"
              aria-label="효과음 켜기"
              aria-pressed="false"
      >
        🔇
      </button>

    </div>

    <div class="game-wrap">

      <canvas
              id="game"
              aria-label="우주 슈팅 게임 화면"
      ></canvas>

    </div>

    <p class="game-help">
      💻 PC: ← → 방향키 ·
      📱 모바일: 화면 드래그로 이동 ·
      🔫 발사는 자동
    </p>

  </section>

</main>

<script>
  "use strict";

  const $ = function (id) {
    return document.getElementById(id);
  };

  const canvas =
                $("game");

  const ctx =
                canvas.getContext("2d");

  /*
   * 개인 최고 점수만 저장
   */

  const BEST_KEY =
                "shooter_best_v1";

  const SFX_KEY =
                "shooter_sfx_v1";

  /*
   * 적 종류
   */

  const ENEMY_EMOJIS = [
    "🛸",
    "👽",
    "👾",
    "👾"
  ];

  /*
   * Canvas
   */

  let width = 0;
  let height = 0;
  let dpr = 1;

  function resizeCanvas() {

    dpr =
            Math.min(
                    2,
                    window.devicePixelRatio || 1
            );

    width =
            canvas.clientWidth;

    height =
            Math.max(
                    380,
                    Math.min(
                            560,
                            Math.round(
                                    window.innerHeight *
                                    0.58
                            )
                    )
            );

    canvas.style.height =
            height + "px";

    canvas.width =
            Math.round(
                    width * dpr
            );

    canvas.height =
            Math.round(
                    height * dpr
            );

    ctx.setTransform(
            dpr,
            0,
            0,
            dpr,
            0,
            0
    );

    ctx.textAlign =
            "center";

    ctx.textBaseline =
            "middle";
  }

  /*
   * 상태
   */

  let state = "idle";

  let player;

  let bullets = [];
  let enemies = [];
  let enemyBullets = [];
  let stars = [];

  let wave = 0;
  let score = 0;
  let lives = 3;

  let lastTimestamp = 0;

  let fireAccumulator = 0;
  let swayTime = 0;

  let invulnerableTime = 0;
  let shakeTime = 0;

  const keys = {};

  /*
   * 효과음
   */

  let sfxEnabled =
              localStorage.getItem(
                      SFX_KEY
              ) === "1";

  let audioContext = null;

  function updateSfxButton() {

    const button =
                  $("sfx-btn");

    button.textContent =
            sfxEnabled
                    ? "🔊"
                    : "🔇";

    button.setAttribute(
            "aria-pressed",
            String(sfxEnabled)
    );

    button.setAttribute(
            "aria-label",
            sfxEnabled
                    ? "효과음 끄기"
                    : "효과음 켜기"
    );
  }

  function getAudioContext() {

    if (!audioContext) {

      const AudioContextClass =
                    window.AudioContext ||
                    window.webkitAudioContext;

      if (!AudioContextClass) {
        return null;
      }

      audioContext =
              new AudioContextClass();
    }

    if (
            audioContext.state ===
            "suspended"
    ) {

      audioContext.resume();
    }

    return audioContext;
  }

  function playTone(
          frequency,
          duration,
          volume,
          type
  ) {

    if (!sfxEnabled) {
      return;
    }

    const context =
                  getAudioContext();

    if (!context) {
      return;
    }

    const oscillator =
                  context.createOscillator();

    const gain =
                  context.createGain();

    oscillator.type =
            type || "sine";

    oscillator.frequency
    .setValueAtTime(
            frequency,
            context.currentTime
    );

    gain.gain
    .setValueAtTime(
            volume,
            context.currentTime
    );

    gain.gain
    .exponentialRampToValueAtTime(
            0.001,
            context.currentTime +
            duration
    );

    oscillator.connect(
            gain
    );

    gain.connect(
            context.destination
    );

    oscillator.start();

    oscillator.stop(
            context.currentTime +
            duration
    );
  }

  function playStartSound() {

    playTone(
            420,
            0.06,
            0.025,
            "sine"
    );
  }

  function playShotSound() {

    playTone(
            520,
            0.025,
            0.008,
            "square"
    );
  }

  function playEnemyDiveSound() {

    playTone(
            270,
            0.08,
            0.015,
            "sawtooth"
    );
  }

  function playHitSound() {

    playTone(
            800,
            0.05,
            0.025,
            "square"
    );
  }

  function playDamageSound() {

    playTone(
            100,
            0.25,
            0.045,
            "sawtooth"
    );
  }

  function playWaveSound() {

    playTone(
            520,
            0.08,
            0.025,
            "sine"
    );

    window.setTimeout(
            function () {

              playTone(
                      760,
                      0.12,
                      0.025,
                      "sine"
              );

            },
            80
    );
  }

  $("sfx-btn")
  .addEventListener(
          "click",
          function () {

            sfxEnabled =
                    !sfxEnabled;

            localStorage.setItem(
                    SFX_KEY,
                    sfxEnabled
                            ? "1"
                            : "0"
            );

            updateSfxButton();

            if (sfxEnabled) {

              playTone(
                      700,
                      0.08,
                      0.03,
                      "sine"
              );
            }
          }
  );

  /*
   * 최고 점수
   */

  function getBestScore() {

    const value =
                  parseInt(
                          localStorage.getItem(
                                  BEST_KEY
                          ),
                          10
                  );

    return Number.isFinite(value)
            ? value
            : 0;
  }

  function saveBestScore() {

    const previousBest =
                  getBestScore();

    if (
            score >
            previousBest
    ) {

      localStorage.setItem(
              BEST_KEY,
              String(score)
      );

      return true;
    }

    return false;
  }

  function updateBestHud() {

    $("hud-best")
            .textContent =
            String(
                    Math.max(
                            score,
                            getBestScore()
                    )
            );
  }

  /*
   * HUD
   */

  function updateHud() {

    $("hud-score")
            .textContent =
            String(score);

    $("hud-wave")
            .textContent =
            String(wave);

    $("hud-lives")
            .textContent =
            lives > 0
                    ? "❤️".repeat(lives)
                    : "—";

    updateBestHud();
  }

  /*
   * 초기화
   */

  function resetGame() {

    player = {
      x:
              width / 2,

      y:
              height - 34,

      width: 30
    };

    bullets = [];
    enemyBullets = [];

    score = 0;
    lives = 3;
    wave = 0;

    fireAccumulator = 0;
    swayTime = 0;

    invulnerableTime = 0;
    shakeTime = 0;

    lastTimestamp = 0;

    stars =
            Array.from(
                    {
                      length: 40
                    },
                    function () {

                      return {
                        x:
                                Math.random() *
                                width,

                        y:
                                Math.random() *
                                height,

                        size:
                                Math.random() *
                                1.4 +
                                0.4,

                        speed:
                                Math.random() *
                                24 +
                                10
                      };
                    }
            );

    nextWave();
  }

  /*
   * 웨이브
   */

  function nextWave() {

    wave++;

    /*
     * 웨이브가 높아질수록
     * 행/열 증가
     */

    const rows =
                  Math.min(
                          4,
                          2 +
                          Math.floor(
                                  wave / 2
                          )
                  );

    const columns =
                  Math.min(
                          8,
                          5 +
                          Math.floor(
                                  wave / 3
                          )
                  );

    const gapX =
                  Math.min(
                          52,
                          (
                                  width - 40
                          ) /
                          columns
                  );

    const gapY = 42;

    enemies = [];

    for (
            let row = 0;
            row < rows;
            row++
    ) {

      for (
              let column = 0;
              column < columns;
              column++
      ) {

        enemies.push({
          homeX:
                  (
                          width -
                          (
                                  columns - 1
                          ) *
                          gapX
                  ) /
                  2 +
                  column *
                  gapX,

          homeY:
                  56 +
                  row *
                  gapY,

          row: row,

          dive: null,

          fireTimer:
                  Math.random() *
                  4 +
                  2,

          x: 0,
          y: 0
        });
      }
    }

    updateHud();
  }

  /*
   * 난이도 배율
   */

  function getSpeedMultiplier() {

    return (
            1 +
            (
                    wave - 1
            ) *
            0.12
    );
  }

  /*
   * 게임 업데이트
   */

  function updateGame(
          deltaMilliseconds
  ) {

    const deltaTime =
                  deltaMilliseconds /
                  1000;

    swayTime +=
            deltaTime;

    if (
            invulnerableTime > 0
    ) {

      invulnerableTime -=
              deltaTime;
    }

    if (
            shakeTime > 0
    ) {

      shakeTime -=
              deltaTime;
    }

    /*
     * 별
     */

    stars.forEach(
            function (star) {

              star.y +=
                      star.speed *
                      deltaTime;

              if (
                      star.y >
                      height
              ) {

                star.y = -2;

                star.x =
                        Math.random() *
                        width;
              }
            }
    );

    /*
     * 자동 발사
     *
     * 300ms 간격
     * 웨이브 5부터 2연발
     */

    fireAccumulator +=
            deltaMilliseconds;

    const fireInterval =
                  300;

    while (
            fireAccumulator >=
            fireInterval
            ) {

      fireAccumulator -=
              fireInterval;

      if (
              wave >= 5
      ) {

        bullets.push(
                {
                  x:
                          player.x - 8,

                  y:
                          player.y - 16
                },
                {
                  x:
                          player.x + 8,

                  y:
                          player.y - 16
                }
        );

      } else {

        bullets.push({
          x:
          player.x,

          y:
                  player.y - 16
        });
      }

      playShotSound();
    }

    /*
     * 내 총알 이동
     */

    bullets.forEach(
            function (bullet) {

              bullet.y -=
                      460 *
                      deltaTime;
            }
    );

    bullets =
            bullets.filter(
                    function (bullet) {

                      return (
                              bullet.y >
                              -12
                      );
                    }
            );

    /*
     * 적 편대
     */

    const speedMultiplier =
                  getSpeedMultiplier();

    const sway =
                  Math.sin(
                          swayTime *
                          (
                                  0.9 *
                                  speedMultiplier
                          )
                  ) *
                  Math.min(
                          34,
                          width * 0.06
                  );

    enemies.forEach(
            function (enemy) {

              /*
               * 급강하 중
               */

              if (
                      enemy.dive
              ) {

                enemy.dive.time +=
                        deltaTime *
                        0.55 *
                        speedMultiplier;

                const diveTime =
                              enemy.dive.time;

                /*
                 * 2차 베지어 곡선
                 */

                const inverse =
                              1 -
                              diveTime;

                enemy.x =
                        inverse *
                        inverse *
                        enemy.dive.startX +

                        2 *
                        inverse *
                        diveTime *
                        enemy.dive.controlX +

                        diveTime *
                        diveTime *
                        enemy.dive.targetX;

                enemy.y =
                        inverse *
                        inverse *
                        enemy.dive.startY +

                        2 *
                        inverse *
                        diveTime *
                        enemy.dive.controlY +

                        diveTime *
                        diveTime *
                        (
                                height + 40
                        );

                /*
                 * 화면 아래까지 내려가면
                 * 편대로 복귀
                 */

                if (
                        diveTime >= 1
                ) {

                  enemy.dive =
                          null;
                }

              } else {

                /*
                 * 편대 좌우 흔들림
                 */

                enemy.x =
                        enemy.homeX +
                        sway *
                        (
                                enemy.row % 2
                                        ? -1
                                        : 1
                        );

                enemy.y =
                        enemy.homeY +
                        Math.sin(
                                swayTime *
                                1.6 +
                                enemy.row
                        ) *
                        4;

                /*
                 * 웨이브가 높아질수록
                 * 급강하 확률 증가
                 */

                if (
                        Math.random() <
                        deltaTime *
                        0.02 *
                        wave
                ) {

                  enemy.dive = {
                    time: 0,

                    startX:
                    enemy.x,

                    startY:
                    enemy.y,

                    controlX:
                            enemy.x +
                            (
                                    Math.random() -
                                    0.5
                            ) *
                            width *
                            0.5,

                    controlY:
                            height *
                            0.55,

                    targetX:
                            player.x +
                            (
                                    Math.random() -
                                    0.5
                            ) *
                            80
                  };

                  playEnemyDiveSound();
                }
              }

              /*
               * 적 사격
               */

              enemy.fireTimer -=
                      deltaTime;

              if (
                      enemy.fireTimer <= 0
              ) {

                enemy.fireTimer =
                        (
                                Math.random() *
                                5 +
                                3
                        ) /
                        speedMultiplier;

                if (
                        enemy.y <
                        height * 0.7
                ) {

                  enemyBullets.push({
                    x:
                    enemy.x,

                    y:
                            enemy.y +
                            12,

                    velocityY:
                            150 +
                            wave *
                            14,

                    velocityX:
                            enemy.dive
                                    ? (
                                            player.x -
                                            enemy.x
                                    ) *
                                    0.25
                                    : 0
                  });
                }
              }
            }
    );

    /*
     * 적 총알 이동
     */

    enemyBullets.forEach(
            function (bullet) {

              bullet.y +=
                      bullet.velocityY *
                      deltaTime;

              bullet.x +=
                      (
                              bullet.velocityX ||
                              0
                      ) *
                      deltaTime;
            }
    );

    enemyBullets =
            enemyBullets.filter(
                    function (bullet) {

                      return (
                              bullet.y <
                              height + 12
                      );
                    }
            );

    /*
     * 내 총알 → 적 충돌
     */

    for (
            const bullet of bullets
            ) {

      const hitIndex =
                    enemies.findIndex(
                            function (enemy) {

                              return (
                                      Math.abs(
                                              enemy.x -
                                              bullet.x
                                      ) < 17 &&
                                      Math.abs(
                                              enemy.y -
                                              bullet.y
                                      ) < 16
                              );
                            }
                    );

      if (
              hitIndex >= 0
      ) {

        const enemy =
                      enemies[
                              hitIndex
                              ];

        /*
         * 급강하 적은 30점
         * 일반 적은 10점
         */

        score +=
                enemy.dive
                        ? 30
                        : 10;

        enemies.splice(
                hitIndex,
                1
        );

        bullet.y =
                -99;

        shakeTime =
                0.12;

        playHitSound();
      }
    }

    /*
     * 적 총알/적 몸체 →
     * 플레이어 충돌
     */

    if (
            invulnerableTime <= 0
    ) {

      const bulletHitIndex =
                    enemyBullets.findIndex(
                            function (bullet) {

                              return (
                                      Math.abs(
                                              bullet.x -
                                              player.x
                                      ) < 14 &&
                                      Math.abs(
                                              bullet.y -
                                              player.y
                                      ) < 14
                              );
                            }
                    );

      const enemyHitIndex =
                    enemies.findIndex(
                            function (enemy) {

                              return (
                                      Math.abs(
                                              enemy.x -
                                              player.x
                                      ) < 20 &&
                                      Math.abs(
                                              enemy.y -
                                              player.y
                                      ) < 18
                              );
                            }
                    );

      if (
              bulletHitIndex >= 0 ||
              enemyHitIndex >= 0
      ) {

        if (
                bulletHitIndex >= 0
        ) {

          enemyBullets.splice(
                  bulletHitIndex,
                  1
          );
        }

        lives--;

        /*
         * 피격 후 1.6초 무적
         */

        invulnerableTime =
                1.6;

        shakeTime =
                0.4;

        playDamageSound();

        updateHud();

        if (
                lives <= 0
        ) {

          gameOver();

          return;
        }
      }
    }

    /*
     * 웨이브 클리어
     */

    if (
            enemies.length === 0
    ) {

      score += 100;

      playWaveSound();

      nextWave();
    }

    updateHud();
  }

  /*
   * 그리기
   */

  function drawGame() {

    /*
     * 우주 배경
     */

    ctx.fillStyle =
            "#0a0e1e";

    ctx.fillRect(
            0,
            0,
            width,
            height
    );

    ctx.save();

    /*
     * 피격 흔들림
     */

    if (
            shakeTime > 0
    ) {

      ctx.translate(
              (
                      Math.random() -
                      0.5
              ) *
              shakeTime *
              14,

              (
                      Math.random() -
                      0.5
              ) *
              shakeTime *
              14
      );
    }

    /*
     * 별
     */

    ctx.fillStyle =
            "rgba(255,255,255,0.6)";

    stars.forEach(
            function (star) {

              ctx.fillRect(
                      star.x,
                      star.y,
                      star.size,
                      star.size
              );
            }
    );

    /*
     * 내 총알
     */

    ctx.fillStyle =
            "#7bd8ff";

    bullets.forEach(
            function (bullet) {

              ctx.fillRect(
                      bullet.x - 1.5,
                      bullet.y - 7,
                      3,
                      12
              );
            }
    );

    /*
     * 적 총알
     */

    ctx.fillStyle =
            "#ff7b7b";

    enemyBullets.forEach(
            function (bullet) {

              ctx.fillRect(
                      bullet.x - 2,
                      bullet.y - 5,
                      4,
                      9
              );
            }
    );

    /*
     * 적
     */

    ctx.font =
            "24px serif";

    enemies.forEach(
            function (enemy) {

              const emoji =
                            enemy.dive
                                    ? "👿"
                                    : (
                                            ENEMY_EMOJIS[
                                                    enemy.row
                                                    ] ||
                                            "👾"
                                    );

              ctx.fillText(
                      emoji,
                      enemy.x,
                      enemy.y
              );
            }
    );

    /*
     * 플레이어
     *
     * 무적 시간에는 깜빡임
     */

    if (
            invulnerableTime <= 0 ||
            (
                    Math.floor(
                            invulnerableTime *
                            10
                    ) %
                    2
            ) === 0
    ) {

      ctx.font =
              "28px serif";

      ctx.fillText(
              "🚀",
              player.x,
              player.y
      );
    }

    ctx.restore();
  }

  /*
   * 오버레이
   */

  function drawOverlay(
          lines
  ) {

    ctx.fillStyle =
            "rgba(5,8,20,0.62)";

    ctx.fillRect(
            0,
            0,
            width,
            height
    );

    ctx.fillStyle =
            "#ffffff";

    lines.forEach(
            function (line) {

              ctx.font =
                      "700 " +
                      line.size +
                      "px 'Noto Sans KR', sans-serif";

              ctx.fillText(
                      line.text,
                      width / 2,
                      height / 2 +
                      line.offset
              );
            }
    );
  }

  /*
   * 시작 화면
   */

  function drawIdle() {

    resetGame();

    drawGame();

    drawOverlay([
      {
        text:
                "🚀 우주 슈팅",
        size: 28,
        offset: -30
      },
      {
        text:
                "화면을 터치하면 출격!",
        size: 16,
        offset: 10
      },
      {
        text:
                "드래그·방향키로 이동, 발사는 자동",
        size: 13,
        offset: 36
      }
    ]);
  }

  /*
   * 게임 오버
   */

  function gameOver() {

    state =
            "over";

    const isBest =
                  saveBestScore();

    updateHud();

    drawGame();

    drawOverlay([
      {
        text:
                "게임 오버 — " +
                score +
                "점",

        size: 26,
        offset: -38
      },
      {
        text:
                "웨이브 " +
                wave +
                "까지 도달",

        size: 16,
        offset: 0
      },
      {
        text:
                isBest
                        ? "🎉 최고 점수 갱신!"
                        : "터치해서 다시 출격",

        size: 15,
        offset: 32
      }
    ]);
  }

  /*
   * 게임 루프
   */

  function frame(
          timestamp
  ) {

    if (
            state !== "playing"
    ) {
      return;
    }

    if (!lastTimestamp) {

      lastTimestamp =
              timestamp;
    }

    const deltaTime =
                  Math.min(
                          50,
                          timestamp -
                          lastTimestamp
                  );

    lastTimestamp =
            timestamp;

    /*
     * 키보드 이동
     */

    if (
            keys.ArrowLeft
    ) {

      player.x -=
              340 *
              deltaTime /
              1000;
    }

    if (
            keys.ArrowRight
    ) {

      player.x +=
              340 *
              deltaTime /
              1000;
    }

    player.x =
            Math.max(
                    16,
                    Math.min(
                            width - 16,
                            player.x
                    )
            );

    updateGame(
            deltaTime
    );

    if (
            state !== "playing"
    ) {
      return;
    }

    drawGame();

    requestAnimationFrame(
            frame
    );
  }

  /*
   * 시작
   */

  function startGame() {

    if (
            state === "playing"
    ) {
      return;
    }

    resetGame();

    state =
            "playing";

    playStartSound();

    requestAnimationFrame(
            frame
    );
  }

  /*
   * 키보드 입력
   */

  window.addEventListener(
          "keydown",
          function (event) {

            if (
                    event.key ===
                    "ArrowLeft" ||
                    event.key ===
                    "ArrowRight"
            ) {

              event.preventDefault();

              keys[
                      event.key
                      ] = true;

              if (
                      state !== "playing"
              ) {

                startGame();
              }

              return;
            }

            if (
                    event.key === " " &&
                    state !== "playing"
            ) {

              event.preventDefault();

              startGame();
            }
          }
  );

  window.addEventListener(
          "keyup",
          function (event) {

            keys[
                    event.key
                    ] = false;
          }
  );

  /*
   * 모바일 / 마우스 드래그
   */

  let drag = null;

  canvas.addEventListener(
          "pointerdown",
          function (event) {

            event.preventDefault();

            canvas.setPointerCapture(
                    event.pointerId
            );

            if (
                    state !== "playing"
            ) {

              startGame();

              /*
               * 첫 터치는 게임 시작에만 사용
               */
              return;
            }

            const rect =
                          canvas.getBoundingClientRect();

            const scaleX =
                          width /
                          rect.width;

            drag = {
              pointerX:
                      (
                              event.clientX -
                              rect.left
                      ) *
                      scaleX,

              playerX:
              player.x
            };
          }
  );

  canvas.addEventListener(
          "pointermove",
          function (event) {

            if (
                    !drag ||
                    state !== "playing"
            ) {
              return;
            }

            const rect =
                          canvas.getBoundingClientRect();

            const scaleX =
                          width /
                          rect.width;

            const pointerX =
                          (
                                  event.clientX -
                                  rect.left
                          ) *
                          scaleX;

            /*
             * 상대 드래그 방식
             *
             * 손가락 바로 아래에
             * 우주선이 가려지지 않음
             */

            player.x =
                    drag.playerX +
                    (
                            pointerX -
                            drag.pointerX
                    );

            player.x =
                    Math.max(
                            16,
                            Math.min(
                                    width - 16,
                                    player.x
                            )
                    );
          }
  );

  canvas.addEventListener(
          "pointerup",
          function () {

            drag = null;
          }
  );

  canvas.addEventListener(
          "pointercancel",
          function () {

            drag = null;
          }
  );

  /*
   * 브라우저 크기 변경
   */

  window.addEventListener(
          "resize",
          function () {

            resizeCanvas();

            if (
                    state === "idle"
            ) {

              drawIdle();

              return;
            }

            if (player) {

              player.y =
                      height - 34;

              player.x =
                      Math.max(
                              16,
                              Math.min(
                                      width - 16,
                                      player.x
                              )
                      );
            }

            if (
                    state === "over"
            ) {

              drawGame();

              drawOverlay([
                {
                  text:
                          "게임 오버 — " +
                          score +
                          "점",

                  size: 26,
                  offset: -38
                },
                {
                  text:
                          "웨이브 " +
                          wave +
                          "까지 도달",

                  size: 16,
                  offset: 0
                },
                {
                  text:
                          "터치해서 다시 출격",

                  size: 15,
                  offset: 32
                }
              ]);
            }
          }
  );

  /*
   * 초기화
   */

  function initializeGame() {

    resizeCanvas();

    updateSfxButton();

    updateBestHud();

    drawIdle();
  }

  initializeGame();
</script>
